:root {
  --bg: #05080c;
  --surface: rgba(12, 18, 26, 0.9);
  --surface-solid: #0c121a;
  --surface-2: rgba(22, 32, 44, 0.85);
  --surface-3: #1b2836;
  --border: rgba(120, 170, 200, 0.16);
  --border-strong: rgba(120, 170, 200, 0.32);

  --text: #e4ecf2;
  --text-muted: #a6b5c2;
  --text-subtle: #8796a6;

  --accent: #2fd0f0;
  --accent-hover: #6fe0f6;
  --accent-soft: rgba(47, 208, 240, 0.12);
  --accent-line: rgba(47, 208, 240, 0.55);
  --on-accent: #02141a;

  --success: #46c35a;
  --success-soft: rgba(70, 195, 90, 0.13);
  --warning: #e8b84a;
  --warning-soft: rgba(232, 184, 74, 0.13);
  --danger: #ff7d73;
  --danger-soft: rgba(255, 125, 115, 0.13);
  --unknown: #b79af2;
  --unknown-soft: rgba(183, 154, 242, 0.13);

  --cut: 8px;
  --focus-ring: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);

  --font-ui: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --font-hud: "Rajdhani", "Inter", system-ui, sans-serif;
  --font-mono: "Share Tech Mono", "SFMono-Regular", Consolas, monospace;

  --sidebar-w: 240px;
  --topbar-h: 56px;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  color: var(--text);
  font: 14px/1.5 var(--font-ui);
  -webkit-font-smoothing: antialiased;
  background:
    radial-gradient(1200px 700px at 85% -10%, rgba(30, 90, 140, 0.22), transparent 60%),

function coverage(m) {
  const stock = stockOn() ? m.stock : 0;
  const bought = purchases().filter(p => p.item === m.name).reduce((s, p) => s + p.qty, 0);
  return { stock, bought, missing: Math.max(0, m.required - stock - bought) };
}
function materialCost() {
  let total = 0;
  for (const m of DATA.mats) {
    const bought = purchases().filter(p => p.item === m.name);
    const rest = m.required - bought.reduce((s, p) => s + p.qty, 0);
    if (rest > 0 && priceOf(m) === null) return null;
    total += bought.reduce((s, p) => s + p.qty * p.unit, 0) + Math.max(0, rest) * (priceOf(m) ?? 0);

}
function jobsCost() {
  let c = 0;
  if (['active', 'done'].includes(jobState('t1'))) c += DATA.jobCosts.t1;
  const f = jobState('final');
  if (f === 'unknown') return null;
  if (['active', 'done'].includes(f)) c += DATA.divisions.length * DATA.jobCosts.final;
  return c;
}
const plannedJobsCost = () => DATA.jobCosts.t1 + DATA.divisions.length * DATA.jobCosts.final;
function finance() {
  const sl = sales();
  const revenue = sl.reduce((s, x) => s + x.qty * x.unit, 0);
  const market = sl.filter(x => x.channel === 'market').reduce((s, x) => s + x.qty * x.unit, 0);
  const fees = (DATA.fees.broker + DATA.fees.tax) / 100;
  const taxes = market * fees + sl.filter(x => x.channel === 'contract').reduce((s, x) => s + (x.fees ?? 0), 0);
  const mat = materialCost(), inv = DATA.invention.computed, jobs = jobsCost();
  const rental = rentalCost(), rentalPlanned = team() ? DATA.team.rental.total : 0;
  const production = mat === null || jobs === null ? null : inv + mat + jobs + rental;
  const productionPlanned = mat === null ? null : inv + mat + plannedJobsCost() + rentalPlanned;
  const sold = sl.reduce((s, x) => s + x.qty, 0), unsold = PROJECT.runs - sold;
  const profit = personal() || !sl.length || production === null ? null : revenue - taxes - production;

  const forecast = productionPlanned === null ? null : PROJECT.runs * JITA() * (1 - fees) - productionPlanned;

}

  if (S.t === 3 && !S.moved) q.push({ lvl: 'warning', ic: 'move', what: `Déplacer 50 Hammerhead I vers « ${esc(PROJECT.container)} »`, sub: `livrés dans le hangar de ${esc(PROJECT.structure)} · Hammerhead II s’installe depuis le container`, btn: 'C’est fait', act: 'moved' });
  if (S.t === 1) q.push({ lvl: 'info', ic: 'play', what: 'Lancer Hammerhead I · 50 runs', sub: `minerais en stock · ${esc(CHARS.alpha)} : 10 slots de fabrication libres · 3 h 51`, btn: 'Voir le plan', act: 'go-plan' });

  if (S.t === 6) q.push({ lvl: 'info', ic: 'flag', what: `Clôturer « ${esc(PROJECT.name)} »`, sub: 'tout est produit et vendu · profit final connu', btn: 'Terminer', act: 'close' });
  if (team() && S.t === 4) q.unshift({ lvl: 'warning', ic: 'users', what: 'Revoir la location de lignes de Personnage Delta', sub: `${esc(PROJECT.name)} · 5 jobs de 4 h 37 · facteur par jour + 100 000 ISK/run = ${isk(DATA.team.rental.total)} · apport déclaré`, btn: 'Revoir', act: 'go-team' });
  if (team() && S.t === 1) q.push({ lvl: 'info', ic: 'users', what: 'Demande d’adhésion · Personnage Echo (Corp C)', sub: `${esc(PROJECT.name)} · via le lien d’invitation`, btn: 'Voir', act: 'go-team' });

  if (S.converted) return [1, false, 'Ouvert à la corpo · suivi dans le groupe'];

/* ---------- Cockpit ---------- */
function railPhases() {
  const covered = DATA.mats.filter(m => coverage(m).missing === 0).length;
  const t1 = jobState('t1'), fin = jobState('final'), f = finance();
  const prodDone = (t1 === 'done' ? 1 : 0) + (fin === 'done' ? 5 : 0);
  return [
    ['Préparer', stockOn() ? 'stock lu, invention faite' : 'coller ou lire le stock', stockOn()],
    ['Approvisionner', `${covered} / ${DATA.mats.length} matériaux couverts`, covered === DATA.mats.length, S.t === 3 && covered < DATA.mats.length],
    ['Produire', fin === 'unknown' ? 'statut inconnu (jeton)' : `${prodDone} / 6 jobs livrés`, prodDone === 6],
    ['Vendre', personal() ? 'usage personnel' : `${f.sold} / ${PROJECT.runs} vendus`, personal() || f.unsold === 0],
    ['Clôturer', S.t >= 7 ? 'terminé le 07/11' : 'à faire', S.t >= 7]
  ];
}
function renderRail() {
  const ph = railPhases();
  const cur = ph.findIndex(p => !p[2]);
  return `<div class="rail">${ph.map((p, i) => `<div class="st ${p[2] ? 'done' : p[3] ? 'block' : i === cur ? 'cur' : ''}"><b>${p[2] ? '✓ ' : ''}${p[0]}</b><span>${p[1]}</span></div>`).join('')}</div>`;
}

  if (S.t === 4) return { title: `5 jobs en cours · fin ${clock(T.finalEnd)}`, text: `Préparer la vente : Jita ${isk(JITA())}, seuil de rentabilité ${isk(f.breakEven)} par unité.`, timer: T.finalEnd, btns: [['Finances', 'go-fin', true]] };
  if (S.t === 5) return { title: 'Rattacher le contrat · 20 Hammerhead II', text: 'Contrat item exchange terminé le 05/11 à 22:10, 14,96 M, sans taxe de vente.', btns: [['Rattacher', 'link-s2', true], ['Simuler', 'go-fin']] };

  return { title: 'Projet terminé', text: `Clôturé le 07/11 à 21:40 · profit ${isk(f.profit)}.`, btns: [['Copier le récapitulatif', 'copy-recap', true], ['Dupliquer', 'noop']] };

      <div class="actions">${avatars()}<button class="btn btn-ghost" data-act="modal" data-arg="invite">${icon('users')}Inviter</button><button class="btn btn-ghost">${icon('copy')}Dupliquer</button>${done ? '<span class="chip chip-success">Terminé</span>' : `<button class="btn" data-act="close">${icon('flag')}Terminer</button>`}</div></div>

/* ---------- Chaîne ---------- */
function node(cls, title, sub, extra = '') { return `<div class="node ${cls}" data-act="to-tree" style="cursor:pointer" title="Ouvrir dans l’arbre des jobs"><span class="nm" title="${esc(title)}">${title}</span>${sub ? `<span class="sub">${sub}</span>` : ''}${extra}</div>`; }
function stateCls(st) { return { done: 'done', active: 'act', todo: 'idle', unknown: 'unknown' }[st]; }
function stateTxt(st, end) { return { done: `<span class="ok">✓ livré ${clock(end).slice(5)}</span>`, active: `<span class="acc">en cours · fin ${clock(end).slice(5)}</span>`, todo: '<span class="subtle">à lancer</span>', unknown: '<span class="unk">statut inconnu</span>' }[st]; }
function progress(a, b) { const p = Math.max(0, Math.min(100, (nowMin() - a) / (b - a) * 100)); return `<div class="bar"><i style="width:${p}%"></i></div>`; }
function renderChain() {
  const t1 = jobState('t1'), fin = jobState('final'), f = finance();
  const group = (title, names) => {
    const ms = DATA.mats.filter(m => names.includes(m.name));
    const ok = ms.every(m => coverage(m).missing === 0);
    const unk = ms.some(m => priceOf(m) === null && coverage(m).missing > 0);
    return node(unk ? 'unknown' : ok ? 'done' : 'block', title, `<div class="mat">${ms.map(m => { const c = coverage(m); return `<span>${whoChip(m.name)}${m.name}</span><span class="${c.missing ? 'warn' : 'ok'}">${c.missing ? `−${fmtN(c.missing)}` : '✓'}</span>`; }).join('')}</div>`);
  };
  const invention = node(stockOn() || S.t >= 0 ? 'done' : 'idle', 'Invention', `${whoChip('invention')}15 tentatives · 34 % · 2 + 2 datacores<br>→ 5 BPC de 10 runs · ${isk(DATA.invention.computed)}`);
  const t1node = node(stateCls(t1), 'Hammerhead I ×50', `${whoChip('t1')}<span class="ok">fabriquer ${isk(DATA.buyVsBuild.list[0].build)} &lt; acheter ${isk(DATA.buyVsBuild.list[0].buy)}</span><br>${stateTxt(t1, T.t1End)} · ME 10 · ${isk(DATA.jobCosts.t1)}${t1 === 'done' ? `<br>${S.moved ? `<span class="ok">dans « ${esc(PROJECT.container)} »</span>` : `<span class="warn">dans le hangar : à déplacer</span>`}` : ''}`, t1 === 'active' ? progress(T.t1Start, T.t1End) : '');
  const finNode = node(fin === 'todo' && S.t === 3 ? 'block' : stateCls(fin), 'Hammerhead II ×50', `${whoChip('final')}${team() ? `<span class="subtle">lignes de ${esc(CHARS.delta)}</span><br>` : ''}${fin === 'todo' && S.t === 3 ? '<span class="warn">bloqué : 50 PAU manquants</span>' : stateTxt(fin, T.finalEnd)} · 5 jobs × 10 runs${fin !== 'todo' && fin !== 'unknown' ? ` · ${isk(5 * DATA.jobCosts.final)}` : ''}`, fin === 'active' ? progress(T.finalStart, T.finalEnd) : '');
  const sell = personal() ? node('done', 'Usage personnel', 'pas de vente') : node(f.unsold === 0 ? 'done' : f.sold ? 'act' : 'idle', `Vente · ${f.sold} / ${PROJECT.runs}`, sales().map(s => `${whoChip(s.id)}${s.qty} ${s.channel === 'contract' ? 'contrat' : 'marché'} · ${isk(s.qty * s.unit)}`).join('<br>') || 'aucune vente rattachée');
  const head = `<div class="card-head"><h2>Chaîne de production ${A(5)}</h2><div class="actions"><div class="segmented"><button aria-pressed="${S.chain === 'flow'}" data-act="chain" data-arg="flow">Vue d’ensemble</button><button aria-pressed="${S.chain === 'tree'}" data-act="chain" data-arg="tree">Arbre des jobs</button></div><span class="freshness">${icon('clock')}${MOMENTS[S.t].label}</span></div></div>`;
  if (S.chain === 'tree') return `<div class="card">${head}${renderJobTree()}</div>`;
  return `<div class="card">${head}<div class="card-body">
    <div class="flow"><div class="col"><span class="lbl">Invention · matériaux</span>${invention}${group('Minerais', ['Tritanium', 'Pyerite', 'Mexallon', 'Isogen', 'Zydrine'])}</div><div class="arr">›</div>
      <div class="col"><span class="lbl">Composants achetés</span>${group('Commodités et minéraux', ['Robotics', 'Guidance Systems', 'Morphite'])}${group('Composants avancés', ['Particle Accelerator Unit', 'R.A.M.- Robotics'])}</div><div class="arr">›</div>
      <div class="col"><span class="lbl">Intermédiaire</span>${t1node}${node('done', 'Hammerhead I (BPO)', 'BPO ME 10 dans « Prod HH » : pas de copie')}</div><div class="arr">›</div>
      <div class="col"><span class="lbl">Produit</span>${finNode}</div><div class="arr">›</div>
      <div class="col"><span class="lbl">Vente</span>${sell}</div></div>
    ${renderBuyVsBuild()}
    <div class="legend" style="margin-top:14px"><span><i style="background:var(--success)"></i>livré, couvert</span><span><i style="background:var(--accent)"></i>en cours</span><span><i style="background:var(--warning)"></i>bloqué, manquant</span><span><i style="background:var(--unknown)"></i>inconnu</span></div></div></div>`;
}

function structureChoice() {
  const st = DATA.structures, base = st.compare[0], best = st.compare.find(c => c.key === st.best);

  const chosen = S.allowOutside && gain >= st.minGain ? best.key : 'A';

function renderStructures() {
  const { st, best, gain, chosen } = structureChoice();
  const rows = st.list.map((s, i) => { const c = st.compare[i];
    return `<tr ${s.key === chosen ? 'aria-selected="true"' : ''}><td class="name-col"><span class="truncate"><b>${esc(s.key === 'A' ? PROJECT.structure : s.name)}</b>${s.key === chosen ? ' <span class="acc">★</span>' : ''}</span><small class="subtle">${s.kind} · ${s.system}${s.favorite ? ' · préféré' : ` · ${s.jumps} saut${s.jumps > 1 ? 's' : ''}`}</small></td>
      <td class="subtle" style="white-space:normal">−${s.role} % rôle${s.rig ? ` · −${nf2.format(s.rig)} % ${s.rigLabel}` : ` · ${s.rigLabel}`}</td><td class="r">${isk(c.materials)}</td><td class="r">${isk(c.install)}<div class="subtle" style="font-size:11px">indice ${pct(s.index)} · taxe ${pct(s.tax)}</div></td>
      <td class="r">${c.transport ? isk(c.transport) : '<span class="subtle">—</span>'}<div class="subtle" style="font-size:11px">${fmtN(c.m3)} m³${s.jumps ? ` × ${s.jumps}` : ''}</div></td><td class="r"><b>${isk(c.total)}</b></td><td class="r ${c.delta < 0 ? 'delta-up' : c.delta > 0 ? 'delta-down' : ''}">${c.delta ? (c.delta > 0 ? '+' : '') + isk(c.delta) : '—'}</td></tr>`; }).join('');
  const banner = gain > 0 && chosen === 'A'
    ? `<div class="banner banner-warning" style="margin:12px 16px">${icon('alert')}<div class="grow"><b>${esc(best.key === 'C' ? 'Structure C' : best.key)} reviendrait ${isk(gain)} moins cher</b>, transport compris (${st.list.find(s => s.key === best.key).jumps} sauts, hors système préféré). ${S.allowOutside ? `Économie sous le seuil du projet (${isk(st.minGain)}) : on reste en ${esc(PROJECT.structure)}.` : 'Non retenue : le projet n’accepte que le système préféré.'}</div><button class="btn btn-sm" data-act="allow-outside">${S.allowOutside ? 'Revenir au système préféré' : 'Autoriser pour ce projet'}</button></div>`
    : chosen !== 'A' ? `<div class="banner banner-info" style="margin:12px 16px">${icon('info')}<div class="grow"><b>Structure C retenue</b> : économie ${isk(gain)} ≥ seuil ${isk(st.minGain)}. Le plan serait recalculé (quantités au bonus de C, transport ajouté au coût) ; la maquette garde les chiffres de A.</div><button class="btn btn-sm" data-act="allow-outside">Revenir au système préféré</button></div>` : '';
  const health = DATA.structureHealth.map(h => h.state === 'unknown' ? `<li class="lvl-unknown"><span class="sev sev-unknown">${icon('info')}</span><div class="what"><strong>${esc(h.name)}</strong><span>carburant et services inconnus : structure d’une autre corpo, rôle Station_Manager absent</span></div></li>`
    : `<li class="lvl-${h.state}"><span class="sev sev-${h.state}">${icon('alert')}</span><div class="what"><strong>${esc(h.name === 'Structure A' ? PROJECT.structure : h.name)} · ${h.state === 'danger' ? h.services : `carburant ${nf.format(h.fuelDays)} j`}</strong><span>${h.state === 'danger' ? 'les jobs d’invention et de copie prévus ici ne peuvent pas démarrer' : `${h.services} · les 5 jobs finissent dans 3 h, mais le prochain projet tombera après le carburant`}</span></div></li>`).join('');

/* ---------- Finances ---------- */
function waterfall(f) {
  const steps = [['Revenu', f.revenue], ['Taxes', -f.taxes], ['Matériaux', -f.mat], ['Invention', -f.inv], ['Jobs', -(f.jobs ?? 0)], ...(f.rental ? [['Location', -f.rental]] : [])];
  const W = 1100, H = 260, pad = 20, top = 24, bottom = 34;
  let acc = 0; const levels = [0];
  steps.forEach(s => { acc += s[1]; levels.push(acc); });
  const max = Math.max(...levels), min = Math.min(0, ...levels);
  const y = v => top + (H - top - bottom) * (max - v) / (max - min);
  const gap = (W - pad * 2) / (steps.length + 1), bw = gap * .56;
  const label = (x, v, yy) => `<text class="v" x="${x}" y="${yy}" text-anchor="middle">${v}</text>`;
  let svg = `<line x1="${pad}" x2="${W - pad}" y1="${y(0)}" y2="${y(0)}" stroke="rgba(166,181,194,.55)"/>`;
  acc = 0;
  steps.forEach((s, i) => {
    const from = acc, to = acc + s[1];
    const yA = y(Math.max(from, to)), yB = y(Math.min(from, to));
    const xi = pad + i * gap + (gap - bw) / 2;
    svg += `<rect x="${xi}" y="${yA}" width="${bw}" height="${Math.max(1, yB - yA)}" fill="${i === 0 ? '#2fd0f0' : '#ff7d73'}" opacity="${i === 0 ? .85 : .72}"/>`;
    svg += label(xi + bw / 2, (i ? '−' : '') + isk(Math.abs(s[1])).replace(/<[^>]+>/g, ''), yA - 6);
    svg += `<text x="${xi + bw / 2}" y="${H - 8}" text-anchor="middle">${s[0].toUpperCase()}</text>`;
    svg += `<line x1="${xi + bw}" x2="${xi + gap}" y1="${y(to)}" y2="${y(to)}" stroke="rgba(166,181,194,.4)" stroke-dasharray="3 3"/>`;
    acc = to;
  });
  const xp = pad + steps.length * gap + (gap - bw) / 2;
  const yT = y(Math.max(acc, 0)), yBt = y(Math.min(acc, 0));
  svg += `<rect x="${xp}" y="${yT}" width="${bw}" height="${Math.max(1, yBt - yT)}" fill="${acc >= 0 ? '#46c35a' : '#ff7d73'}"/>`;
  svg += label(xp + bw / 2, isk(acc).replace(/<[^>]+>/g, ''), acc >= 0 ? yT - 6 : yBt + 16);
  svg += `<text x="${xp + bw / 2}" y="${H - 8}" text-anchor="middle" style="fill:#fff">${f.unsold ? 'PROFIT PROVISOIRE' : 'PROFIT'}</text>`;
  return `<svg class="wf" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cascade du revenu au profit">${svg}</svg>`;
}

function plainRecap() {

function discordHtml(md) {
  const inline = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code class="dc-ic">$1</code>');
  const out = []; let code = null;
  md.split('\n').forEach(l => {
    if (l.startsWith('```')) { if (code === null) code = []; else { out.push(`<pre class="dc-code">${esc(code.join('\n'))}</pre>`); code = null; } return; }
    if (code !== null) { code.push(l); return; }
    if (l.startsWith('## ')) out.push(`<div class="dc-h2">${inline(l.slice(3))}</div>`);
    else if (l.startsWith('-# ')) out.push(`<div class="dc-sub">${inline(l.slice(3))}</div>`);
    else if (l.startsWith('> ')) out.push(`<div class="dc-quote">${inline(l.slice(2))}</div>`);
    else if (l.startsWith('- ')) out.push(`<div class="dc-li">• ${inline(l.slice(2))}</div>`);
    else if (!l.trim()) out.push('<div style="height:6px"></div>');
    else out.push(`<div>${inline(l)}</div>`);
  });
  return out.join('');
}

}

/* ---------- V3.5 · suivi du contrat de courrier ---------- */
function courierState() { return S.t === 0 ? null : DATA.courier.filter(c => c.t <= S.t).slice(-1)[0]; }
function courierChip() {
  const c = courierState();
  if (!c) return '<span class="chip chip-neutral">pas encore créé</span>';
  return c.status === 'finished' ? '<span class="chip chip-success">livré · compté</span>' : c.status === 'in_progress' ? '<span class="chip chip-info">en route · non compté</span>' : '<span class="chip chip-warning">en attente · non compté</span>';
}
function courierTimeline() {
  const c = courierState();
  if (!c) return '';
  const steps = DATA.courier.map(x => `<div class="row" style="gap:8px;font-size:12px"><span class="${x.t <= S.t ? 'ok' : 'subtle'}">${x.t <= S.t ? '✓' : '○'}</span><span class="${x.t <= S.t ? '' : 'subtle'}">${x.label}</span></div>`).join('');
  return `<div class="stack" style="gap:2px;border-top:1px solid var(--border);padding-top:8px">${steps}<p class="hint" style="margin:4px 0 0">Statut lu dans les contrats ESI (scope déjà demandé). La récompense entre dans le coût seulement à la livraison ; un contrat échoué remet le transport à 0 et alerte.</p></div>`;
}

  const ck = (ok, t) => `<div class="check">${ok ? `<span class="chip chip-success">${icon('check')}ok</span>` : '<span class="chip chip-warning">à voir</span>'}<span>${t}</span></div>`;
  return `<div class="ov"><div class="bk" data-act="close-modal"></div><div class="card modal" style="max-width:620px"><div class="card-head"><h2>Terminer le projet</h2><div class="actions"><button class="icon-btn" data-act="close-modal">${icon('x')}</button></div></div><div class="card-body">
    ${ck(jobState('t1') === 'done' && jobState('final') === 'done', '6 jobs livrés (ESI)')}${ck(true, 'Copie Hammerhead I (BPC) ignorée : fabriqué depuis le BPO')}${ck(f.unsold === 0, f.unsold ? `${f.unsold} Hammerhead II invendus` : `Tout est vendu : ${PROJECT.runs} / ${PROJECT.runs}`)}${ck(f.production !== null, 'Aucun coût inconnu')}
    <div class="row sb" style="padding-top:8px;border-top:1px solid var(--border-strong)"><span class="hudt">Profit final</span><span class="bignum ${f.profit >= 0 ? 'ok' : 'bad'}" style="font-size:24px">${isk(f.profit)} · ${pct(f.pct)}</span></div>
    <p class="hint" style="margin:0">Le projet passe en lecture seule et part dans « Terminés » ; il reste duplicable.</p></div>
    <div class="card-head" style="border-bottom:0;border-top:1px solid var(--border)"><div class="actions"><button class="btn btn-ghost" data-act="close-modal">Annuler</button><button class="btn btn-primary" data-hash="p=14">Terminer le projet</button></div></div></div></div>`;
}

/* ---------- Rendu ---------- */
function render() {
  renderMockbar();
  document.documentElement.style.setProperty('--mbh', document.getElementById('mockbar').offsetHeight + 'px');
  document.body.classList.toggle('show-annot', S.annot);
  const root = document.getElementById('root');
  if (S.view === 'compagnon') root.innerHTML = renderCompanionPage();
  else root.innerHTML = S.view === 'projet' ? renderShell(renderCockpit(), ['Production', 'Industrie', PROJECT.name]) : S.view === 'hangars' ? renderShell(renderHangars(), ['Production', 'Industrie', 'Hangars corpo']) : S.view === 'blueprints' ? renderShell(renderBlueprints(), ['Production', 'Industrie', 'Blueprints']) : S.view === 'skills' ? renderShell(renderSkills(), ['Production', 'Industrie', 'Compétences']) : S.view === 'revenus' ? renderShell(renderReport(), ['Économie', 'Revenus', S.revTab === 'industry' ? 'Industrie' : 'Vue d’ensemble']) : renderShell(renderAtelier(), ['Production', 'Industrie', 'Atelier']);
  document.getElementById('modal').innerHTML = S.modal === 'create' ? renderCreate() : S.modal === 'close' ? renderClose() : S.modal === 'invite' ? renderInvite() : '';
  titleTruncated();
  updateClocks();
}
function titleTruncated() {
  document.querySelectorAll('.truncate, .account .who b, .account .who small, .breadcrumb [aria-current], .node .nm').forEach(n => {
    if (n.scrollWidth > n.clientWidth + 1) n.title = n.textContent.trim();
  });
}
let tickStart = Date.now();
function cd(sec) { sec = Math.max(0, Math.round(sec)); return [Math.floor(sec / 3600), Math.floor(sec % 3600 / 60), sec % 60].map(v => String(v).padStart(2, '0')).join(':'); }
function updateClocks() {
  const now = nowMin() * 60 + (Date.now() - tickStart) / 1000;
  document.querySelectorAll('[data-end]').forEach(el => { const left = parseFloat(el.dataset.end) * 60 - now; el.textContent = left > 0 ? 'dans ' + cd(left) : 'terminé'; });
}
setInterval(updateClocks, 1000);
function toast(msg) {
  const box = document.getElementById('toasts');
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; box.appendChild(t);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => t.remove(), 5000);
}

function applyHash() {
  const p = new URLSearchParams(location.hash.replace(/^#/, ''));
  const keep = S ? { notesOpen: S.notesOpen, frontOpen: S.frontOpen } : {};
  S = Object.assign(baseState(), keep);
  tickStart = Date.now();
  S.long = p.get('long') === '1';
  S.annot = p.get('annot') !== '0';
  if (p.get('notes') === '1') S.notesOpen = true;
  if (p.get('front') === '1') S.frontOpen = true;
  applyNames(S.long);
  const n = parseInt(p.get('p') || '0', 10);
  if (n) applyStep(Math.min(LAST_STEP, Math.max(1, n)));
  if (p.get('t')) { S.t = Math.min(7, Math.max(0, parseInt(p.get('t'), 10))); applyMoment(); }
  if (p.get('v')) { S.view = p.get('v'); if (!n) S.step = 0; }
  if (p.get('tab')) { S.tab = p.get('tab'); S.view = 'projet'; }
  if (p.get('s')) S.state = p.get('s');
  if (p.get('team')) S.team = parseInt(p.get('team'), 10);
  if (S.team > 1 && S.t === 3) S.reserved = { 'Particle Accelerator Unit': { charlie: 30 } };
  if (p.get('size')) S.size = p.get('size');
  if (p.get('modal')) S.modal = p.get('modal') === 'none' ? null : p.get('modal');
  render();
  window.scrollTo(0, 0);
}
function go(h) { if (location.hash === '#' + h) applyHash(); else location.hash = h; }
function setParam(k, v) { const p = new URLSearchParams(location.hash.replace(/^#/, '')); if (v === null) p.delete(k); else p.set(k, v); go(p.toString()); }
document.addEventListener('click', e => {
  const h = e.target.closest('[data-hash]');
  if (h) { go(h.dataset.hash); return; }
  const a = e.target.closest('[data-act]');
  if (!a || a.disabled || ['moment', 'state', 'sim-price', 'use-stock', 'keep', 'discord-transfers', 'allow-outside-box'].includes(a.dataset.act)) return;
  const arg = a.dataset.arg;
  switch (a.dataset.act) {
    case 'start': go('p=1'); break;
    case 'next': go('p=' + Math.min(LAST_STEP, (S.step || 0) + 1)); break;
    case 'prev': go('p=' + Math.max(1, S.step - 1)); break;
    case 'long': setParam('long', S.long ? null : '1'); break;
    case 'annot': setParam('annot', S.annot ? '0' : null); break;
    case 'notes': S.notesOpen = !S.notesOpen; render(); break;
    case 'front': S.frontOpen = !S.frontOpen; render(); break;
    case 'tab': S.view = 'projet'; S.tab = arg; S.focus = null; render(); break;
    case 'select': S.selected = arg; render(); break;
    case 'modal': S.modal = arg; render(); break;
    case 'close': S.modal = 'close'; render(); break;
    case 'close-modal': S.modal = null; render(); break;
    case 'moved': S.moved = true; render(); toast('Déplacement noté · revérifié à la prochaine sync des assets'); break;
    case 'copy-mb': S.copied = true; render(); toast('Liste multibuy copiée'); break;
    case 'copy-recap': S.recapCopied = true; render(); toast(S.recapFormat === 'plain' ? 'Récapitulatif copié' : 'Récapitulatif copié · à coller dans Discord'); break;
    case 'link-s2': S.links.S2 = true; render(); toast('Contrat rattaché comme vente · sans taxe'); break;
    case 'go-mat': S.view = 'projet'; S.tab = 'materiaux'; render(); break;
    case 'go-plan': S.view = 'projet'; S.tab = 'planning'; render(); break;
    case 'go-fin': S.view = 'projet'; S.tab = 'finances'; render(); break;
    case 'sim-ch': S.simChannel = arg; render(); break;
    case 'chain': S.chain = arg; render(); break;
    case 'to-tree': S.chain = 'tree'; render(); break;
    case 'tree-toggle': S.treeClosed[arg] = !S.treeClosed[arg]; render(); break;
    case 'tree-all': S.treeClosed = arg === 'close' ? { hh2: false, mat: true, hh1: true, inv: true } : {}; render(); break;
    case 'keep': S.keepSolo = arg === '1'; render(); break;
    case 'team': setParam('team', arg); break;
    case 'team-local': S.team = parseInt(arg, 10); render(); break;
    case 'reserve': { const box = [...document.querySelectorAll('[data-qty]')].find(x => x.dataset.qty === arg); const rest = parseInt(box?.max || '0', 10); const q = Math.max(1, Math.min(rest, parseInt(box?.value || '0', 10) || rest)); const r = S.reserved[arg] = S.reserved[arg] || {}; r.alpha = (r.alpha || 0) + q; render(); toast(`${arg} : ×${q} réservés par vous · visible de toute l’équipe`); break; }
    case 'bp-filter': S.bpFilter = arg; render(); break;
    case 'opp-sort': S.oppSort = arg; render(); break;
    case 'copy-price': toast(`Prix ${nf.format(parseInt(arg, 10))} copié · à coller dans l’ordre en jeu`); break;
    case 'rev-tab': S.view = 'revenus'; S.revTab = arg; render(); break;
    case 'rev-period': S.revPeriod = parseInt(arg, 10); render(); break;
    case 'go-view': S.view = arg; S.modal = null; render(); break;
    case 'make-stockpile': S.modal = 'create'; S.doctrine = false; render(); toast('Projet pré-rempli : Hobgoblin II ×80 pour le Stockpile'); break;
    case 'go-blueprints': S.view = 'blueprints'; S.modal = null; render(); break;
    case 'list-filter': S.listFilter = arg; render(); break;
    case 'opp-market': S.oppMarket = arg; render(); break;
    case 'decryptor': S.decryptor = arg; render(); break;
    case 'create-tab': S.doctrine = arg === 'doctrine' ? true : arg === 'tpl' ? 'tpl' : false; render(); break;
    case 'go-sales': S.view = 'projet'; S.tab = 'ventes'; render(); break;
    case 'go-hangars': S.view = 'hangars'; S.modal = null; render(); break;
    case 'allow-outside': S.allowOutside = !S.allowOutside; render(); break;
    case 'recap-format': S.recapFormat = arg; S.recapCopied = false; render(); break;
    case 'go-team': S.view = 'projet'; S.tab = 'equipe'; render(); break;
  }
});
document.addEventListener('change', e => {
  const a = e.target.closest('[data-act]');
  if (!a) return;
  if (a.dataset.act === 'moment') setParam('t', a.value);
  if (a.dataset.act === 'state') setParam('s', a.value === 'normal' ? null : a.value);
  if (a.dataset.act === 'use-stock') { S.useStock = a.checked; render(); }
  if (a.dataset.act === 'allow-outside-box') { S.allowOutside = a.checked; render(); }
  if (a.dataset.act === 'discord-transfers') { S.discordTransfers = a.checked; render(); }
  if (a.dataset.act === 'keep') { S.keepSolo = a.dataset.arg === '1'; render(); }
});
document.addEventListener('input', e => {
  if (e.target.dataset.act === 'sim-price') { S.simPrice = parseInt(e.target.value, 10); const y = window.scrollY; render(); window.scrollTo(0, y); document.querySelector('[data-act=sim-price]').focus(); }
});
document.addEventListener('keydown', e => {
  if (e.target.closest('input, select, textarea')) return;
  if (e.key === 'ArrowRight' && S.step < LAST_STEP) go('p=' + ((S.step || 0) + 1));
  if (e.key === 'ArrowLeft' && S.step > 1) go('p=' + (S.step - 1));
  if (e.key === 'Escape' && S.modal) { S.modal = null; render(); }
});
window.addEventListener('hashchange', applyHash);
applyHash();
</script>
</body>
</html>
