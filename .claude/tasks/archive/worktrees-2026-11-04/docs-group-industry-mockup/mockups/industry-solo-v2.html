:root {
  --bg: #05080c;
  --surface: rgba(12, 18, 26, 0.9);
  --surface-solid: #0c121a;
  --surface-2: rgba(22, 32, 44, 0.85);
  --surface-3: #1b2836;
  --border: rgba(120, 170, 200, 0.16);
  --border-strong: rgba(120, 170, 200, 0.32);

  --text: #e4ecf2;
  --text-muted: #a6b5c2;
  --text-subtle: #8796a6;

  --accent: #2fd0f0;
  --accent-hover: #6fe0f6;
  --accent-soft: rgba(47, 208, 240, 0.12);
  --accent-line: rgba(47, 208, 240, 0.55);
  --on-accent: #02141a;

  --success: #46c35a;
  --success-soft: rgba(70, 195, 90, 0.13);
  --warning: #e8b84a;
  --warning-soft: rgba(232, 184, 74, 0.13);
  --danger: #ff7d73;
  --danger-soft: rgba(255, 125, 115, 0.13);
  --unknown: #b79af2;
  --unknown-soft: rgba(183, 154, 242, 0.13);

  --cut: 8px;
  --focus-ring: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);

  --font-ui: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --font-hud: "Rajdhani", "Inter", system-ui, sans-serif;
  --font-mono: "Share Tech Mono", "SFMono-Regular", Consolas, monospace;

  --sidebar-w: 240px;
  --topbar-h: 56px;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  color: var(--text);
  font: 14px/1.5 var(--font-ui);
  -webkit-font-smoothing: antialiased;
  background:
    radial-gradient(1200px 700px at 85% -10%, rgba(30, 90, 140, 0.22), transparent 60%),

/* ---------- Données dérivées ---------- */
const nowMin = () => MOMENTS[S.t].now;
const personal = () => S.state === 'personal_use';
const stockOn = () => S.t >= 1;
const priceOf = m => S.state === 'missing_price' && m.name === 'Particle Accelerator Unit' ? null : m.price;
function jobState(kind) {
  const n = nowMin();
  const [a, b] = kind === 't1' ? [T.t1Start, T.t1End] : [T.finalStart, T.finalEnd];
  if (S.state === 'token_expired' && kind === 'final' && n >= a) return 'unknown';
  return n >= b ? 'done' : n >= a ? 'active' : 'todo';
}
const purchases = () => DATA.purchases.filter(p => S.links[p.id]);
const sales = () => personal() ? [] : DATA.sales.filter(s => S.links[s.id]);
function coverage(m) {
  const stock = stockOn() ? m.stock : 0;
  const bought = purchases().filter(p => p.item === m.name).reduce((s, p) => s + p.qty, 0);
  return { stock, bought, missing: Math.max(0, m.required - stock - bought) };
}
function materialCost() {
  let total = 0;
  for (const m of DATA.mats) {
    const bought = purchases().filter(p => p.item === m.name);
    const rest = m.required - bought.reduce((s, p) => s + p.qty, 0);
    if (rest > 0 && priceOf(m) === null) return null;
    total += bought.reduce((s, p) => s + p.qty * p.unit, 0) + Math.max(0, rest) * (priceOf(m) ?? 0);
  }
  return total;
}
function jobsCost() {
  let c = 0;
  if (['active', 'done'].includes(jobState('t1'))) c += DATA.jobCosts.t1;
  const f = jobState('final');
  if (f === 'unknown') return null;
  if (['active', 'done'].includes(f)) c += DATA.divisions.length * DATA.jobCosts.final;
  return c;
}
const plannedJobsCost = () => DATA.jobCosts.t1 + DATA.divisions.length * DATA.jobCosts.final;
function finance() {
  const sl = sales();
  const revenue = sl.reduce((s, x) => s + x.qty * x.unit, 0);
  const market = sl.filter(x => x.channel === 'market').reduce((s, x) => s + x.qty * x.unit, 0);
  const fees = (DATA.fees.broker + DATA.fees.tax) / 100;
  const taxes = market * fees + sl.filter(x => x.channel === 'contract').reduce((s, x) => s + (x.fees ?? 0), 0);
  const mat = materialCost(), inv = DATA.invention.computed, jobs = jobsCost();
  const production = mat === null || jobs === null ? null : inv + mat + jobs;
  const productionPlanned = mat === null ? null : inv + mat + plannedJobsCost();
  const sold = sl.reduce((s, x) => s + x.qty, 0), unsold = PROJECT.runs - sold;
  const profit = personal() || !sl.length || production === null ? null : revenue - taxes - production;
  const breakEven = productionPlanned === null ? null : productionPlanned / (PROJECT.runs * (1 - fees));
  const forecast = productionPlanned === null ? null : PROJECT.runs * 760000 * (1 - fees) - productionPlanned;
  return { revenue, market, taxes, mat, inv, jobs, production, productionPlanned, sold, unsold, profit, pct: profit === null ? null : profit / (production + taxes) * 100, breakEven, forecast, fees };
}
function simulate(price, channel) {
  const f = finance();
  if (f.production === null) return null;
  const extra = f.unsold * price;
  const taxes = f.taxes + (channel === 'market' ? extra * f.fees : 0);
  const revenue = f.revenue + extra;
  const profit = revenue - taxes - f.productionPlanned;
  return { revenue, taxes, profit, pct: profit / (f.productionPlanned + taxes) * 100 };
}

const nf = new Intl.NumberFormat('fr-FR');
const nf2 = new Intl.NumberFormat('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtN = v => nf.format(Math.round(v));
const UNK = '<span class="chip chip-unknown">inconnu</span>';
function isk(v) {
  if (v === null || v === undefined) return UNK;
  const a = Math.abs(v), sg = v < 0 ? '−' : '';
  if (a >= 1e9) return sg + nf2.format(a / 1e9) + ' Md';
  if (a >= 1e6) return sg + nf2.format(a / 1e6) + ' M';
  if (a >= 1e3) return sg + nf.format(Math.round(a / 100) / 10) + ' k';
  return sg + nf.format(Math.round(a));
}
const full = v => v === null || v === undefined ? UNK : nf2.format(v) + ' ISK';
const pct = (v, d = 1) => v === null || v === undefined ? UNK : (v < 0 ? '−' : '') + Math.abs(v).toFixed(d).replace('.', ',') + ' %';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ini = n => n.replace(/[^A-Za-z ]/g, ' ').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();

function clock(min) { const d = Math.floor(min / 1440), h = Math.floor(min % 1440 / 60), m = Math.round(min % 60); return `${['lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.', 'dim.'][d]} ${String(2 + d).padStart(2, '0')}/11 ${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`; }
function dur(min) { min = Math.max(0, Math.round(min)); const h = Math.floor(min / 60), m = min % 60; return h ? `${h} h ${String(m).padStart(2, '0')}` : `${m} min`; }

/* ---------- Finances ---------- */
function waterfall(f) {
  const steps = [['Revenu', f.revenue], ['Taxes', -f.taxes], ['Matériaux', -f.mat], ['Invention', -f.inv], ['Jobs', -(f.jobs ?? 0)]];
  const W = 1100, H = 260, pad = 20, top = 24, bottom = 34;
  let acc = 0; const levels = [0];
  steps.forEach(s => { acc += s[1]; levels.push(acc); });
  const max = Math.max(...levels), min = Math.min(0, ...levels);
  const y = v => top + (H - top - bottom) * (max - v) / (max - min);
  const gap = (W - pad * 2) / (steps.length + 1), bw = gap * .56;
  const label = (x, v, yy) => `<text class="v" x="${x}" y="${yy}" text-anchor="middle">${v}</text>`;
  let svg = `<line x1="${pad}" x2="${W - pad}" y1="${y(0)}" y2="${y(0)}" stroke="rgba(166,181,194,.55)"/>`;
  acc = 0;
  steps.forEach((s, i) => {
    const from = acc, to = acc + s[1];
    const yA = y(Math.max(from, to)), yB = y(Math.min(from, to));
    const xi = pad + i * gap + (gap - bw) / 2;
    svg += `<rect x="${xi}" y="${yA}" width="${bw}" height="${Math.max(1, yB - yA)}" fill="${i === 0 ? '#2fd0f0' : '#ff7d73'}" opacity="${i === 0 ? .85 : .72}"/>`;
    svg += label(xi + bw / 2, (i ? '−' : '') + isk(Math.abs(s[1])).replace(/<[^>]+>/g, ''), yA - 6);
    svg += `<text x="${xi + bw / 2}" y="${H - 8}" text-anchor="middle">${s[0].toUpperCase()}</text>`;
    svg += `<line x1="${xi + bw}" x2="${xi + gap}" y1="${y(to)}" y2="${y(to)}" stroke="rgba(166,181,194,.4)" stroke-dasharray="3 3"/>`;
    acc = to;
  });
  const xp = pad + steps.length * gap + (gap - bw) / 2;
  const yT = y(Math.max(acc, 0)), yBt = y(Math.min(acc, 0));
  svg += `<rect x="${xp}" y="${yT}" width="${bw}" height="${Math.max(1, yBt - yT)}" fill="${acc >= 0 ? '#46c35a' : '#ff7d73'}"/>`;
  svg += label(xp + bw / 2, isk(acc).replace(/<[^>]+>/g, ''), acc >= 0 ? yT - 6 : yBt + 16);
  svg += `<text x="${xp + bw / 2}" y="${H - 8}" text-anchor="middle" style="fill:#fff">${f.unsold ? 'PROFIT PROVISOIRE' : 'PROFIT'}</text>`;
  return `<svg class="wf" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cascade du revenu au profit">${svg}</svg>`;
}

function applyHash() {
  const p = new URLSearchParams(location.hash.replace(/^#/, ''));
  const keep = S ? { notesOpen: S.notesOpen, frontOpen: S.frontOpen } : {};
  S = Object.assign(baseState(), keep);
  tickStart = Date.now();
  S.long = p.get('long') === '1';
  S.annot = p.get('annot') !== '0';
  if (p.get('notes') === '1') S.notesOpen = true;
  if (p.get('front') === '1') S.frontOpen = true;
  applyNames(S.long);
  const n = parseInt(p.get('p') || '0', 10);
  if (n) applyStep(Math.min(LAST_STEP, Math.max(1, n)));
  if (p.get('t')) { S.t = Math.min(7, Math.max(0, parseInt(p.get('t'), 10))); applyMoment(); }
  if (p.get('v')) { S.view = p.get('v'); if (!n) S.step = 0; }
  if (p.get('tab')) { S.tab = p.get('tab'); S.view = 'projet'; }
  if (p.get('s')) S.state = p.get('s');
  if (p.get('size')) S.size = p.get('size');
  if (p.get('modal')) S.modal = p.get('modal') === 'none' ? null : p.get('modal');
  render();
  window.scrollTo(0, 0);
}
function go(h) { if (location.hash === '#' + h) applyHash(); else location.hash = h; }
function setParam(k, v) { const p = new URLSearchParams(location.hash.replace(/^#/, '')); if (v === null) p.delete(k); else p.set(k, v); go(p.toString()); }
document.addEventListener('click', e => {
  const h = e.target.closest('[data-hash]');
  if (h) { go(h.dataset.hash); return; }
  const a = e.target.closest('[data-act]');
  if (!a || a.disabled || ['moment', 'state', 'sim-price', 'use-stock', 'keep'].includes(a.dataset.act)) return;
  const arg = a.dataset.arg;
  switch (a.dataset.act) {
    case 'start': go('p=1'); break;
    case 'next': go('p=' + Math.min(LAST_STEP, (S.step || 0) + 1)); break;
    case 'prev': go('p=' + Math.max(1, S.step - 1)); break;
    case 'long': setParam('long', S.long ? null : '1'); break;
    case 'annot': setParam('annot', S.annot ? '0' : null); break;
    case 'notes': S.notesOpen = !S.notesOpen; render(); break;
    case 'front': S.frontOpen = !S.frontOpen; render(); break;
    case 'tab': S.view = 'projet'; S.tab = arg; S.focus = null; render(); break;
    case 'select': S.selected = arg; render(); break;
    case 'modal': S.modal = arg; render(); break;
    case 'close': S.modal = 'close'; render(); break;
    case 'close-modal': S.modal = null; render(); break;
    case 'moved': S.moved = true; render(); toast('Déplacement noté · revérifié à la prochaine sync des assets'); break;
    case 'copy-mb': S.copied = true; render(); toast('Liste multibuy copiée'); break;
    case 'copy-recap': S.recapCopied = true; render(); toast('Récapitulatif copié'); break;
    case 'link-s2': S.links.S2 = true; render(); toast('Contrat rattaché comme vente · sans taxe'); break;
    case 'go-mat': S.view = 'projet'; S.tab = 'materiaux'; render(); break;
    case 'go-plan': S.view = 'projet'; S.tab = 'planning'; render(); break;
    case 'go-fin': S.view = 'projet'; S.tab = 'finances'; render(); break;
    case 'sim-ch': S.simChannel = arg; render(); break;
    case 'chain': S.chain = arg; render(); break;
    case 'to-tree': S.chain = 'tree'; render(); break;
    case 'tree-toggle': S.treeClosed[arg] = !S.treeClosed[arg]; render(); break;
    case 'tree-all': S.treeClosed = arg === 'close' ? { hh2: false, mat: true, hh1: true, inv: true } : {}; render(); break;
    case 'keep': S.keepSolo = arg === '1'; render(); break;
  }
});
document.addEventListener('change', e => {
  const a = e.target.closest('[data-act]');
  if (!a) return;
  if (a.dataset.act === 'moment') setParam('t', a.value);
  if (a.dataset.act === 'state') setParam('s', a.value === 'normal' ? null : a.value);
  if (a.dataset.act === 'use-stock') { S.useStock = a.checked; render(); }
  if (a.dataset.act === 'keep') { S.keepSolo = a.dataset.arg === '1'; render(); }
});
document.addEventListener('input', e => {
  if (e.target.dataset.act === 'sim-price') { S.simPrice = parseInt(e.target.value, 10); const y = window.scrollY; render(); window.scrollTo(0, y); document.querySelector('[data-act=sim-price]').focus(); }
});
document.addEventListener('keydown', e => {
  if (e.target.closest('input, select, textarea')) return;
  if (e.key === 'ArrowRight' && S.step < LAST_STEP) go('p=' + ((S.step || 0) + 1));
  if (e.key === 'ArrowLeft' && S.step > 1) go('p=' + (S.step - 1));
  if (e.key === 'Escape' && S.modal) { S.modal = null; render(); }
});
window.addEventListener('hashchange', applyHash);
applyHash();
</script>
