<!--
  Maquette V2 · minage groupé (issues #259 à #274, spec docs/specs/267-site-depletion-estimate.md).
  Un écran par moment de jeu : Planifier / Opération (poste de pilotage qui change de mode) / Historique,
  plus Taxe lunaire et Valeur des minerais. Données et noms 100 % fictifs.

  Composants réels reproduits en CSS pur (classes Tailwind relevées dans frontend/src/) :
  - frontend/src/style.css : tokens @theme (eve-*, profit/loss/warning, chart-1..10, font-mono Share Tech Mono),
    utilitaire eve-card. Le shell porte `font-sans` (police système) : Rajdhani n'y est pas appliquée, seule la mono
    l'est (embarquée ici en base64, aucune ressource distante).
  - frontend/src/layouts/MainLayout.vue : sidebar w-64 bg-slate-900 border-cyan-500/20, logo dégradé, items de nav
    (actif : from-cyan-500/20 to-blue-500/10 + point pulsé), groupe dépliable, carte personnage, header sticky
    (titre text-2xl, pastille ESI emerald, badges alliance amber et corporation cyan), contenu p-8 max-w-7xl.
  - frontend/src/constants/sidebarNavigation.ts : ordre des entrées (Tableau de bord, Revenus, Production ▸, Marche, Inventaire).
  - frontend/src/views/Ledger.vue : onglets border-b-2 border-cyan-500 text-cyan-400, sélecteur bg-slate-900 p-1 / bg-cyan-600.
  - frontend/src/components/ledger/MiningTab.vue, MiningStatsCards.vue, MiningEntriesTable.vue : cartes bg-slate-900
    rounded-xl border-slate-800, libellés text-xs uppercase tracking-wider, en-têtes de tableau, bouton amber « Rafraîchir ».
  - frontend/src/views/GroupIndustry/GroupIndustryDetail.vue : en-tête de projet bg-slate-900/80 p-5, badges de statut
    (statusConfig), boutons bg-slate-700 / bg-cyan-600, compteurs d'onglets.
  - frontend/src/components/group-industry/ProjectKpiCards.vue, DistributionTable.vue, ShareLinkCard.vue, NewProjectModal.vue.
  - frontend/src/components/common/BaseModal.vue (overlay bg-slate-950/80, rounded-2xl), ToastContainer.vue, UnknownValue.vue.
  Routage par hash : #p=1..11 (parcours), #v=plan|operation|history|tax|ore|compact, #m=planned|running|closing|shares|settled,
  #s=normal|denied|missing_price|ledger_wait|reconnect, #modal=create|created|join|end, #phase=waiting|reading|done, #tax=miner.
-->

:root {
  --s950:#020617; --s900:#0f172a; --s800:#1e293b; --s700:#334155; --s600:#475569; --s500:#64748b; --s400:#94a3b8; --s300:#cbd5e1; --s200:#e2e8f0; --s100:#f1f5f9;
  --c400:#22d3ee; --c500:#06b6d4; --c600:#0891b2; --e400:#34d399; --e500:#10b981; --e600:#059669;
  --a300:#fcd34d; --a400:#fbbf24; --a500:#f59e0b; --a600:#d97706; --r400:#f87171; --r500:#ef4444; --v400:#a78bfa; --v500:#8b5cf6; --sky400:#38bdf8;
  --warning:#f59e0b; --chart-grid:#334155; --chart-text:#e2e8f0;
  --mono:'Share Tech Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--s950); color: var(--s100); font-family: ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji"; font-size: 14px; line-height: 1.43; }
button { font: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; }
input, select { font: inherit; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.bg-grid { position: fixed; inset: 0; pointer-events: none; background-image: linear-gradient(rgba(6,182,212,.03) 1px, transparent 1px), linear-gradient(90deg, rgba(6,182,212,.03) 1px, transparent 1px); background-size: 50px 50px; }
.bg-glow { position: fixed; top: -50%; left: -50%; width: 100%; height: 100%; pointer-events: none; background: radial-gradient(closest-side, rgba(22,78,99,.2), transparent); }

/* Barre de maquette */
.mockbar { position: relative; z-index: 60; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px 14px; background: repeating-linear-gradient(135deg, #160f24 0 10px, #120c1e 10px 20px); border-bottom: 2px dashed rgba(167,139,250,.55); font-size: 12px; color: #c4b5fd; }
.mockbar .lbl { font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: 11px; color: var(--v400); }
.mockbar .grp { display: flex; align-items: center; gap: 4px; padding-left: 10px; border-left: 1px dashed rgba(167,139,250,.35); }
.mockbar button, .mockbar select { background: rgba(167,139,250,.08); color: #ddd6fe; border: 1px dashed rgba(167,139,250,.45); border-radius: 6px; padding: 3px 8px; font-size: 12px; }
.mockbar button.on { background: rgba(167,139,250,.28); border-style: solid; color: #fff; }
.mockbar .step { font-family: var(--mono); color: #fff; min-width: 210px; }

/* Shell (MainLayout.vue) */
.app { position: relative; display: flex; min-height: calc(100vh - 44px); }
aside.side { width: 256px; flex-shrink: 0; background: var(--s900); border-right: 1px solid rgba(6,182,212,.2); display: flex; flex-direction: column; position: sticky; top: 0; height: calc(100vh - var(--mbh, 0px)); }
.logo { padding: 24px; border-bottom: 1px solid rgba(6,182,212,.2); display: flex; align-items: center; gap: 12px; }
.logo .ic { width: 40px; height: 40px; border-radius: 8px; background: linear-gradient(to bottom right, #06b6d4, #2563eb); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 15px -3px rgba(6,182,212,.3); }
.logo h1 { margin: 0; font-size: 18px; line-height: 28px; font-weight: 700; letter-spacing: -.025em; background: linear-gradient(to right, #22d3ee, #60a5fa); -webkit-background-clip: text; background-clip: text; color: transparent; }
.logo p { margin: 0; font-size: 12px; color: var(--s500); letter-spacing: .1em; text-transform: uppercase; }
nav.menu { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
.ni { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 8px; border: 1px solid transparent; color: var(--s400); background: none; text-align: left; font-weight: 500; font-size: 14px; }
.ni:hover { background: rgba(30,41,59,.5); color: var(--s200); border-color: rgba(6,182,212,.3); }
.ni svg { width: 20px; height: 20px; flex-shrink: 0; }
.ni.on { background: linear-gradient(to right, rgba(6,182,212,.2), rgba(59,130,246,.1)); color: var(--c400); border-color: rgba(6,182,212,.3); box-shadow: 0 10px 15px -3px rgba(6,182,212,.1); }
.ni .dot { margin-left: auto; width: 6px; height: 6px; border-radius: 50%; background: var(--c400); }
.ni .chev { margin-left: auto; width: 16px; height: 16px; }
.sub { padding-left: 16px; display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
.sub .ni { padding: 10px 16px; font-size: 14px; }
.sub .ni svg { width: 16px; height: 16px; }
.charcard { margin: 16px; margin-top: 0; padding-top: 16px; border-top: 1px solid rgba(6,182,212,.2); }
.charcard .in { background: var(--s900); border: 1px solid var(--s800); border-radius: 12px; padding: 16px; display: flex; align-items: center; gap: 12px; }
.avatar { width: 48px; height: 48px; border-radius: 8px; box-shadow: 0 0 0 2px rgba(6,182,212,.5); background: linear-gradient(135deg, #334155, #1e293b); display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--s300); }
main.content { flex: 1; min-width: 0; }
header.top { position: sticky; top: 0; z-index: 10; background: var(--s900); border-bottom: 1px solid rgba(6,182,212,.1); padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
header.top h2 { margin: 0; font-size: 24px; line-height: 32px; font-weight: 700; color: var(--s100); }
header.top p { margin: 4px 0 0; font-size: 14px; color: var(--s500); }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 8px; border: 1px solid; font-size: 12px; }
.pill.esi { background: rgba(16,185,129,.1); border-color: rgba(16,185,129,.3); color: var(--e400); }

/* ---------- Estimation (spec #267, R1-R12) ---------- */
function scanList(n) {
  const out = [];
  for (let i = 0; i < n; i++) {
    if (i < SCAN_SERIES.length) { out.push(SCAN_SERIES[i]); continue; }
    const prev = out[i - 1];
    const q = {};
    Object.keys(prev.q).forEach(id => {
      const next = prev.q[id] - (GENERATED_DROP[id] || 0);
      if (next > 0) q[id] = next;
    });
    out.push({ t: prev.t + SCAN_INTERVAL_MIN, q });
  }
  return out;
}

function estimateType(id, scans) {
  const present = scans.map((s, i) => ({ i, t: s.t, q: s.q[id] })).filter(p => p.q !== undefined);
  const res = { id, present, last: null, recent: null, trend: null, recentEta: null, trendEta: null, reason: null, devU: null, devPct: null, irregular: false, depleted: null };
  if (present.length === 0) return null;
  const lastP = present[present.length - 1];
  if (lastP.i < scans.length - 1) {
    res.depleted = { from: lastP.t, to: scans[lastP.i + 1].t };
    res.last = 0;
    return res;
  }
  res.last = lastP.q;
  if (present.length < 2) { res.reason = 'single_scan'; return res; }
  const a = present[present.length - 2], b = lastP;
  res.recent = (a.q - b.q) / (b.t - a.t);
  res.recentEta = res.recent > 0 ? b.t + b.q / res.recent : null;
  const n = present.length;
  const tb = present.reduce((s, p) => s + p.t, 0) / n;
  const qb = present.reduce((s, p) => s + p.q, 0) / n;
  const sxx = present.reduce((s, p) => s + (p.t - tb) ** 2, 0);
  const sxy = present.reduce((s, p) => s + (p.t - tb) * (p.q - qb), 0);
  const slope = sxy / sxx;
  res.trend = -slope;
  res.tb = tb; res.qb = qb; res.slope = slope;
  res.trendEta = res.trend > 0 ? tb + qb / res.trend : null;
  if (n >= 3) {
    res.devU = Math.max(...present.map(p => Math.abs(p.q - (qb + slope * (p.t - tb)))));
    res.devPct = res.devU / present[0].q * 100;
    res.irregular = res.devPct > IRREGULAR_THRESHOLD_PCT;
  }
  if (res.recentEta === null && res.trendEta === null) res.reason = 'not_depleting';
  return res;
}

function priceOf(id) {
  if (S.state === 'missing_price' && id === 'monazite') return null;
  return ORE[id].price;
}

function sumKnown(items) {
  const missing = items.filter(x => x.value === null).map(x => x.label);
  if (missing.length) return { value: null, missing: [...new Set(missing)] };
  return { value: items.reduce((s, x) => s + x.value, 0), missing: [] };
}

function estimateSite(scans) {
  const types = SITE_TYPES.map(id => estimateType(id, scans)).filter(Boolean);
  const mined = types.filter(t => !t.depleted && t.reason !== 'not_depleting' && t.reason !== 'single_scan');
  const latest = key => {
    const known = mined.map(t => t[key]).filter(v => v !== null);
    return known.length ? Math.max(...known) : null;
  };
  const siteRecent = latest('recentEta');
  const siteTrend = latest('trendEta');
  const driverTrend = mined.find(t => t.trendEta === siteTrend) || null;
  const valued = types.filter(t => !t.depleted && priceOf(t.id) !== null);
  const best = valued.length ? valued.reduce((m, t) => (priceOf(t.id) / ORE[t.id].vol > priceOf(m.id) / ORE[m.id].vol ? t : m)) : null;
  const remaining = sumKnown(types.filter(t => t.last > 0).map(t => ({ label: ORE[t.id].name, value: priceOf(t.id) === null ? null : t.last * priceOf(t.id) })));
  const extracted = sumKnown(types.map(t => ({ t, ex: t.present[0].q - t.last })).filter(x => x.ex > 0)
    .map(x => ({ label: ORE[x.t.id].name, value: priceOf(x.t.id) === null ? null : x.ex * priceOf(x.t.id) })));
  const remainingUnits = types.reduce((s, t) => s + t.last, 0);
  return { types, mined, siteRecent, siteTrend, driverTrend, best, remaining, extracted, remainingUnits, scans };
}

/* ---------- Répartition (#264, #265, #266) ---------- */
function includedPeople() {
  return PEOPLE.filter(p => (!p.joinsInFlow || S.deltaJoined) && (!p.late || S.foxtrot === 'accepted'));
}
function charUnknownReason(cid) {
  if (S.state === 'reconnect' && cid === 'echo2') return 'Mineur Echo II : instantané de début non lu (token invalide)';
  return null;
}
function charValue(cid) {
  if (charUnknownReason(cid)) return { value: null, missing: [charUnknownReason(cid)] };
  return sumKnown(Object.entries(CHARS[cid].q).filter(([, q]) => q > 0).map(([id, q]) => ({ label: ORE[id].name + ' compressé (sans prix)', value: priceOf(id) === null ? null : q * priceOf(id) })));
}
function computeShares() {
  const b = OP.boosterPct / 100, c = OP.corpPct / 100;
  const people = includedPeople().map(p => {
    const cv = p.chars.map(cid => ({ cid, ...charValue(cid) }));
    const v = sumKnown(cv.map(x => ({ label: '', value: x.value })));
    const missing = [...new Set(cv.flatMap(x => x.missing))];
    const units = p.chars.reduce((s, cid) => s + Object.values(CHARS[cid].q).reduce((a, q) => a + q, 0), 0);
    return { ...p, cv, value: v.value, missing, units, part: v.value === null ? null : v.value * (1 - b - c) };
  });
  const G = sumKnown(people.map(p => ({ label: '', value: p.value })));
  const missing = [...new Set(people.flatMap(p => p.missing))];
  people.forEach(p => { p.pct = (G.value === null || p.value === null) ? null : p.value / G.value * 100; });
  const booster = G.value === null ? null : G.value * b;
  const corp = G.value === null ? null : G.value * c;
  const toShare = G.value === null ? null : G.value * (1 - b - c);
  const boosterId = OP.booster;
  const payments = [];
  people.forEach(p => {
    const holder = p.fleet ? OP.fleetTo : p.id;
    if (holder !== p.id) payments.push({ key: holder + '>' + p.id, from: holder, to: p.id, amount: p.part, why: `détient le minerai de ${p.name} (fleet storage) : lui doit sa part` });
    if (holder !== boosterId && p.id !== boosterId && (p.value === null || p.value > 0)) payments.push({ key: holder + '>' + boosterId + ':' + p.id, from: holder, to: boosterId, amount: p.value === null ? null : p.value * b, why: `sa part du booster (${OP.boosterPct} % de sa valeur)` });
  });
  return { people, G: G.value, missing, booster, corp, toShare, payments };
}

function fmtIsk(v) {

function hm(min, withDay) {
  if (min === null || min === undefined) return null;
  const totalSec = Math.round(min * 60);
  let h = 20 + Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  let pre = '';
  if (h >= 24) { h -= 24; pre = 'ven. '; }
  return pre + String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + (withDay === 'sec' ? ':' + String(totalSec % 60).padStart(2, '0') : '');
}

}
function clockTxt(sec) {
  sec = Math.max(0, Math.round(sec));

function chartSvg(est, w, h) {
  const scans = est.scans;
  const m = { l: 48, r: 14, t: 22, b: 28 };
  const iw = w - m.l - m.r, ih = h - m.t - m.b;
  const etas = est.mined.flatMap(t => [t.trendEta, t.recentEta]).filter(v => v !== null);
  const tMaxRaw = Math.max(S.now, ...etas, scans[scans.length - 1].t + 10);
  const tMax = Math.min(Math.ceil((tMaxRaw + 4) / 15) * 15, 300);
  const qMaxRaw = Math.max(...scans.flatMap(s => Object.values(s.q)));
  const qStep = 20000;
  const qMax = Math.ceil(qMaxRaw * 1.08 / qStep) * qStep;
  const X = t => m.l + (t / tMax) * iw, Y = q => m.t + ih - (q / qMax) * ih;
  const xStep = tMax <= 120 ? 15 : tMax <= 240 ? 30 : 60;
  let g = '';
  for (let q = 0; q <= qMax; q += qStep) g += `<line x1="${m.l}" x2="${w - m.r}" y1="${Y(q)}" y2="${Y(q)}" stroke="#334155" stroke-width="1" ${q ? 'stroke-dasharray="2 4"' : ''}/><text x="${m.l - 8}" y="${Y(q) + 4}" text-anchor="end" font-size="11" fill="#94a3b8" font-family="Share Tech Mono, monospace">${q ? q / 1000 + 'k' : '0'}</text>`;
  for (let t = 0; t <= tMax; t += xStep) g += `<text x="${X(t)}" y="${h - 8}" text-anchor="middle" font-size="11" fill="#94a3b8" font-family="Share Tech Mono, monospace">${hm(t)}</text><line x1="${X(t)}" x2="${X(t)}" y1="${m.t + ih}" y2="${m.t + ih + 4}" stroke="#475569"/>`;
  const clip = (t0, q0, slope) => { const tz = t0 - q0 / slope; const tEnd = Math.min(tz, tMax); return [tEnd, q0 + slope * (tEnd - t0)]; };
  let lines = '';
  est.types.forEach(t => {
    const col = ORE[t.id].color;
    const pts = t.present;
    if (t.trend !== null && t.trend > 0) {
      const t0 = pts[0].t, q0 = t.qb + t.slope * (t0 - t.tb);
      const [te, qe] = clip(t0, q0, t.slope);
      lines += `<line x1="${X(t0)}" y1="${Y(q0)}" x2="${X(te)}" y2="${Y(qe)}" stroke="${col}" stroke-width="2" opacity=".85"/>`;
    }
    if (t.recent !== null && t.recent > 0) {
      const a = pts[pts.length - 1];
      const [te, qe] = clip(a.t, a.q, -t.recent);
      lines += `<line x1="${X(a.t)}" y1="${Y(a.q)}" x2="${X(te)}" y2="${Y(qe)}" stroke="${col}" stroke-width="1.6" stroke-dasharray="5 4"/>`;
    }
    if (t.depleted) lines += `<circle cx="${X(t.depleted.to)}" cy="${Y(0)}" r="4" fill="none" stroke="${col}" stroke-width="1.5"/>`;
    pts.forEach(p => { lines += `<circle cx="${X(p.t)}" cy="${Y(p.q)}" r="3.5" fill="${t.reason === 'not_depleting' ? '#64748b' : col}" stroke="#0f172a" stroke-width="1"/>`; });
  });
  const nowX = X(Math.min(S.now, tMax));
  let marks = `<line x1="${nowX}" x2="${nowX}" y1="${m.t}" y2="${m.t + ih}" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3" opacity=".6"/><text x="${nowX - 4}" y="${m.t - 8}" text-anchor="end" font-size="11" fill="#cbd5e1">maintenant</text>`;
  if (est.siteTrend !== null && est.siteTrend <= tMax) {
    const ex = X(est.siteTrend);
    const close = Math.abs(ex - nowX) < 90;
    marks += `<line x1="${ex}" x2="${ex}" y1="${m.t}" y2="${m.t + ih}" stroke="#22d3ee" stroke-width="1" stroke-dasharray="1 3"/><text x="${ex + 4}" y="${close ? m.t + 12 : m.t - 8}" font-size="11" fill="#22d3ee" font-family="Share Tech Mono, monospace">ETA ${hm(est.siteTrend)}</text>`;
  }
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block">${g}${lines}${marks}</svg>`;
}

function lastScanInfo(est) {
  const scans = est.scans;
  const last = scans[scans.length - 1];
  const ago = Math.max(0, Math.round(S.now - last.t));
  return { n: scans.length, at: hm(last.t), ago, types: Object.keys(last.q).length };
}

function valueBlock(v, label, cause) {
  return v.value === null ? `<span class="unk">inconnue</span><div class="hint">sans prix : ${v.missing.join(', ')}</div>` : fmtIsk(v.value);
}

function renderRunning() {
  const est = estimateSite(scanList(S.scansN));
  const li = lastScanInfo(est);
  const drv = est.driverTrend;

  const bestType = best ? est.types.find(t => t.id === best.id) : null;
  const notMined = est.types.filter(t => t.reason === 'not_depleting');
  const depleted = est.types.filter(t => t.depleted);
  const etaSec = est.siteTrend === null ? null : est.siteTrend * 60;
  const hero = `<div class="card p6 span2" style="border-color:rgba(6,182,212,.25)">
      <div class="row sb start">
        <div><div class="lab">ETA du site · tendance</div>
          <div class="row" style="align-items:flex-end;gap:20px;margin-top:10px">

            <div style="padding-bottom:6px"><div class="lab dim">reste</div><div class="count" data-countdown="${etaSec ?? ''}">–</div></div>
            <div style="padding-bottom:6px"><div class="lab dim">récent (2 derniers scans)</div><div class="count" style="color:var(--s300)">${etaOr(est.siteRecent)}</div></div>
          </div>
          <p class="muted" style="margin:12px 0 0">${drv ? `Dernier minerai à tomber : <b class="c-s200">${ORE[drv.id].name}</b>` : ''}${bestType && bestType.trendEta !== null ? ` · le plus rentable, <b style="color:${ORE[best.id].color}">${ORE[best.id].name}</b>, vide vers <span class="mono c-s200">${hm(bestType.trendEta)}</span>` : ''}</p>
          ${irregular.length ? `<p style="margin:6px 0 0" class="c-amber">Débit irrégulier sur ${irregular.map(t => ORE[t.id].name).join(', ')} (écart > ${IRREGULAR_THRESHOLD_PCT} %) : l’ETA récente est plus fiable que la tendance.</p>` : ''}
        </div>
        <div style="text-align:right"><div class="lab dim">dernier scan</div><div class="count">#${li.n} · ${li.at}</div><div class="hint">il y a ${li.ago} min · ${li.types} types</div></div>
      </div>
      <div class="paste" style="margin-top:18px"><div class="row" style="gap:10px"><span class="kbd">Ctrl+V</span><span class="c-s300">n’importe où sur cette page ajoute un scan du Mining Survey Chipset</span><span class="hint">· même position, même portée · un scan toutes les 5-10 min</span></div><button class="btn pri sm" data-act="paste">${svg(ICON.clip)}Simuler un collage</button></div>
      <p class="hint2" style="margin:8px 0 0">Le texte collé n’est jamais enregistré : seul le scan qui en découle l’est.</p>
    </div>`;
  const side = `<div class="col">
      <div class="card"><span class="lab">Valeur extraite (indicative)</span><div class="kpi c-amber mono">${valueBlock(est.extracted)}</div><div class="hint">d’après les scans · ${OP.basis}. Les parts viennent du ledger de fin.</div></div>
      <div class="card"><span class="lab">Valeur restante du site</span><div class="kpi c-white mono">${valueBlock(est.remaining)}</div><div class="hint">${fmtN(est.remainingUnits)} u · ${fmtN(est.remainingUnits * 10)} m³ au dernier scan</div></div>
      <div class="card" style="padding:12px 16px"><span class="lab dim">Ledger ESI (indicatif)</span><div class="hint" style="margin-top:4px">dernière lecture 20:10 · cache 10 min, agrégé par jour</div></div>
    </div>`;
  const legend = est.types.map(t => `<span class="row" style="gap:6px"><span class="dotc" style="background:${t.reason === 'not_depleting' ? '#64748b' : ORE[t.id].color}"></span><span class="c-s300">${ORE[t.id].name}</span>${t.reason === 'not_depleting' ? '<span class="hint">non miné</span>' : t.depleted ? '<span class="hint">épuisé</span>' : ''}</span>`).join('');
  const chart = `<div class="card p5 span2"><div class="row sb"><h3 class="t">Restant par type</h3><div class="row hint" style="gap:14px">${legend}</div></div>
      <div style="margin-top:8px">${chartSvg(est, 740, 280)}</div>
      <p class="hint" style="margin:6px 0 0">Points : scans. Trait plein : tendance (moindres carrés) prolongée jusqu’à 0. Pointillés : débit récent depuis le dernier scan.</p></div>`;
  const people = `<div class="card p5"><div class="row sb"><h3 class="t">Participants</h3><span class="hint">${includedPeople().length} · ${includedPeople().reduce((s, p) => s + p.chars.length, 0)} persos</span></div>${participantRows('running')}</div>`;
  const rowsT = est.types.map(t => {
    const o = ORE[t.id];
    const price = priceOf(t.id);
    const val = t.last === 0 ? '0' : price === null ? '<span class="unk">inconnue</span>' : fmtIsk(t.last * price);
    if (t.depleted) return `<tr><td><span class="row" style="gap:8px"><span class="dotc" style="background:${o.color}"></span>${o.name} <span class="hint">${o.cat}</span></span></td><td class="r">0</td><td class="r" colspan="4" style="text-align:left;font-family:inherit"><span class="badge sm b-slate">Épuisé</span> <span class="hint">entre ${hm(t.depleted.from)} et ${hm(t.depleted.to)}</span></td><td class="r">–</td><td class="r">0</td></tr>`;
    const nm = t.reason === 'not_depleting';
    const reasonR = t.recentEta === null ? (t.reason === 'single_scan' ? 'un seul scan' : 'non miné') : null;
    const reasonT = t.trendEta === null ? (t.reason === 'single_scan' ? 'un seul scan' : 'non miné') : null;
    const dev = t.devPct === null ? '<span class="hint">–</span>' : `${t.devPct.toFixed(1).replace('.', ',')} %${t.irregular ? ' <span class="badge sm b-amber">irrégulier</span>' : ''}`;
    return `<tr${nm ? ' style="opacity:.7"' : ''}><td><span class="row" style="gap:8px"><span class="dotc" style="background:${nm ? '#64748b' : o.color}"></span>${o.name} <span class="hint">${o.cat}</span>${nm ? '<span class="badge sm b-slate">non miné</span>' : ''}</span></td>
      <td class="r">${fmtN(t.last)} u<div class="hint">${fmtN(t.last * o.vol)} m³</div></td>
      <td class="r">${t.recent === null ? '–' : fmtN(Math.max(t.recent, 0))}</td><td class="r">${etaOr(t.recentEta, reasonR)}</td>
      <td class="r">${t.trend === null ? '–' : fmtN(Math.max(t.trend, 0))}</td><td class="r">${etaOr(t.trendEta, reasonT)}</td>
      <td class="r">${dev}</td><td class="r">${val}</td></tr>`;
  }).join('');
  const table = `<div class="card flush"><div class="card-h"><h3>Par type de minerai</h3><span class="hint">${est.scans.length} scans · débits en u/min · ETA en EVE time${notMined.length ? ` · non minés, ignorés pour l’ETA du site : ${notMined.map(t => ORE[t.id].name).join(', ')}` : ''}${depleted.length ? ` · épuisés : ${depleted.map(t => ORE[t.id].name).join(', ')}` : ''}</span></div>
    <table class="t"><thead><tr><th>Type</th><th class="r">Restant</th><th class="r">Débit récent</th><th class="r">ETA récente</th><th class="r">Débit tendance</th><th class="r">ETA tendance</th><th class="r">Écart max</th><th class="r">Valeur restante</th></tr></thead><tbody>${rowsT}</tbody></table>
    ${S.state === 'missing_price' ? `<div style="padding:12px 24px;border-top:1px solid var(--s800)" class="hint"><span class="unk">Sans prix Jita</span> : Monazite compressé. Sa valeur restante et la valeur du site sont inconnues ; l’ETA, elle, ne dépend pas du prix.</div>` : ''}</div>`;
  return `<div class="g3 start">${hero}${side}${chart}${people}</div>${table}
    <div class="annot"><b>Maquette ·</b> format du collage à fixer avec un exemple réel du Mining Survey Chipset (#267) : colonnes, unités, séparateurs, langue du client. Ici, coller n’importe quel texte ajoute un scan fictif.</div>`;
}

function snapshotRows() {
  const order = includedPeople().flatMap(p => p.chars.map(c => ({ c, p })));
  return order.map(({ c, p }, i) => {
    const unknown = charUnknownReason(c);
    let st;
    if (S.closePhase === 'waiting') st = '<span class="hint">en file</span>';
    else if (i < S.readCount) st = unknown ? '<span class="badge sm b-amber">✗ token invalide · quantité inconnue</span> <button class="btn sec xs">Relancer</button>' : `<span class="badge sm b-em">✓ lu 21:46:${String(2 + i).padStart(2, '0')}</span>`;
    else if (i === S.readCount) st = '<span class="badge sm b-cyan">⟳ lecture</span>';
    else st = '<span class="hint">en file</span>';
    const qty = (S.closePhase !== 'waiting' && i < S.readCount) ? (unknown ? '<span class="unk">inconnue</span>' : fmtN(Object.values(CHARS[c].q).reduce((a, b) => a + b, 0)) + ' u') : '<span class="hint">–</span>';
    return `<tr><td class="c-s200">${CHARS[c].name}</td><td>${p.name}</td><td>${CHARS[c].ship}</td><td>${st}</td><td class="r">${qty}</td></tr>`;
  }).join('');
}

function canSettle() {
  const sh = computeShares();
  return sh.G !== null && sh.payments.every(p => S.paid[p.key]);
}

  const rows = sh.people.map(p => {

    return main + subs;

  const sumParts = sh.people.reduce((s, p) => s + (p.part ?? NaN), 0);
  const check = sh.G === null ? '<span class="unk">contrôle impossible : somme inconnue</span>' : `Σ parts ${fmtIsk(sumParts)} + booster ${fmtIsk(sh.booster)} + corpo ${fmtIsk(sh.corp)} = ${fmtIsk(sumParts + sh.booster + sh.corp)} = G ✓`;
  const table = `<div class="card flush"><div class="card-h"><h3>Répartition au prorata de la valeur</h3><span class="hint">${OP.basis} · prix figés à 21:46 : Monazite ${priceOf('monazite') === null ? '<span class="unk">inconnu</span>' : fmtN(ORE.monazite.price)}, Cinnabar ${fmtN(ORE.cinnabar.price)}, Sylvite ${fmtN(ORE.sylvite.price)} ISK/u</span></div>
    <table class="t"><thead><tr><th>Participant</th><th class="r">Quantité (u)</th><th class="r">Valeur minée</th><th class="r">% de G</th><th class="r">Part</th><th>Minerai détenu par</th></tr></thead><tbody>${rows}
    <tr class="tot"><td>Total</td><td class="r">${fmtN(sh.people.reduce((s, p) => s + p.units, 0))}</td><td class="r">${fmtIsk(sh.G)}</td><td class="r">${sh.G === null ? '<span class="unk">inconnu</span>' : '100 %'}</td><td class="r">${fmtIsk(sh.G === null ? null : sumParts)}</td><td class="hint" style="font-weight:400">+ booster ${fmtIsk(sh.booster)}</td></tr></tbody></table>
    <div style="padding:10px 24px;border-top:1px solid var(--s800)" class="hint mono">part = G × (1 − ${OP.boosterPct} % − ${OP.corpPct} %) × valeur / G · ${check}</div></div>`;
  const pays = sh.payments.map(p => `<label class="row" style="gap:12px;padding:10px 0;border-top:1px solid var(--s800);cursor:${settled ? 'default' : 'pointer'}">

      <span style="flex:1"><span class="c-s200">${personName(p.from)}</span> <span class="hint">doit</span> <b class="mono c-white">${fmtIsk(p.amount)}</b> <span class="hint">à</span> <span class="c-s200">${personName(p.to)}</span><div class="hint">${p.why}</div></span>
      ${S.paid[p.key] ? '<span class="badge sm b-em">payé</span>' : '<span class="badge sm b-amber">à payer</span>'}</label>`).join('');
  const payCard = `<div class="card p5"><div class="row sb"><h3 class="t">Paiements</h3><span class="hint">${paidN} / ${sh.payments.length} réglés</span></div>

  const fleet = `<div class="card p5 col"><div class="row sb"><h3 class="t">Fleet storage</h3><span class="badge sm b-em">vérifié</span></div>
    <p class="hint" style="margin:0">Destinataire : Mineur Charlie (Orca). Versé par Mineur Bravo : Monazite ${fmtN(7600)}, Cinnabar ${fmtN(19500)}, Sylvite ${fmtN(3100)} u, retrouvés dans les assets de Mineur Charlie (sync 22:05).</p></div>`;
  const shot = `<div class="card p5 col"><span class="lab">Répartition</span><div class="radio"><label class="on"><input type="radio" checked disabled> Prorata de la valeur</label><label class="dis"><input type="radio" disabled> Temps pondéré</label></div>
    <div class="annot"><b>Maquette ·</b> répartition au temps pondéré (#270) pas encore faite : l’option reste grisée.</div></div>`;
  return `${frozen}${unknownBanner}${kpis}${table}<div class="g3 start"><div class="span2">${payCard}</div><div class="col">${fleet}${shot}</div></div>`;
}

  }
  sites.push({ label: 'Belt VI-2', sys: 'Système A', f: 'dim. 01/11 19:10', l: '22:45', d: '3 h 35', vol: 412000, v0: 1.62e9, rate: 1915, status: ['Épuisé', 'b-slate'] });
  sites.push({ label: 'Gravimétrique Bistot', sys: 'Système C', f: 'sam. 31/10 21:00', l: '23:10', d: '2 h 10', vol: 171600, v0: 482.6e6, rate: 1320, status: ['Clôturé', 'b-slate'] });

function taxOf(q) {
  return sumKnown(Object.entries(q).map(([id, u]) => ({ label: ORE[id].name, value: priceOf(id) === null ? null : u * priceOf(id) * S.rates[ORE[id].cat] / 100 })));
}

function renderTax() {
  const tabs = `<div class="tabs"><button class="tab ${S.taxView === 'manager' ? 'on' : ''}" data-act="taxview" data-arg="manager">Gestionnaire · Corp A</button><button class="tab ${S.taxView === 'miner' ? 'on' : ''}" data-act="taxview" data-arg="miner">Ma taxe · vue mineur</button></div>`;

  return tabs + renderTaxManager(false);
}
function renderTaxManager(dim) {
  const rows = TAX_MINERS.map((m, i) => {
    const v = valueOf(m.q), t = taxOf(m.q);

      <div class="card"><span class="lab">Reste</span><div class="kpi c-white mono">${restTxt}</div><div class="hint">${due.value === null ? `dont ${fmtIsk(knownRest)} connus` : 'à encaisser'}</div></div>
      <div class="card" style="border-color:rgba(245,158,11,.2)"><span class="lab c-amber">Hors alliance</span><div class="kpi c-amber mono">1</div><div class="hint">mineur signalé</div></div>
    </div>
    <div class="card flush"><div class="card-h"><h3>Par mineur</h3><div class="seg"><button class="on">Tous</button><button>Dû</button><button>En retard</button><button>Payé</button></div></div>

const ORE_TABLE = [
  { id: 'monazite', name: 'Monazite', cat: 'R64', vol: 10, raw: 2380, comp: 2450, ref: 2700 },
  { id: 'cinnabar', name: 'Cinnabar', cat: 'R32', vol: 10, raw: 1550, comp: 1610, ref: 1720 },
  { id: 'chromite', name: 'Chromite', cat: 'R16', vol: 10, raw: 860, comp: 900, ref: 1010 },
  { id: 'sylvite',  name: 'Sylvite',  cat: 'R4',  vol: 10, raw: 160, comp: 168, ref: 190 },
  { id: 'bitumens', name: 'Bitumens', cat: 'R4',  vol: 10, raw: 110, comp: 120, ref: 135 },
  { id: 'bistot',   name: 'Bistot',   cat: 'Ore', vol: 16, raw: 3100, comp: 3260, ref: 3480 },
  { id: 'arkonor',  name: 'Arkonor',  cat: 'Ore', vol: 16, raw: 2800, comp: 2900, ref: 3350 },
  { id: 'spodumain', name: 'Spodumain', cat: 'Ore', vol: 16, raw: 2300, comp: 2420, ref: 2600 },
  { id: 'veldspar', name: 'Veldspar', cat: 'Ore', vol: 0.1, raw: 13.5, comp: 15, ref: 16.7 }
];
const SELL_PREMIUM = 1.07;
const YIELD = { base: 50, rig: { none: 0, t1: 1, t2: 3 }, sec: { high: 0, low: 0.06, null: 0.12 }, structure: { npc: 0, athanor: 0, tatara: 0.055 }, skills: { reprocessing: 5, efficiency: 5, oreProcessing: 5 } };
function yieldPct() {
  const c = S.yieldCfg;
  const k = YIELD.skills;
  const skillMul = (1 + 0.03 * k.reprocessing) * (1 + 0.02 * k.efficiency) * (1 + 0.02 * k.oreProcessing) * (1 + c.implant / 100);
  if (c.place === 'npc') return YIELD.base * skillMul;
  return (YIELD.base + YIELD.rig[c.rig]) * (1 + YIELD.sec[c.sec]) * (1 + YIELD.structure[c.place]) * skillMul;
}
function renderOre() {
  const y = yieldPct();
  const mul = S.market === 'sell' ? SELL_PREMIUM : 1;
  const rows = ORE_TABLE.map(o => {
    const compMissing = S.state === 'missing_price' && o.id === 'monazite';
    const raw = o.raw * mul / o.vol, comp = compMissing ? null : o.comp * mul / o.vol, ref = o.ref * mul * y / 100 / o.vol;
    const opts = [['Brut', raw], ['Compressé', comp], ['Retraité', ref]];
    const best = opts.some(x => x[1] === null) ? null : opts.reduce((a, b) => (b[1] > a[1] ? b : a));
    const cell = (v, isBest) => v === null ? '<span class="unk">inconnu</span>' : `<span class="${isBest ? 'c-em' : ''}">${v.toLocaleString('fr-FR', { minimumFractionDigits: 1, maximumFractionDigits: 1 })}</span>`;
    return `<tr><td class="c-s200">${o.name} <span class="hint">${o.cat}</span></td><td class="r">${String(o.vol).replace('.', ',')} m³</td><td class="r">${cell(raw, best && best[0] === 'Brut')}</td><td class="r">${cell(comp, best && best[0] === 'Compressé')}</td><td class="r">${cell(ref, best && best[0] === 'Retraité')}</td><td>${best ? `<span class="badge sm ${best[0] === 'Retraité' ? 'b-violet' : best[0] === 'Compressé' ? 'b-cyan' : 'b-slate'}">${best[0]}</span>` : '<span class="badge sm b-amber">incomplet</span>'}</td></tr>`;
  }).join('');
  const c = S.yieldCfg;
  const opt = (key, val, label, dis) => `<label class="${c[key] === val ? 'on' : ''} ${dis ? 'dis' : ''}" ${dis ? '' : `data-act="ycfg" data-arg="${key}:${val}"`}>${label}</label>`;
  const npc = c.place === 'npc';
  const formula = npc
    ? `50 × (1 + 0,03 × 5) × (1 + 0,02 × 5) × (1 + 0,02 × 5) × (1 + ${c.implant} %)`
    : `(50 + ${YIELD.rig[c.rig]}) × (1 + ${String(YIELD.sec[c.sec]).replace('.', ',')}) × (1 + ${String(YIELD.structure[c.place]).replace('.', ',')}) × 1,15 × 1,10 × 1,10 × (1 + ${c.implant} %)`;
  return `<div class="row sb"><p class="muted" style="margin:0">Que miner : ISK par m³ extrait par le laser (volume brut), selon la façon de vendre</p>
      <div class="seg"><button class="${S.market === 'buy' ? 'on' : ''}" data-act="market" data-arg="buy">Jita buy</button><button class="${S.market === 'sell' ? 'on' : ''}" data-act="market" data-arg="sell">Jita sell</button><button disabled title="Aucune structure suivie">Structure</button></div></div>
    <div class="g3 start">
      <div class="card flush span2"><div class="card-h"><h3>Valeur des minerais</h3><span class="hint">retraité au rendement de ${y.toFixed(2).replace('.', ',')} % · valeurs fictives</span></div>
        <table class="t"><thead><tr><th>Minerai</th><th class="r">Volume / u</th><th class="r">ISK/m³ brut</th><th class="r">ISK/m³ compressé</th><th class="r">ISK/m³ retraité</th><th>Meilleure option</th></tr></thead><tbody>${rows}</tbody></table>
        <div style="padding:10px 24px;border-top:1px solid var(--s800)" class="hint">Une unité compressée vaut une unité brute (#259). Une option sans prix rend la meilleure option « incomplète » : jamais un choix sur un prix absent.</div></div>
      <div class="card p5 col"><div class="row sb"><h3 class="t">Rendement de retraitement</h3><span class="hint">#269</span></div>
        <div class="field"><label class="fl">Personnage</label><select class="input"><option>Mineur Alpha</option><option>Mineur Alpha II</option></select></div>
        <div class="field"><label class="fl">Lieu</label><div class="radio">${opt('place', 'npc', 'Station NPC')}${opt('place', 'athanor', 'Athanor')}${opt('place', 'tatara', 'Tatara')}</div></div>
        <div class="field"><label class="fl">Rig</label><div class="radio">${opt('rig', 'none', 'Aucun', npc)}${opt('rig', 't1', 'T1', npc)}${opt('rig', 't2', 'T2', npc)}</div></div>
        <div class="field"><label class="fl">Sécurité</label><div class="radio">${opt('sec', 'high', 'Highsec', npc)}${opt('sec', 'low', 'Lowsec', npc)}${opt('sec', 'null', 'Nullsec / WH', npc)}</div></div>
        <div class="field"><label class="fl">Implant de retraitement (RX-80x)</label><div class="radio">${[0, 1, 2, 4].map(v => opt('implant', v, v ? `${v} %` : 'Aucun')).join('')}</div></div>
        <div class="field"><label class="fl">Compétences (ESI)</label><div class="hint">Reprocessing 5 · Reprocessing Efficiency 5 · traitement du minerai 5 · sync il y a 2 h</div></div>
        <div style="border-top:1px solid var(--s800);padding-top:12px"><div class="lab">Rendement calculé</div><div class="kpi3 c-cyan" style="margin-top:6px">${y.toFixed(2).replace('.', ',')} %</div><div class="hint mono" style="margin-top:4px">${formula}</div></div>
        <p class="hint" style="margin:0">Compétence non synchronisée : rendement <span class="unk">inconnu</span>, pas un défaut plausible.</p></div></div>`;
}

/* ---------- Rendu, toasts, horloge ---------- */
function render() {
  renderMockbar();
  document.documentElement.style.setProperty('--mbh', document.getElementById('mockbar').offsetHeight + 'px');
  const root = document.getElementById('root');
  if (S.view === 'compact') root.innerHTML = renderCompact();
  else {
    const title = { plan: 'Minage', operation: 'Minage', history: 'Minage', tax: 'Taxe lunaire', ore: 'Valeur des minerais' }[S.view];
    const inner = { plan: renderPlan, operation: renderOperation, history: renderHistory, tax: renderTax, ore: renderOre }[S.view]();
    root.innerHTML = renderShell(inner, title);
  }
  renderModal();
  updateClocks();
}
let tickStart = Date.now();
function updateClocks() {
  const elapsed = (Date.now() - tickStart) / 1000;
  const nowSec = S.now * 60 + elapsed;
  document.querySelectorAll('[data-countdown]').forEach(el => {
    const target = parseFloat(el.dataset.countdown);
    el.textContent = isNaN(target) ? '–' : (target - nowSec > 0 ? clockTxt(target - nowSec) : 'atteinte');
  });
  document.querySelectorAll('[data-countdown-abs]').forEach(el => {
    el.textContent = clockTxt(parseFloat(el.dataset.countdownAbs) - nowSec);
  });
}
function toast(msg, type = 'success') {
  const box = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.innerHTML = `${svg(type === 'success' ? ICON.ok : ICON.warn)}<span>${msg}</span>`;
  box.appendChild(t);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => t.remove(), 6000);
}

function addScan(fromRealPaste) {
  if (S.status !== 'running') return;
  const before = estimateSite(scanList(S.scansN));
  S.scansN += 1;
  const scans = scanList(S.scansN);
  const last = scans[scans.length - 1];
  S.now = last.t;
  tickStart = Date.now();
  const after = estimateSite(scans);
  const b = before.siteTrend === null ? 'inconnue' : hm(before.siteTrend);
  const a = after.siteTrend === null ? 'inconnue' : hm(after.siteTrend);
  render();
  toast(`Scan ${S.scansN} ajouté · ${Object.keys(last.q).length} types · ETA tendance ${b} → ${a}`);
  if (fromRealPaste) toast('Format du collage pas encore fixé : scan fictif ajouté, texte non enregistré', 'warning');
}

function applyHash() {
  const params = new URLSearchParams(location.hash.replace(/^#/, ''));
  S = baseState();
  const p = parseInt(params.get('p') || '0', 10);
  const m = params.get('m');
  if (p) applyStep(p);
  else if (m) { applyStep(MODE_TO_STEP[m]); S.step = 0; S.modal = null; }
  if (params.get('v')) { S.view = params.get('v'); if (!p && !m && ['operation', 'compact'].includes(S.view)) { applyStep(6); S.step = 0; S.view = params.get('v'); } }
  if (params.get('s')) S.state = params.get('s');
  if (S.state === 'ledger_wait' && S.created && ['shares', 'settled', 'running'].includes(S.status)) { S.status = 'closing'; S.closePhase = 'waiting'; S.now = CLOSING_NOW_MIN; S.paid = {}; S.readCount = 0; }
  if (S.state === 'ledger_wait' && S.status === 'closing') S.closePhase = 'waiting';
  if (params.get('phase')) { S.closePhase = params.get('phase'); S.readCount = S.closePhase === 'reading' ? 4 : S.closePhase === 'done' ? 10 : 0; }
  if (params.get('modal')) S.modal = params.get('modal');
  if (params.get('tax')) S.taxView = params.get('tax');
  if (params.get('expand')) params.get('expand').split(',').forEach(id => { S.expanded[id] = true; });
  if (p === 6) { tickStart = Date.now(); setTimeout(() => toast(`Scan 4 ajouté · 4 types · ETA tendance ${hm(estimateSite(scanList(3)).siteTrend)} → ${hm(estimateSite(scanList(4)).siteTrend)}`), 50); }
  tickStart = Date.now();
  render();
}
function go(hash) { if (location.hash === '#' + hash) applyHash(); else location.hash = hash; }

let readTimer = null;
function startReading() {
  S.closePhase = 'reading'; S.readCount = 0; render();
  clearInterval(readTimer);
  const total = includedPeople().reduce((s, p) => s + p.chars.length, 0);
  readTimer = setInterval(() => {
    S.readCount += 1;
    if (S.readCount >= total) { S.readCount = total; S.closePhase = 'done'; clearInterval(readTimer); }
    render();
  }, 450);
}

document.addEventListener('click', e => {
  const h = e.target.closest('[data-hash]');
  if (h && !h.disabled) { go(h.dataset.hash); return; }
  const a = e.target.closest('[data-act]');
  if (!a || a.disabled) return;
  const act = a.dataset.act, arg = a.dataset.arg;
  if (['state', 'joinsel', 'pay', 'rate'].includes(act)) return;
  switch (act) {
    case 'tour-start': go('p=1'); break;
    case 'tour-next': go('p=' + Math.min(11, (S.step || 0) + 1)); break;
    case 'tour-prev': go('p=' + Math.max(1, S.step - 1)); break;
    case 'chunk': S.selChunk = arg; render(); break;
    case 'open-create': S.modal = 'create'; render(); break;
    case 'create': S.step ? go('p=3') : (S.created = true, S.status = 'planned', S.view = 'operation', S.modal = 'created', render()); break;
    case 'close': S.modal = null; render(); break;
    case 'copy': S.copied = true; render(); toast('Lien d’invitation copié'); break;
    case 'open-join': S.modal = 'join'; render(); break;
    case 'join': S.deltaJoined = true; S.modal = null; render(); toast('Mineur Delta a rejoint avec 2 personnages · instantané à 20:00'); break;
    case 'start': S.step ? go('p=5') : (applyStep(5), S.step = 0, render()); break;
    case 'paste': addScan(false); break;
    case 'accept': S.foxtrot = 'accepted'; render(); toast('Mineur Foxtrot accepté · instantané de début pris maintenant'); break;
    case 'open-end': S.modal = 'end'; render(); break;
    case 'end': S.step ? go('p=8') : (S.status = 'closing', S.closePhase = 'waiting', S.now = CLOSING_NOW_MIN, S.modal = null, tickStart = Date.now(), render()); break;
    case 'expire': startReading(); break;
    case 'to-shares': S.status = 'shares'; S.step = S.step ? 9 : 0; render(); break;
    case 'expand': S.expanded[arg] = !S.expanded[arg]; render(); break;
    case 'settle': S.status = 'settled'; S.settledAt = 'jeu. 05/11 22:31'; render(); toast('Opération réglée : chiffres figés'); break;
    case 'taxview': S.taxView = arg; render(); break;
    case 'taxpay': { const m = TAX_MINERS[arg]; const t = taxOf(m.q).value; S.taxPaidManual[arg] = (S.taxPaidManual[arg] || 0) + (t - m.paid - (S.taxPaidManual[arg] || 0)); render(); break; }
    case 'taxbasis': S.taxBasis = arg; render(); break;
    case 'period': S.period = arg; render(); break;
    case 'market': S.market = arg; render(); break;
    case 'ycfg': { const [k, v] = arg.split(':'); S.yieldCfg[k] = k === 'implant' ? Number(v) : v; render(); break; }
  }
});
document.addEventListener('change', e => {
  const a = e.target.closest('[data-act]');
  if (!a) return;
  if (a.dataset.act === 'state') { const params = new URLSearchParams(location.hash.replace(/^#/, '')); params.set('s', a.value); go(params.toString()); }
  if (a.dataset.act === 'joinsel') { S.joinSel[a.dataset.arg] = a.checked; render(); }
  if (a.dataset.act === 'pay') { S.paid[a.dataset.arg] = a.checked; render(); }
  if (a.dataset.act === 'rate') { S.rates[a.dataset.arg] = Math.max(0, Math.min(100, Number(a.value) || 0)); render(); }
});
document.addEventListener('paste', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea') return;
  if (!['operation', 'compact'].includes(S.view) || S.status !== 'running') return;
  e.preventDefault();
  addScan(true);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.modal) { S.modal = null; render(); } });
window.addEventListener('hashchange', applyHash);
setInterval(updateClocks, 1000);
applyHash();
</script>
