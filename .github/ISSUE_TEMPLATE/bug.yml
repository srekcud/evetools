name: Bug
description: Un comportement observé ne correspond pas au comportement attendu.
labels: ["bug"]
body:
  - type: dropdown
    id: module
    attributes:
      label: Module
      description: Le mainteneur ajoute le label correspondant au module choisi.
      options:
        - industry
        - corp-industry
        - pi
        - market
        - mining
        - pve
        - intel
        - infra
    validations:
      required: true
  - type: textarea
    id: constat
    attributes:
      label: Constat
      description: Ce qui se passe, ce qui était attendu, et les étapes pour reproduire.
    validations:
      required: true
  - type: textarea
    id: preuve
    attributes:
      label: Preuve
      description: "Fichier:ligne si vous l'avez localisé, message d'erreur, capture. Laissez vide si inconnu."
    validations:
      required: false
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Qui est touché, et ce que ça fausse ou bloque.
    validations:
      required: true
  - type: textarea
    id: test
    attributes:
      label: Test qui le prouverait
      description: Le test qui échoue aujourd'hui et passera une fois le bug corrigé (entrée, résultat attendu).
    validations:
      required: false
  - type: checkboxes
    id: anonymisation
    attributes:
      label: Anonymisation
      options:
        - label: "Cette issue ne contient aucun pseudo, nom de personnage, de corporation, d'alliance ou de structure, ni citation de message privé (le dépôt est public)."
          required: true
