:root {
  --s950:#020617; --s900:#0f172a; --s800:#1e293b; --s700:#334155; --s600:#475569; --s500:#64748b; --s400:#94a3b8; --s300:#cbd5e1; --s200:#e2e8f0; --s100:#f1f5f9;
  --c400:#22d3ee; --c500:#06b6d4; --c600:#0891b2; --e400:#34d399; --e500:#10b981; --e600:#059669;
  --a300:#fcd34d; --a400:#fbbf24; --a500:#f59e0b; --a600:#d97706; --r400:#f87171; --r500:#ef4444; --v400:#a78bfa; --v500:#8b5cf6; --sky400:#38bdf8;
  --warning:#f59e0b; --chart-grid:#334155; --chart-text:#e2e8f0;
  --mono:'Share Tech Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--s950); color: var(--s100); font-family: ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji"; font-size: 14px; line-height: 1.43; }
button { font: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; }
input, select { font: inherit; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.bg-grid { position: fixed; inset: 0; pointer-events: none; background-image: linear-gradient(rgba(6,182,212,.03) 1px, transparent 1px), linear-gradient(90deg, rgba(6,182,212,.03) 1px, transparent 1px); background-size: 50px 50px; }
.bg-glow { position: fixed; top: -50%; left: -50%; width: 100%; height: 100%; pointer-events: none; background: radial-gradient(closest-side, rgba(22,78,99,.2), transparent); }

/* Barre de maquette */
.mockbar { position: relative; z-index: 60; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px 14px; background: repeating-linear-gradient(135deg, #160f24 0 10px, #120c1e 10px 20px); border-bottom: 2px dashed rgba(167,139,250,.55); font-size: 12px; color: #c4b5fd; }
.mockbar .lbl { font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: 11px; color: var(--v400); }
.mockbar .grp { display: flex; align-items: center; gap: 4px; padding-left: 10px; border-left: 1px dashed rgba(167,139,250,.35); }
.mockbar button, .mockbar select { background: rgba(167,139,250,.08); color: #ddd6fe; border: 1px dashed rgba(167,139,250,.45); border-radius: 6px; padding: 3px 8px; font-size: 12px; }
.mockbar button.on { background: rgba(167,139,250,.28); border-style: solid; color: #fff; }
.mockbar .step { font-family: var(--mono); color: #fff; min-width: 210px; }

/* Shell (MainLayout.vue) */
.app { position: relative; display: flex; min-height: calc(100vh - 44px); }
aside.side { width: 256px; flex-shrink: 0; background: var(--s900); border-right: 1px solid rgba(6,182,212,.2); display: flex; flex-direction: column; position: sticky; top: 0; height: calc(100vh - var(--mbh, 0px)); }
.logo { padding: 24px; border-bottom: 1px solid rgba(6,182,212,.2); display: flex; align-items: center; gap: 12px; }
.logo .ic { width: 40px; height: 40px; border-radius: 8px; background: linear-gradient(to bottom right, #06b6d4, #2563eb); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 15px -3px rgba(6,182,212,.3); }
.logo h1 { margin: 0; font-size: 18px; line-height: 28px; font-weight: 700; letter-spacing: -.025em; background: linear-gradient(to right, #22d3ee, #60a5fa); -webkit-background-clip: text; background-clip: text; color: transparent; }
.logo p { margin: 0; font-size: 12px; color: var(--s500); letter-spacing: .1em; text-transform: uppercase; }
nav.menu { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
.ni { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 8px; border: 1px solid transparent; color: var(--s400); background: none; text-align: left; font-weight: 500; font-size: 14px; }
.ni:hover { background: rgba(30,41,59,.5); color: var(--s200); border-color: rgba(6,182,212,.3); }
.ni svg { width: 20px; height: 20px; flex-shrink: 0; }
.ni.on { background: linear-gradient(to right, rgba(6,182,212,.2), rgba(59,130,246,.1)); color: var(--c400); border-color: rgba(6,182,212,.3); box-shadow: 0 10px 15px -3px rgba(6,182,212,.1); }
.ni .dot { margin-left: auto; width: 6px; height: 6px; border-radius: 50%; background: var(--c400); }
.ni .chev { margin-left: auto; width: 16px; height: 16px; }
.sub { padding-left: 16px; display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
.sub .ni { padding: 10px 16px; font-size: 14px; }
.sub .ni svg { width: 16px; height: 16px; }
.charcard { margin: 16px; margin-top: 0; padding-top: 16px; border-top: 1px solid rgba(6,182,212,.2); }
.charcard .in { background: var(--s900); border: 1px solid var(--s800); border-radius: 12px; padding: 16px; display: flex; align-items: center; gap: 12px; }
.avatar { width: 48px; height: 48px; border-radius: 8px; box-shadow: 0 0 0 2px rgba(6,182,212,.5); background: linear-gradient(135deg, #334155, #1e293b); display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--s300); }
main.content { flex: 1; min-width: 0; }
header.top { position: sticky; top: 0; z-index: 10; background: var(--s900); border-bottom: 1px solid rgba(6,182,212,.1); padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
header.top h2 { margin: 0; font-size: 24px; line-height: 32px; font-weight: 700; color: var(--s100); }
header.top p { margin: 4px 0 0; font-size: 14px; color: var(--s500); }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 8px; border: 1px solid; font-size: 12px; }
.pill.esi { background: rgba(16,185,129,.1); border-color: rgba(16,185,129,.3); color: var(--e400); }
.pill.esi i { width: 8px; height: 8px; border-radius: 50%; background: var(--e500); }
.pill.all { padding: 8px 16px; background: rgba(245,158,11,.1); border-color: rgba(245,158,11,.3); color: var(--a400); font-size: 14px; font-weight: 500; }
.pill.corp { padding: 8px 16px; background: rgba(6,182,212,.1); border-color: rgba(6,182,212,.3); color: var(--c400); font-size: 14px; font-weight: 500; }
.page { padding: 32px; }
.wrap { max-width: 80rem; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }

/* Briques (Ledger, MiningTab, GroupIndustry) */
.card { background: var(--s900); border: 1px solid var(--s800); border-radius: 12px; padding: 16px; }
.card.p5 { padding: 20px; }
.card.p6 { padding: 24px; }
.card.soft { background: rgba(15,23,42,.8); }
.card.flush { padding: 0; overflow: hidden; }
.card-h { padding: 16px 24px; border-bottom: 1px solid var(--s800); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.card-h h3, h3.t { margin: 0; font-size: 18px; line-height: 28px; font-weight: 600; color: #fff; }
.lab { font-size: 12px; color: var(--s400); text-transform: uppercase; letter-spacing: .05em; }
.lab.dim { color: var(--s500); }
.kpi { margin-top: 4px; font-size: 20px; line-height: 28px; font-weight: 700; }
.kpi3 { font-size: 30px; line-height: 36px; font-weight: 700; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.hint { font-size: 12px; color: var(--s500); }
.hint2 { font-size: 12px; color: #475569; }
.muted { color: var(--s400); }
.c-cyan { color: var(--c400); } .c-em { color: var(--e400); } .c-amber { color: var(--a400); } .c-red { color: var(--r400); } .c-violet { color: var(--v400); } .c-white { color: #fff; } .c-s300 { color: var(--s300); } .c-s200 { color: var(--s200); } .c-s500 { color: var(--s500); }
.unk { color: var(--warning); font-style: italic; }
.row { display: flex; align-items: center; gap: 12px; }
.row.sb { justify-content: space-between; }
.row.wrapf { flex-wrap: wrap; }
.col { display: flex; flex-direction: column; gap: 12px; }
.g2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }
.g3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; }
.g4 { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 16px; }
.span2 { grid-column: span 2 / span 2; }
.start { align-items: start; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px; border: 0; font-size: 14px; font-weight: 500; white-space: nowrap; transition: transform .15s, background .15s; }
.btn:hover:not(:disabled) { transform: translateY(-1px); }
.btn:disabled { opacity: .5; }
.btn svg { width: 16px; height: 16px; }
.btn.pri { background: var(--c600); color: #fff; } .btn.pri:hover:not(:disabled) { background: var(--c500); }
.btn.sec { background: var(--s700); color: var(--s200); } .btn.sec:hover:not(:disabled) { background: var(--s600); }
.btn.amb { background: var(--a600); color: #fff; } .btn.amb:hover:not(:disabled) { background: var(--a500); }
.btn.em { background: var(--e600); color: #fff; }
.btn.sm { padding: 6px 10px; font-size: 13px; }
.btn.xs { padding: 3px 8px; font-size: 12px; border-radius: 6px; }
.btn.ghost { background: transparent; color: var(--s400); border: 1px solid var(--s700); }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; padding: 4px 10px; border-radius: 8px; font-weight: 500; border: 1px solid; white-space: nowrap; }
.badge.sm { padding: 2px 8px; border-radius: 4px; }
.b-slate { background: var(--s700); color: var(--s400); border-color: var(--s600); }

/* ---------- Estimation (spec #267, R1-R12) ---------- */
function estimateType(id, scans) {
  const present = scans.map((s, i) => ({ i, t: s.t, q: s.q[id] })).filter(p => p.q !== undefined);
  const res = { id, present, last: null, recent: null, trend: null, recentEta: null, trendEta: null, reason: null, devU: null, devPct: null, irregular: false, depleted: null };
  if (present.length === 0) return null;
  const lastP = present[present.length - 1];
  if (lastP.i < scans.length - 1) { res.depleted = { from: lastP.t, to: scans[lastP.i + 1].t }; res.last = 0; return res; }
  res.last = lastP.q;
  if (present.length < 2) { res.reason = 'single_scan'; return res; }
  const a = present[present.length - 2], b = lastP;
  res.recent = (a.q - b.q) / (b.t - a.t);
  res.recentEta = res.recent > 0 ? b.t + b.q / res.recent : null;
  const n = present.length;
  const tb = present.reduce((s, p) => s + p.t, 0) / n;
  const qb = present.reduce((s, p) => s + p.q, 0) / n;
  const sxx = present.reduce((s, p) => s + (p.t - tb) ** 2, 0);
  const sxy = present.reduce((s, p) => s + (p.t - tb) * (p.q - qb), 0);
  const slope = sxy / sxx;
  res.trend = -slope; res.tb = tb; res.qb = qb; res.slope = slope;
  res.trendEta = res.trend > 0 ? tb + qb / res.trend : null;
  if (n >= 3) {
    res.devU = Math.max(...present.map(p => Math.abs(p.q - (qb + slope * (p.t - tb)))));
    res.devPct = res.devU / present[0].q * 100;
    res.irregular = res.devPct > IRREGULAR_THRESHOLD_PCT;
  }
  if (res.recentEta === null && res.trendEta === null) res.reason = 'not_depleting';
  return res;
}
function priceOf(id) {
  if (S.state === 'missing_price' && id === 'monazite') return null;
  return ORE[id].price;
}
function sumKnown(items) {
  const missing = items.filter(x => x.value === null).map(x => x.label);
  if (missing.length) return { value: null, missing: [...new Set(missing)] };
  return { value: items.reduce((s, x) => s + x.value, 0), missing: [] };
}
function estimateSite(scans, siteTypes) {
  const types = siteTypes.map(id => estimateType(id, scans)).filter(Boolean);
  const mined = types.filter(t => !t.depleted && t.reason !== 'not_depleting' && t.reason !== 'single_scan');
  const latest = key => { const known = mined.map(t => t[key]).filter(v => v !== null); return known.length ? Math.max(...known) : null; };
  const siteRecent = latest('recentEta');
  const siteTrend = latest('trendEta');
  const driverTrend = mined.find(t => t.trendEta === siteTrend) || null;
  const valued = types.filter(t => !t.depleted && priceOf(t.id) !== null);
  const best = valued.length ? valued.reduce((m, t) => (priceOf(t.id) / ORE[t.id].vol > priceOf(m.id) / ORE[m.id].vol ? t : m)) : null;
  const remaining = sumKnown(types.filter(t => t.last > 0).map(t => ({ label: ORE[t.id].name, value: priceOf(t.id) === null ? null : t.last * priceOf(t.id) })));
  const extracted = sumKnown(types.map(t => ({ t, ex: t.present[0].q - t.last })).filter(x => x.ex > 0)
    .map(x => ({ label: ORE[x.t.id].name, value: priceOf(x.t.id) === null ? null : x.ex * priceOf(x.t.id) })));
  const remainingUnits = types.reduce((s, t) => s + t.last, 0);
  const progTypes = types.filter(t => t.reason !== 'not_depleting');
  const initVol = progTypes.reduce((s, t) => s + t.present[0].q * ORE[t.id].vol, 0);
  const leftVol = progTypes.reduce((s, t) => s + t.last * ORE[t.id].vol, 0);
  const progress = initVol > 0 ? leftVol / initVol : null;
  const emptied = mined.length === 0 && types.some(t => t.depleted);

}

  return pre + String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + (withSec ? ':' + String(totalSec % 60).padStart(2, '0') : '');
}

  const order = isSolo() ? ['planned', 'running', 'closing', 'settled'] : ['planned', 'running', 'closing', 'shares', 'settled'];
  const idx = order.indexOf(S.status);
  const labels = isSolo() ? ['Planifiée', 'En cours', 'Clôture', 'Terminée'] : ['Planifiée', 'En cours', 'Clôture', 'Parts', 'Réglée'];
  return `<div class="stepper">${labels.map((l, i) => {
    const cls = i < idx || (S.status === 'settled' && i === idx) ? 'done' : i === idx ? 'cur' : '';
    return `${i ? `<div class="stl ${i <= idx ? 'done' : ''}"></div>` : ''}<div class="stp ${cls}"><span class="n">${cls === 'done' ? '✓' : i + 1}</span>${l}</div>`;
  }).join('')}</div>`;
}
function detachLabel() { return pip ? (pip.kind === 'pip' ? 'Détaché' : 'En popup') : 'Détacher'; }

        <p class="hint" style="font-size:14px;margin:0">${meta} · Owner : Mineur Alpha · ${OP.basis} · ${isSolo() ? '<span class="c-violet">chacun pour soi</span> · boost de Mineur Charlie sans part' : `booster ${OP.boosterPct} % (Mineur Charlie) · corpo ${OP.corpPct} %`}</p>

function renderOperation() {

function participantRows(mode) {

    const [pres, presTxt] = presenceOf(p.id);
    let state;
    if (p.late && S.foxtrot === 'pending') state = `<span class="badge sm b-violet">demande ${hm(13)}</span>`;
    else if (mode === 'planned') state = `<span class="badge sm b-slate">inscrit · ${p.chars.length} perso${p.chars.length > 1 ? 's' : ''}</span>`;

function niceStep(raw) { return [500, 1000, 2000, 5000, 10000, 20000, 50000].find(s => s >= raw) || 100000; }
function chartSvg(est, w, h, small) {
  const scans = est.scans;
  const m = small ? { l: 30, r: 8, t: 10, b: 20 } : { l: 48, r: 14, t: 22, b: 28 };
  const iw = w - m.l - m.r, ih = h - m.t - m.b;
  const fs = small ? 10 : 11;
  const tMin = Math.floor(scans[0].t / 15) * 15;
  const etas = est.mined.flatMap(t => [t.trendEta, t.recentEta]).filter(v => v !== null);
  const tMaxRaw = Math.max(S.now, ...etas, scans[scans.length - 1].t + 10);
  const tMax = Math.min(Math.ceil((tMaxRaw + 4) / 15) * 15, tMin + 300);
  const qMaxRaw = Math.max(...scans.flatMap(s => Object.values(s.q)));
  const qStep = niceStep(qMaxRaw * 1.08 / (small ? 2 : 4));
  const qMax = Math.ceil(qMaxRaw * 1.08 / qStep) * qStep;
  const X = t => m.l + ((t - tMin) / (tMax - tMin)) * iw, Y = q => m.t + ih - (q / qMax) * ih;
  const span = tMax - tMin;
  const xStep = small ? (span <= 120 ? 30 : 60) : span <= 120 ? 15 : span <= 240 ? 30 : 60;
  let g = '';
  for (let q = 0; q <= qMax; q += qStep) g += `<line x1="${m.l}" x2="${w - m.r}" y1="${Y(q)}" y2="${Y(q)}" stroke="#334155" stroke-width="1" ${q ? 'stroke-dasharray="2 4"' : ''}/><text x="${m.l - 6}" y="${Y(q) + 4}" text-anchor="end" font-size="${fs}" fill="#94a3b8" font-family="Share Tech Mono, monospace">${q ? q / 1000 + 'k' : '0'}</text>`;
  for (let t = tMin; t <= tMax; t += xStep) g += `<text x="${X(t)}" y="${h - 6}" text-anchor="middle" font-size="${fs}" fill="#94a3b8" font-family="Share Tech Mono, monospace">${hm(t)}</text><line x1="${X(t)}" x2="${X(t)}" y1="${m.t + ih}" y2="${m.t + ih + 4}" stroke="#475569"/>`;
  const clip = (t0, q0, slope) => { const tz = t0 - q0 / slope; const tEnd = Math.min(tz, tMax); return [tEnd, q0 + slope * (tEnd - t0)]; };
  let lines = '';
  est.types.forEach(t => {
    const col = ORE[t.id].color;
    const pts = t.present;
    if (t.trend !== null && t.trend > 0) {
      const t0 = pts[0].t, q0 = t.qb + t.slope * (t0 - t.tb);
      const [te, qe] = clip(t0, q0, t.slope);
      lines += `<line x1="${X(t0)}" y1="${Y(q0)}" x2="${X(te)}" y2="${Y(qe)}" stroke="${col}" stroke-width="2" opacity=".85"/>`;
    }
    if (t.recent !== null && t.recent > 0) {
      const a = pts[pts.length - 1];
      const [te, qe] = clip(a.t, a.q, -t.recent);
      lines += `<line x1="${X(a.t)}" y1="${Y(a.q)}" x2="${X(te)}" y2="${Y(qe)}" stroke="${col}" stroke-width="1.6" stroke-dasharray="5 4"/>`;
    }
    if (t.depleted) lines += `<circle cx="${X(t.depleted.to)}" cy="${Y(0)}" r="4" fill="none" stroke="${col}" stroke-width="1.5"/>`;
    pts.forEach(p => { lines += `<circle cx="${X(p.t)}" cy="${Y(p.q)}" r="${small ? 2.5 : 3.5}" fill="${t.reason === 'not_depleting' ? '#64748b' : col}" stroke="#0f172a" stroke-width="1"/>`; });
  });
  const nowX = X(Math.min(S.now, tMax));
  let marks = `<line x1="${nowX}" x2="${nowX}" y1="${m.t}" y2="${m.t + ih}" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3" opacity=".6"/>`;
  if (!small) marks += `<text x="${nowX - 4}" y="${m.t - 8}" text-anchor="end" font-size="11" fill="#cbd5e1">maintenant</text>`;
  if (!small && est.siteTrend !== null && est.siteTrend <= tMax) {
    const ex = X(est.siteTrend);
    const close = Math.abs(ex - nowX) < 90;
    marks += `<line x1="${ex}" x2="${ex}" y1="${m.t}" y2="${m.t + ih}" stroke="#22d3ee" stroke-width="1" stroke-dasharray="1 3"/><text x="${ex + 4}" y="${close ? m.t + 12 : m.t - 8}" font-size="11" fill="#22d3ee" font-family="Share Tech Mono, monospace">ETA ${hm(est.siteTrend)}</text>`;
  }
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block">${g}${lines}${marks}</svg>`;
}

function lastScanInfo(est) {
  const last = est.scans[est.scans.length - 1];
  return { n: est.scans.length, at: hm(last.t), ago: Math.max(0, Math.round(S.now - last.t)), types: Object.keys(last.q).length, by: last.by, t: last.t };
}
function valueBlock(v) {
  return v.value === null ? `<span class="unk">inconnue</span><div class="hint">sans prix : ${v.missing.join(', ')}</div>` : fmtIsk(v.value);
}

function renderSiteStrip() {
  if (!S.sites.length) return '';
  const cards = S.sites.map((s, i) => {
    const e = estimateFor(s);
    const first = e.scans[0];
    const cur = !s.closedAt && S.status === 'running';

    const left = s.closedAt && !e.emptied ? e.types.filter(t => t.last > 0 && t.reason !== 'not_depleting').map(t => `${ORE[t.id].name} ${fmtN(t.last)} u`).join(', ') : '';

      <div class="row" style="gap:8px"><span class="lab dim">extrait</span><span class="mono c-amber">${valueBlock(e.extracted)}</span>${e.scans.length < 2 ? '<span class="hint">mesuré entre le premier et le dernier scan</span>' : ''}</div></div>`;

  return `<div class="col" style="gap:8px"><div class="row sb"><span class="lab">Sites de l’opération</span>${S.status === 'running' ? `<button class="btn sec sm" data-act="new-site">${svg(ICON.plus)}Nouveau site</button>` : ''}</div><div class="sitestrip">${cards}</div>
    <div class="annot"><b>Maquette · proposition hors spec ·</b> plusieurs sites par opération : « Nouveau site » clôture le site courant (R17, à la main) et en ouvre un lié à la même opération ; l’ETA repart. Les parts restent calculées sur le ledger de toute l’opération.</div></div>`;
}

function scanFeed(site) {
  const scans = scanList(site);
  const types = SITE_DEFS[site.def].types;
  const rows = scans.map((s, i) => ({ s, i, eta: estimateSite(scans.slice(0, i + 1), types).siteTrend })).slice(-5).reverse();
  return `<div class="card p5"><div class="row sb"><h3 class="t">Fil des scans · ${siteLabel(site)}</h3><span class="hint">partagé en direct à la flotte</span></div>
    ${rows.map(r => `<div class="row sb" style="padding:7px 0;border-top:1px solid var(--s800)"><span class="row" style="gap:10px"><span class="mono c-s200">#${r.i + 1} · ${hm(r.s.t)}</span><span class="c-s300">${personName(r.s.by)}</span>${r.s.by === 'alpha' ? '<span class="hint">vous</span>' : ''}</span><span class="hint">${Object.keys(r.s.q).length} types · ETA tendance <span class="mono c-s200">${r.eta === null ? 'inconnue' : hm(r.eta)}</span></span></div>`).join('')}
    <div class="annot" style="margin-top:10px"><b>Maquette · proposition hors spec ·</b> site partagé à la flotte : tous les participants voient les mêmes scans en direct (Mercure, topic de l’opération) et chaque scan porte son auteur. Un scan toutes les ${S.cmp.rescanMin} min suffit pour toute la flotte. La spec #267 met ce partage hors périmètre.</div></div>`;
}

/* ---------- V4 · downtime, hauler, roches ---------- */
const trendAt = (t, at) => Math.max(0, t.qb + t.slope * (at - t.tb));
function downtimeRisk(est) {
  const dt = downtimeMin();
  if (!est || est.siteTrend === null || est.siteTrend <= dt || S.now >= dt) return null;
  const left = sumKnown(est.mined.map(t => ({ label: ORE[t.id].name, value: priceOf(t.id) === null ? null : trendAt(t, dt) * priceOf(t.id) })));
  return { dt, value: left.value, missing: left.missing, perType: est.mined.map(t => ({ id: t.id, q: trendAt(t, dt) })).filter(x => x.q > 0), notMined: est.types.filter(t => t.reason === 'not_depleting') };
}
function ledgerSnapshot() {
  const tl = ledgerReadMin();
  const rows = includedPeople().flatMap(p => {
    const [ws, we] = presenceWindow(p);
    return p.chars.filter(cid => Object.keys(CHARS[cid].q).length).map(cid => {
      let u = 0;
      Object.entries(CHARS[cid].q).forEach(([id, q]) => { const [a, b] = SITE1_ORES.includes(id) ? [ws, Math.min(we, SITE1_CLOSED_MIN)] : [SITE1_CLOSED_MIN, OP_END_MIN]; u += q * Math.max(0, Math.min(1, (tl - a) / (b - a))); });
      return { pid: p.id, cid, u, min: Math.max(0, Math.min(tl, we) - ws) };
    });
  });
  return { tl, rows, units: rows.reduce((x, r) => x + r.u, 0), minutes: rows.reduce((x, r) => x + r.min, 0) };
}
function perCharRate() { const l = ledgerSnapshot(); return l.units > 0 && l.minutes > 0 ? l.units / l.minutes : null; }
const boost = () => BOOST_SHIPS[S.boost.ship];
const oreKind = id => ['R4', 'R8', 'R16', 'R32', 'R64'].includes(ORE[id].cat) ? 'moon' : 'asteroid';
const compName = (ship, k) => `${BOOST_SHIPS[ship].size} ${COMP_KIND[k]} Compressor I`;
const compressible = id => boost().kinds.includes(oreKind(id)) && S.boost.comps.includes(oreKind(id));
function setBoostShip(ship) { S.boost = { ship, comps: BOOST_SHIPS[ship].kinds.slice() }; CHARS.charlie.ship = BOOST_SHIPS[ship].name; }
function compressionGap(est) {
  const kinds = [...new Set(est.types.filter(t => t.reason !== 'not_depleting').map(t => oreKind(t.id)))];
  const noHull = kinds.filter(k => !boost().kinds.includes(k));
  const notFitted = kinds.filter(k => boost().kinds.includes(k) && !S.boost.comps.includes(k));
  return { noHull, notFitted };
}
function compressionBanner(est, compact) {
  const g = compressionGap(est);
  if (!g.noHull.length && !g.notFitted.length) return '';
  const txt = g.noHull.length ? `Le ${boost().name} ne peut pas compresser ${g.noHull.map(k => KIND_FR[k]).join(', ')} : volume brut à transporter` : `Aucun compresseur monté pour ${g.notFitted.map(k => KIND_FR[k]).join(', ')} : volume brut à transporter`;
  if (compact) return `<div class="cmp-warn">${txt}.</div>`;
  return `<div class="banner amber">${svg(ICON.warn)}<div><b>${txt}.</b> Compresseurs du ${boost().name} : ${boost().kinds.map(k => compName(S.boost.ship, k)).join(', ')} (SDE, Industrial Core actif requis). Le planning du hauler ci-dessous compte le volume brut pour ces types. La valeur des parts ne change pas : elle est déjà au prix compressé, 1 u brute = 1 u compressée.</div></div>`;
}
function compTag(id, compact) {
  const ok = compressible(id);
  if (compact) return `<span class="hint" style="font-size:10px">${ok ? 'compr.' : 'brut'}</span>`;
  return ok ? '<span class="badge sm b-em" title="compressible sur place">sur place</span>' : '<span class="badge sm b-amber" title="aucun compresseur adapté">aucun</span>';
}
function haulerPlan(est) {
  const l = ledgerSnapshot();
  const fleetIds = PEOPLE.filter(p => p.fleet).map(p => p.id);
  const base = { cap: boost().fleet, holdCap: boost().hold, ship: boost().name, hauler: personName(OP.fleetTo), contributors: PEOPLE.filter(p => p.fleet).map(p => p.name) };
  if (!est || !l.units) return { ...base, unknown: 'pas encore de ledger : part du fleet storage inconnue' };
  const share = l.rows.filter(r => fleetIds.includes(r.pid)).reduce((x, r) => x + r.u, 0) / l.units;
  const rate = est.mined.reduce((x, t) => x + t.trend * ORE[t.id].vol, 0);
  if (!(rate > 0)) return { ...base, unknown: 'débit du site inconnu (un seul scan)' };
  const rin = rate * share;
  const emptied = S.hangarEmptied !== null ? S.hangarEmptied : S.now - HANGAR_EMPTIED_AGO_MIN;
  const fill = Math.min(base.cap, Math.max(0, S.now - emptied) * rin);
  const fullIn = (base.cap - fill) / rin;
  const tr = est.mined.reduce((x, t) => x + t.trend * share * (compressible(t.id) ? COMPRESSED_VOL[t.id] : ORE[t.id].vol), 0);
  const hold = Math.max(0, S.now - emptied) * tr;
  const toMove = est.siteTrend === null ? null : hold + Math.max(0, est.siteTrend - S.now) * tr;
  const trips = toMove === null ? null : Math.max(1, Math.ceil(toMove / base.holdCap));
  const rawIds = est.mined.filter(t => !compressible(t.id)).map(t => t.id);
  return { ...base, share, rate, rin, emptied, fill, pct: fill / base.cap, fullIn, tr, hold, toMove, trips, rawIds, end: est.siteTrend, tl: l.tl };
}
function rockPlan(est) {
  const live = est ? est.mined.filter(t => t.trendEta !== null && t.trend > 0) : [];
  if (live.length < 2) return { none: 'un seul minerai miné : rien à répartir' };
  const pc = perCharRate();
  if (pc === null) return { none: 'débit par personnage inconnu : pas encore de ledger' };
  const B = live.reduce((m, t) => (t.trendEta > m.trendEta ? t : m));
  const opts = live.filter(t => t !== B).map(A => {
    const ra = A.trend - pc;
    if (ra <= 0) return null;
    const ea = S.now + trendAt(A, S.now) / ra, eb = S.now + trendAt(B, S.now) / (B.trend + pc);
    const rest = live.filter(t => t !== A && t !== B).map(t => t.trendEta);
    return { A, ea, eb, end: Math.max(ea, eb, ...rest) };
  }).filter(Boolean);
  const best = opts.length ? opts.reduce((m, o) => (o.end < m.end ? o : m)) : null;
  if (!best || best.end >= B.trendEta) return { none: 'aucun déplacement d’un mineur ne fait finir plus tôt', B, pc, live };
  return { ...best, B, pc, live, before: B.trendEta };
}

function snapshotRows() {
  const order = includedPeople().flatMap(p => p.chars.map(c => ({ c, p })));
  let k = 0;
  return order.map(({ c, p }) => {
    const unknown = charUnknownReason(c);
    const early = p.id === 'echo' && S.echoLeftAt !== null;
    let st, read;
    if (early && !unknown) { st = `<span class="badge sm b-em">✓ lu ${hm(S.echoLeftAt + LEDGER_CACHE_MIN)} · départ ${hm(S.echoLeftAt)}</span>`; read = true; }
    else {
      const i = k++;
      if (S.closePhase === 'waiting') { st = '<span class="hint">en file</span>'; read = false; }
      else if (i < S.readCount) { st = unknown ? '<span class="badge sm b-amber">✗ token invalide · quantité inconnue</span> <button class="btn sec xs">Relancer</button>' : `<span class="badge sm b-em">✓ lu ${hm(SNAPSHOT_READY_MIN, true)}</span>`; read = true; }
      else if (i === S.readCount) { st = '<span class="badge sm b-cyan">⟳ lecture</span>'; read = false; }
      else { st = '<span class="hint">en file</span>'; read = false; }
    }
    const qty = read ? (unknown ? '<span class="unk">inconnue</span>' : fmtN(Object.values(CHARS[c].q).reduce((a, b) => a + b, 0)) + ' u') : '<span class="hint">–</span>';
    return `<tr><td class="c-s200">${CHARS[c].name}</td><td>${p.name}</td><td>${CHARS[c].ship}</td><td>${st}</td><td class="r">${qty}</td></tr>`;
  }).join('');
}

/* ---------- Saison (V4) ---------- */
function seasonCharRows() {
  const rows = PAST_OPS.flatMap(o => o.chars.map(c => ({ op: o.id, pid: c[0], cid: c[1], name: c[2], ship: c[3], min: c[4], value: c[5] })));

    sh.people.forEach(p => { const [ws, we] = presenceWindow(p); p.cv.forEach(x => rows.push({ op: 'cur', pid: p.id, cid: x.cid, name: CHARS[x.cid].name, ship: CHARS[x.cid].ship, min: we - ws, value: x.value })); });
  }

}
function renderSeason() {

  const unknownOps = opIds.filter(id => !opKnown(id)).map(id => (PAST_OPS.find(o => o.id === id) || { label: OP.label }).label);
  const opMin = id => id === 'cur' ? OP_END_MIN : PAST_OPS.find(o => o.id === id).min;
  const known = rows.filter(r => opKnown(r.op));

  const opHoursKnown = opIds.filter(opKnown).reduce((x, id) => x + opMin(id) / 60, 0);
  const ships = [...new Set(known.map(r => r.ship))].map(ship => { const rs = known.filter(r => r.ship === ship); const h = rs.reduce((x, r) => x + r.min / 60, 0), v = rs.reduce((x, r) => x + r.value, 0); return { ship, n: new Set(rs.map(r => r.cid)).size, h, v, iskH: ship === 'Orca' ? null : v / h }; }).sort((a, b) => (b.iskH ?? -1) - (a.iskH ?? -1));
  const maxShip = Math.max(...ships.map(x => x.iskH || 0));

  const sites = (curKnown ? currentSitesRows() : []).concat(PAST_SITES);
  const systems = [...new Set(sites.map(x => x.sys))].sort().map(sys => { const ss = sites.filter(x => x.sys === sys).map(x => ({ ...x, iskH: x.extracted === null || !(x.min > 0) ? null : x.extracted / (x.min / 60) })); const kn = ss.filter(x => x.iskH !== null); const best = kn.length ? kn.reduce((a, b) => (b.iskH > a.iskH ? b : a)) : null; return { sys, n: ss.length, best, unknown: ss.filter(x => x.iskH === null) }; });
  const sysRows = systems.map(x => `<tr><td class="c-s200">${x.sys}</td><td style="white-space:normal">${x.best ? x.best.label : '<span class="unk">inconnu</span>'}${x.unknown.length ? `<div class="hint">inconnu : ${x.unknown.map(u => `${u.label} (${u.extracted === null ? 'sans prix' : 'un seul scan'})`).join(', ')}</div>` : ''}</td><td class="r">${x.best ? fmtIsk(x.best.iskH) + '/h' : '<span class="unk">inconnu</span>'}</td><td class="r">${x.best ? durTxt(x.best.min) : '–'}</td><td class="r">${x.n}</td></tr>`).join('');
  const players = [...new Set(rows.map(r => r.pid))].map(pid => { const rs = rows.filter(r => r.pid === pid); const perOp = [...new Set(rs.map(r => r.op))].map(op => Math.max(...rs.filter(r => r.op === op).map(r => r.min))); const h = perOp.reduce((x, m) => x + m / 60, 0); const kv = rs.filter(r => opKnown(r.op)); return { pid, name: personName(pid), ops: perOp.length, h, v: kv.reduce((x, r) => x + r.value, 0), unk: rs.some(r => !opKnown(r.op)) }; }).sort((a, b) => b.h - a.h);

    ${unknownOps.length ? `<div class="banner amber">${svg(ICON.warn)}<div><b>Valeur de la saison inconnue.</b> ${unknownOps.join(', ')} : valeur inconnue (Glare Crust compressé sans prix). Ses heures sont comptées, pas ses ISK ; le total connu ci-dessous l’exclut.</div></div>` : ''}

const SELL_PREMIUM = 1.07;
const YIELD = { base: 50, rig: { none: 0, t1: 1, t2: 3 }, sec: { high: 0, low: 0.06, null: 0.12 }, structure: { npc: 0, athanor: 0, tatara: 0.055 }, skills: { reprocessing: 5, efficiency: 5, oreProcessing: 5 } };
function yieldPct() {
  const c = S.yieldCfg, k = YIELD.skills;
  const skillMul = (1 + 0.03 * k.reprocessing) * (1 + 0.02 * k.efficiency) * (1 + 0.02 * k.oreProcessing) * (1 + c.implant / 100);
  if (c.place === 'npc') return YIELD.base * skillMul;
  return (YIELD.base + YIELD.rig[c.rig]) * (1 + YIELD.sec[c.sec]) * (1 + YIELD.structure[c.place]) * skillMul;
}

    const compMissing = S.state === 'missing_price' && o.id === 'monazite';

    const opts = [['Brut', raw], ['Compressé', comp], ['Retraité', ref]];

/* ---------- Compagnon ---------- */
function cmpTier(est) {
  if (!est) return 'unknown';
  if (est.emptied) return 'empty';
  if (est.siteTrend === null) return 'unknown';
  const rem = est.siteTrend * 60 - nowSec();
  if (rem <= 0) return 'reached';
  if (rem < TIER_RED_SEC) return 'red';
  if (rem < TIER_ORANGE_SEC) return 'orange';
  return 'normal';
}
function rescanDue(est) { return est && S.status === 'running' && nowSec() - est.scans[est.scans.length - 1].t * 60 >= S.cmp.rescanMin * 60; }
function ring(progress, size, inner) {
  const r = size / 2 - 7, c = 2 * Math.PI * r;
  const p = progress === null ? 0 : Math.max(0, Math.min(1, progress));
  return `<div class="ring-wrap" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="transform:rotate(-90deg)"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="#1e293b" stroke-width="7"/><circle class="ring-fg" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c * p} ${c}"/></svg><div class="ring-in">${inner}</div></div>`;
}
function etaMain(est, tier) {
  if (tier === 'empty') return 'Épuisé';
  if (tier === 'unknown') return 'inconnue';
  return hm(est.siteTrend);
}

/* ---------- Alertes visuelles ---------- */
function alertCandidates() {
  const out = [];
  if (S.status === 'running' && currentSite()) {
    const site = currentSite();
    const sid = S.sites.indexOf(site);
    const est = estimateFor(site);
    const rem = est.siteTrend === null ? null : est.siteTrend * 60 - nowSec();
    if (rem !== null && rem > 0 && rem <= ALERT_SITE_EMPTY_SEC) out.push({ key: sid + ':10min', level: 'warn', text: `Site vide dans ${Math.ceil(rem / 60)} min (ETA ${hm(est.siteTrend)})` });
    const initial = SITE_DEFS[site.def].types.filter(id => est.types.some(t => t.id === id) && priceOf(id) !== null);
    if (initial.length) {
      const bestId = initial.reduce((a, b) => (priceOf(b) / ORE[b].vol > priceOf(a) / ORE[a].vol ? b : a));
      const bt = est.types.find(t => t.id === bestId);
      if (bt && bt.depleted) out.push({ key: sid + ':best', level: 'warn', text: `${ORE[bestId].name}, le minerai le plus rentable, est épuisé` });
    }
    const dr = downtimeRisk(est);
    if (dr) out.push({ key: sid + ':dt', level: 'warn', text: `Downtime ${hm(dr.dt)} avant la fin du site : il restera ${dr.value === null ? 'une valeur inconnue' : '≈ ' + fmtIsk(dr.value)}` });
    est.mined.filter(t => t.irregular).forEach(t => out.push({ key: sid + ':irr:' + t.id, level: 'info', text: `Débit irrégulier sur ${ORE[t.id].name} : se fier à l’ETA récente` }));
  }
  if (S.status === 'closing' && nowSec() >= SNAPSHOT_READY_MIN * 60) out.push({ key: 'ledger', level: 'info', text: 'Ledger de fin prêt : lecture des instantanés' });
  if ((!S.created || S.status === 'planned') && S.chunkIn <= CHUNK_ALERT_MIN) out.push({ key: 'chunk1h', level: 'warn', text: `Chunk Lune VII-3 prêt dans ${Math.max(1, Math.round(S.chunkIn - (Date.now() - tickStart) / 60000))} min` });
  return out;
}
function idleClockLabel() {
  if (S.chunkIn >= 24 * 60) return 'mar. 16:40';
  const m = 20 * 60 - Math.round(S.chunkIn);
  return 'jeu. ' + String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
}
function checkAlerts() {
  let fresh = false;
  alertCandidates().forEach(a => {
    if (S.fired[a.key]) return;
    S.fired[a.key] = true;
    fresh = true;
    S.alerts.unshift({ ...a, at: S.status === 'running' || S.status === 'closing' ? hm(nowSec() / 60) : idleClockLabel(), firedAt: Date.now() });
    S.alerts = S.alerts.slice(0, 5);
    toast(a.text, 'warning');
    if (S.cmp.notif && 'Notification' in window && Notification.permission === 'granted') new Notification('EVE Tools · minage', { body: a.text, silent: true });
  });
  return fresh;
}

    d.querySelectorAll('[data-countdown]').forEach(el => { const target = parseFloat(el.dataset.countdown); el.textContent = isNaN(target) ? '–' : (target - ns > 0 ? (el.dataset.prefix || '') + clockTxt(target - ns) : 'ETA atteinte'); });
    d.querySelectorAll('[data-countdown-abs]').forEach(el => { el.textContent = clockTxt(parseFloat(el.dataset.countdownAbs) - ns); });
    d.querySelectorAll('[data-since]').forEach(el => { el.textContent = clockTxt(ns - parseFloat(el.dataset.since)); });

}
function toast(msg, type = 'success') {

  box.appendChild(t);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => t.remove(), 6000);
}

function addScan(source) {
  const site = currentSite();
  if (S.status !== 'running' || !site || site.closedAt || S.left.alpha !== undefined) return;
  const before = estimateFor(site);
  S.mine[site.def + '@' + site.start + ':' + site.n] = true;
  site.n += 1;
  const scans = scanList(site);
  const last = scans[scans.length - 1];
  S.now = last.t;
  tickStart = Date.now();
  const after = estimateFor(site);
  const b = before.siteTrend === null ? 'inconnue' : hm(before.siteTrend);
  const a = after.emptied ? 'épuisé' : after.siteTrend === null ? 'inconnue' : hm(after.siteTrend);
  const newly = after.types.filter(t => t.depleted && !(before.types.find(x => x.id === t.id) || {}).depleted).map(t => ORE[t.id].name);
  const msg = `Scan ${site.n} ajouté · ${Object.keys(last.q).length} types · ETA tendance ${b} → ${a}${newly.length ? ' · épuisé : ' + newly.join(', ') : ''}`;
  S.flash = { text: msg, until: Date.now() + FLASH_MS };
  render();
  toast(msg);
  if (source === 'paste') toast('Format du collage pas encore fixé : scan fictif ajouté, texte non enregistré', 'warning');
  if (source === 'clipboard') toast('Scan lu dans le presse-papiers au retour sur le compagnon', 'success');
}
function newSite() {
  const site = currentSite();
  if (!site || S.status !== 'running') return;
  site.closedAt = S.now;
  S.sites.push({ def: 'grav', start: S.now, n: 1, closedAt: null });
  const ns = currentSite();
  S.now = scanList(ns)[0].t;
  tickStart = Date.now();
  S.flash = { text: `${siteLabel(site)} clôturé à ${hm(site.closedAt)} · ${siteLabel(ns)} ouvert, premier scan reçu : ETA après le 2e scan`, until: Date.now() + FLASH_MS };
  render();
  toast(`Nouveau site : ${siteLabel(ns)}`);
}

const SCAN_LIKE = /\b(monazite|cinnabar|sylvite|bitumens|chromite|bistot|arkonor|spodumain|veldspar|scordite|pyroxeres|plagioclase|omber|kernite|jaspet|hemorphite|hedbergite|gneiss|ochre|crokite|mercoxit|zeolites|coesite|cobaltite|euxenite|titanite|scheelite|otavite|sperrylite|vanadinite|carnotite|zircon|pollucite|xenotime|loparite|ytterbite)\b.*\d/i;
const looksLikeScan = text => text.split(/\r?\n/).some(l => SCAN_LIKE.test(l));
function textFingerprint(text) { let h = 5381; for (let i = 0; i < text.length; i++) h = ((h << 5) + h + text.charCodeAt(i)) | 0; return h; }
function onCompanionFocus(win) {
  if (!S.cmp.clip || S.status !== 'running' || !win.navigator.clipboard) return;
  win.navigator.clipboard.readText().then(text => {
    const fp = textFingerprint(text);
    if (fp === S.lastClipFp) return;
    S.lastClipFp = fp;
    if (looksLikeScan(text)) addScan('clipboard');
    else { S.cmp.clipStatus = 'presse-papiers ignoré : ne ressemble pas à un scan'; render(); }
  }, err => { S.cmp.clipStatus = 'lecture du presse-papiers refusée (' + err.name + ')'; render(); });
}

function applyHash() {
  const params = new URLSearchParams(location.hash.replace(/^#/, ''));
  const keepSpec = S ? S.specOpen : false;
  const keepCmp = S ? { opacity: S.cmp.opacity, scale: S.cmp.scale, rescanMin: S.cmp.rescanMin, notif: S.cmp.notif, clip: S.cmp.clip } : null;
  S = baseState();
  S.specOpen = keepSpec || params.get('spec') === '1';
  S.longNames = params.get('long') === '1';
  clockBase = CLOCK_BASE_DEFAULT;
  if (keepCmp) Object.assign(S.cmp, keepCmp);
  applyNames(params.get('long') === '1');
  const p = parseInt(params.get('p') || '0', 10);
  const m = params.get('m');
  if (p) applyStep(p);
  else if (m) { applyStep(MODE_TO_STEP[m]); S.step = 0; S.modal = null; S.cmp.highlightDetach = false; }
  const v = params.get('v');
  if (v) {
    if (!p && !m && ['operation', 'companion', 'compact'].includes(v)) { applyStep(8); S.step = 0; }
    S.view = v === 'compact' ? 'companion' : v;
    if (S.view === 'companion') S.modal = null;
  }
  if (params.get('size')) S.cmp.size = params.get('size');
  if (params.get('settings')) S.cmp.settings = true;
  if (params.get('n') && currentSite()) currentSite().n = parseInt(params.get('n'), 10);
  if (params.get('now')) S.now = parseFloat(params.get('now'));
  if (params.get('chunkin')) S.chunkIn = parseFloat(params.get('chunkin'));
  if (params.get('s')) S.state = params.get('s');
  clockBase = S.state === 'downtime' ? DOWNTIME_DEMO_BASE : CLOCK_BASE_DEFAULT;
  if (params.get('chunk')) S.selChunk = params.get('chunk');
  if (params.get('miners')) S.minersType = params.get('miners');
  if (params.get('recur')) S.recur = params.get('recur');
  if (params.get('boost')) S.boostSel = params.get('boost');
  if (S.boostSel) setBoostShip(S.boostSel); else setBoostShip(S.boost.ship);
  if (params.get('access')) S.taxAccess = params.get('access');
  if (params.get('split')) S.split = params.get('split');
  if (S.view === 'free' || params.get('free') === '1') { S.free = { def: 'belt', start: FREE_START, n: parseInt(params.get('fn') || S.freeN || '3', 10), closedAt: null }; S.now = freeLast(S.free).t + FREE_NOW_AFTER_SCAN; }
  if (isSolo() && S.status === 'shares') S.status = 'settled';
  if (params.get('taxbasis')) S.taxBasis = params.get('taxbasis');
  if (params.get('focus')) S.focus = params.get('focus');
  if (S.state === 'ledger_wait' && S.created && ['shares', 'settled', 'running'].includes(S.status)) { const st = S.state, spec = S.specOpen, view = S.view; S = baseState(); S.specOpen = spec; applyStep(16); S.step = 0; S.state = st; S.view = view; }
  if (S.state === 'ledger_wait' && S.status === 'closing') S.closePhase = 'waiting';
  if (params.get('phase')) { S.closePhase = params.get('phase'); S.readCount = S.closePhase === 'reading' ? 4 : S.closePhase === 'done' ? 10 : 0; }
  if (params.get('modal')) S.modal = params.get('modal') === 'none' ? null : params.get('modal');
  if (params.get('tax')) S.taxView = params.get('tax');
  if (params.get('expand')) params.get('expand').split(',').forEach(id => { S.expanded[id] = true; });
  tickStart = Date.now();
  S.fired = {};
  if (p === 8) setTimeout(() => toast(`Scan 4 ajouté · 4 types · ETA tendance ${hm(estimateSite(scanList({ ...S.sites[0], n: 3 }), SITE_DEFS.chunk.types).siteTrend)} → ${hm(estimateFor(S.sites[0]).siteTrend)}`), 50);
  render();
}

      <div class="g2"><div class="field"><label class="fl">Libellé</label><input class="input" value="${OP.label}"></div><div class="field"><label class="fl">Système</label><input class="input" value="${ch.sys}"></div></div>
      <div class="g2"><div class="field"><label class="fl">Début (EVE time)</label><input class="input mono" value="05/11/2026 20:00"></div>
        <div class="field"><label class="fl">Visibilité</label><div class="radio"><label>Privée (lien)</label><label class="on">Ma corporation</label></div></div></div>
      <div class="field"><label class="fl">Récurrence</label><div class="radio">${[['none', 'Une seule fois'], ['weekly', 'Chaque jeudi 20:00'], ['chunk', 'À chaque chunk de Refinery B-1']].map(([k, l]) => `<label class="${S.recur === k ? 'on' : ''}" data-act="recur" data-arg="${k}">${l}</label>`).join('')}</div>
        <p class="hint" style="margin:6px 0 0">${S.recur === 'weekly' ? 'Une opération identique (mêmes règles, même visibilité) est créée 7 jours avant chaque jeudi. Si aucun chunk n’arrive ce jour-là, elle est créée sans chunk lié.' : S.recur === 'chunk' ? 'Une opération est créée dès qu’une extraction est lancée sur Refinery B-1, à l’heure d’arrivée du chunk.' : 'Opération unique.'}</p></div>
      <div class="field"><label class="fl">Base de valorisation</label><select class="input"><option selected>Compressé · Jita buy (défaut)</option><option>Compressé · Jita sell</option><option>Retraité au rendement de l’opération</option><option>Brut · Jita buy</option></select></div>
      <div class="field"><label class="fl">Répartition</label><div class="radio"><label class="${isSolo() ? '' : 'on'}" data-act="split" data-arg="prorata">Prorata de la valeur</label><label class="dis">Temps pondéré</label><label class="${isSolo() ? 'on' : ''}" data-act="split" data-arg="solo">Chacun pour soi</label></div>
        <p class="hint" style="margin:6px 0 0">${isSolo() ? 'Chacun garde son minerai : aucune règle de répartition, aucun hauling commun, pas de paiements. Sites, scans, ETA, compagnon et alertes restent partagés.' : 'Les parts sont calculées au prorata de la valeur minée par chacun (ledger), après la part du booster et de la corporation.'}</p></div>
      <div class="g2"><div class="field"><label class="fl">Part du booster</label><div class="row" style="gap:6px"><input class="input sm mono" value="${isSolo() ? 0 : OP.boosterPct}" ${isSolo() ? 'disabled' : ''}><span class="hint">%${isSolo() ? ' · sans part en chacun pour soi' : ''}</span></div></div><div class="field"><label class="fl">Part corporation</label><div class="row" style="gap:6px"><input class="input sm mono" value="${isSolo() ? 0 : OP.corpPct}" ${isSolo() ? 'disabled' : ''}><span class="hint">%</span></div></div></div>
      <div class="field"><label class="fl">Vaisseau de boost et compresseurs</label><div class="radio">${Object.entries(BOOST_SHIPS).map(([k, b]) => `<label class="${S.boost.ship === k ? 'on' : ''}" data-act="boost-ship" data-arg="${k}">${b.name}</label>`).join('')}</div>
        <div class="row wrapf" style="gap:6px 14px;margin-top:8px">${boost().kinds.map(k => `<label class="row" style="gap:6px"><input type="checkbox" data-act="boost-comp" data-arg="${k}" ${S.boost.comps.includes(k) ? 'checked' : ''} style="accent-color:#06b6d4"><span class="c-s300">${compName(S.boost.ship, k)}</span></label>`).join('')}</div>
        <p class="hint" style="margin:6px 0 0">Compresseurs montables sur le ${boost().name} (SDE) · Industrial Core actif requis · portée ${boost().range} km · fleet hangar ${fmtN(boost().fleet)} m³, soute de minerai ${fmtN(boost().hold)} m³ (sans bonus de compétences).${boost().kinds.includes('moon') ? '' : ' <span class="c-amber">Pas de compresseur de minerai lunaire, de glace ni de mercoxit sur cette coque.</span>'}</p></div>
      <div class="g2"><div class="field"><label class="fl">Booster</label><select class="input"><option>Mineur Charlie (${boost().name})</option><option>Aucun</option></select></div>
        <div class="field"><label class="fl">Destinataire du fleet storage</label>${isSolo() ? '<select class="input" disabled><option>Aucun · chacun pour soi</option></select>' : `<select class="input"><option>Mineur Charlie (${boost().name})</option><option>Aucun</option><option>Container corpo « OPS-HAUL »</option></select>`}</div></div>
      ${isSolo() ? `<div class="card" style="background:rgba(30,41,59,.5)"><span class="lab">Règle</span><p class="c-s300" style="margin:6px 0 0">Chacun pour soi : chaque participant garde ce qu’il mine. evetools lit les instantanés de début et de fin du ledger pour afficher la valeur minée et l’ISK/h de chacun ; aucune part, aucun paiement. Le booster boost sans part.</p></div>` : `<div class="card" style="background:rgba(30,41,59,.5)"><span class="lab">Règle de répartition</span><p class="c-s300" style="margin:6px 0 0">G = Σ quantités minées × prix ${OP.basis}, figé à la lecture du ledger de fin. Booster : G × ${OP.boosterPct} %. Corporation : G × ${OP.corpPct} %. Chaque participant : G × ${100 - OP.boosterPct - OP.corpPct} % × sa part de la valeur.</p><p class="hint" style="margin:6px 0 0">Un minerai sans prix rend la valeur et les parts inconnues, avec la liste des types concernés.</p></div>`}`,
      `<button class="btn sec" data-act="close">Annuler</button><button class="btn pri" data-act="create">Créer l’opération</button>`);
  } else if (S.modal === 'created') {
    el.innerHTML = modalShell('Opération créée', `${OP.label} · ${OP.start} EVE`, `
      <div class="banner em">${svg(ICON.ok)}<div>L’opération est <b>planifiée</b>. L’instantané de début sera pris à 20:00 pour chaque personnage inscrit.</div></div>
      <div class="card p5" style="background:rgba(30,41,59,.6);border-color:rgba(51,65,85,.5)"><h4 style="margin:0 0 12px;font-size:14px;font-weight:600;color:var(--s200)">Lien d’invitation</h4>
        <div class="row" style="gap:8px"><input class="input mono" readonly value="${OP.link}" style="background:var(--s900);padding:10px 16px"><button class="btn ${S.copied ? 'em' : 'sec'}" data-act="copy">${svg(ICON.clip)}${S.copied ? 'Copié !' : 'Copier'}</button></div>
        <p class="hint" style="margin:12px 0 0">Les membres de Corp A rejoignent directement. Les autres attendent votre validation.</p></div>`,
      `<button class="btn pri" data-act="close">Ouvrir l’opération</button>`);
  } else if (S.modal === 'join') {
    const chars = [
      { id: 'delta', name: 'Mineur Delta', tag: 'main', ship: 'Hulk', st: 'ok' },
      { id: 'delta2', name: 'Mineur Delta II', ship: 'Hulk', st: 'ok' },
      { id: 'delta3', name: 'Mineur Delta III', ship: 'Porpoise', st: 'reconnect' },
      { id: 'delta4', name: 'Mineur Delta IV', ship: 'Procurer', st: 'busy' }
    ];
    const n = chars.filter(c => c.st === 'ok' && S.joinSel[c.id]).length;
    el.innerHTML = modalShell(`Rejoindre « ${OP.label} »`, `Invitation de Mineur Alpha · ${OP.system} · ${OP.start} EVE · vu par Mineur Delta`, `
      <div class="g3 start" style="gap:20px"><div class="span2 col" style="gap:8px"><div class="lab">Quels personnages minent ?</div>
        ${chars.map(c => `<label class="charsel ${c.st !== 'ok' ? 'dis' : ''}"><input type="checkbox" ${c.st === 'ok' && S.joinSel[c.id] ? 'checked' : ''} ${c.st !== 'ok' ? 'disabled' : ''} data-act="joinsel" data-arg="${c.id}"><div class="mini">${initials(c.name)}</div>
          <div style="flex:1"><div class="c-s200" style="font-weight:600">${c.name} ${c.tag ? '<span class="hint">main</span>' : ''}</div><div class="hint">${c.ship}</div></div>
          ${c.st === 'ok' ? '<span class="badge sm b-em">prêt</span>' : c.st === 'reconnect' ? '<span class="badge sm b-amber">à reconnecter</span><button class="btn sec xs">Reconnecter</button>' : '<span class="badge sm b-slate">déjà dans « Ice belt — dimanche »</span>'}</label>`).join('')}
        <p class="hint" style="margin:4px 0 0">Un personnage ne peut être que dans une seule opération ouverte. Sans token valide, sa quantité serait inconnue : reconnectez-le avant de le cocher.</p></div>
      <div class="card col" style="gap:6px"><span class="lab">Règles de l’opération</span><div class="hint">Base : <span class="c-s300">${OP.basis}</span></div><div class="hint">Répartition : <span class="c-s300">${isSolo() ? 'chacun pour soi' : 'prorata de la valeur'}</span></div><div class="hint">Booster : <span class="c-s300">${isSolo() ? 'Mineur Charlie, sans part' : OP.boosterPct + ' % · Mineur Charlie'}</span></div><div class="hint">Corporation : <span class="c-s300">${OP.corpPct} %</span></div><div class="hint">Fleet storage : <span class="c-s300">Mineur Charlie</span></div><div class="sep"></div><div class="hint">Visible par la corporation : demande acceptée automatiquement.</div></div></div>`,
      `<button class="btn sec" data-act="close">Annuler</button><button class="btn pri" data-act="join" ${n ? '' : 'disabled'}>Rejoindre avec ${n} personnage${n > 1 ? 's' : ''}</button>`, true);
  } else if (S.modal === 'end') {
    const est = estimateFor(currentSite());
    el.innerHTML = modalShell('Terminer l’opération ?', `${OP.label} · fin à ${hm(S.now + 1)} EVE`, `
      <p class="c-s300" style="margin:0">Site en cours : <b class="c-white">${siteLabel(currentSite())}</b>, ETA tendance <b class="mono c-white">${etaOr(est.siteTrend)}</b>. À la fin, le site est clôturé et chaque personnage a son instantané de fin lu après l’expiration du cache ESI (10 min), puis les parts sont calculées sur les ${S.sites.length} sites.</p>
      <p class="hint" style="margin:0">Les participants ne peuvent plus ajouter de scan. Ce qui est miné ensuite ne compte pas.</p>`,
      `<button class="btn sec" data-act="close">Annuler</button><button class="btn pri" data-act="end">Terminer à ${hm(S.now + 1)}</button>`);
  }
}

/* ---------- Événements (fenêtre principale et compagnon) ---------- */
function onClick(e) {
  const h = e.target.closest('[data-hash]');
  if (h && !h.disabled) { go(h.dataset.hash); return; }
  const a = e.target.closest('[data-act]');
  if (!a || a.disabled) return;
  const act = a.dataset.act, arg = a.dataset.arg;
  if (['state', 'joinsel', 'pay', 'rate', 'cmp-opacity', 'cmp-rescan', 'cmp-notif', 'cmp-clip', 'boost-comp'].includes(act) || (act === 'split' && a.tagName === 'SELECT')) return;
  switch (act) {
    case 'tour-start': go('p=1'); break;
    case 'tour-next': go('p=' + Math.min(LAST_STEP, (S.step || 0) + 1)); break;
    case 'tour-prev': go('p=' + Math.max(1, S.step - 1)); break;
    case 'spec-toggle': S.specOpen = !S.specOpen; render(); break;
    case 'chunk': S.selChunk = arg; render(); break;
    case 'recur': S.recur = arg; render(); break;
    case 'split': S.split = arg; render(); break;
    case 'boost-ship': setBoostShip(arg); render(); break;
    case 'taxaccess': S.taxAccess = arg; render(); break;
    case 'moon-paste': S.moonPasted[arg] = true; render(); toast('Scan de la lune enregistré pour ' + CHUNKS.find(c => c.id === arg).moon + ' · texte collé non conservé'); break;
    case 'miners-type': S.minersType = arg; S.planFocus = null; render(); break;
    case 'long-names': { const params = new URLSearchParams(location.hash.replace(/^#/, '')); if (S.longNames) params.delete('long'); else params.set('long', '1'); go(params.toString()); break; }
    case 'hangar-empty': S.hangarEmptied = nowSec() / 60; render(); toast('Fleet hangar déclaré vidé à ' + hm(nowSec() / 60)); break;
    case 'copy-ref': S.refCopied = true; render(); toast('Référence ' + OP_REF + ' copiée : à mettre en motif du don'); break;
    case 'copy-recap': S.recapCopied = true; render(); toast('Récapitulatif copié pour Discord'); break;
    case 'copy-contract': S.contractCopied = true; render(); toast('Résumé du contrat copié'); break;
    case 'open-create': S.modal = 'create'; render(); break;
    case 'create': S.step ? go('p=5') : (S.created = true, S.status = 'planned', S.view = 'operation', S.modal = 'created', render()); break;
    case 'close': S.modal = null; render(); break;
    case 'copy': S.copied = true; render(); toast('Lien d’invitation copié'); break;
    case 'open-join': S.modal = 'join'; render(); break;
    case 'join': S.deltaJoined = true; S.modal = null; render(); toast('Mineur Delta a rejoint avec 2 personnages · instantané à 20:00'); break;
    case 'start': S.step ? go('p=7') : (applyStep(7), S.step = 0, render()); break;
    case 'paste': if (S.free) addFreeScan(); else addScan('button'); break;
    case 'free-start': startFreeSite(); break;
    case 'free-new': newFreeSite(); break;
    case 'free-attach': toast('Site libre rattaché à « ' + OP.label + ' » : ses scans rejoignent les sites de l’opération'); break;
    case 'accept': S.foxtrot = 'accepted'; render(); toast('Mineur Foxtrot accepté · instantané de début pris maintenant'); break;
    case 'open-end': S.modal = 'end'; render(); break;
    case 'end': S.step ? go('p=16') : (applyStep(16), S.step = 0, S.view = 'operation', S.modal = null, tickStart = Date.now(), render()); break;
    case 'expire': startReading(); break;
    case 'to-shares': if (isSolo()) { S.status = 'settled'; render(); break; } S.status = 'shares'; applyPayDemo('shares'); S.step = S.step ? 17 : 0; render(); break;
    case 'expand': S.expanded[arg] = !S.expanded[arg]; render(); break;
    case 'settle': S.status = 'settled'; S.settledAt = SETTLED_AT; render(); toast('Opération réglée : chiffres figés'); break;
    case 'taxview': S.taxView = arg; render(); break;
    case 'taxpay': { const mm = TAX_MINERS[arg]; const t = taxOf(mm.q).value; S.taxPaidManual[arg] = t - mm.paid; render(); break; }
    case 'taxbasis': S.taxBasis = arg; render(); break;
    case 'period': S.period = arg; render(); break;
    case 'market': S.market = arg; render(); break;
    case 'ycfg': { const [k, v] = arg.split(':'); S.yieldCfg[k] = k === 'implant' ? Number(v) : v; render(); break; }
    case 'detach': detach(); break;
    case 'cmp-dock': S.cmp.dock = !S.cmp.dock; S.cmp.highlightDetach = false; render(); break;
    case 'cmp-size': S.cmp.size = arg; resizeCompanion(); render(); break;
    case 'cmp-settings': S.cmp.settings = !S.cmp.settings; render(); break;
    case 'cmp-scale': S.cmp.scale = Number(arg); render(); break;
    case 'notif-perm': Notification.requestPermission().then(r => { S.cmp.notifPerm = r; S.cmp.notif = r === 'granted'; render(); }); break;
    case 'leave': S.left.alpha = S.now; render(); toast(`Départ enregistré à ${hm(S.now)} : instantané de fin de vos personnages pris maintenant`); break;
    case 'unleave': delete S.left.alpha; render(); break;
    case 'new-site': newSite(); break;
    case 'open-desk': focusMain(); go('v=operation' + (S.step ? '&p=' + S.step : '&m=' + ({ running: S.sites.length > 1 ? 'sites' : 'running', closing: 'closing', shares: 'shares', settled: 'settled', planned: 'planned' }[S.status] || 'planned'))); break;
    case 'cmp-create': focusMain(); S.view = 'plan'; S.selChunk = 'VII-3'; S.modal = 'create'; render(); break;
  }
}
function onChange(e) {
  const a = e.target.closest('[data-act]');
  if (!a) return;
  const act = a.dataset.act;
  if (act === 'state') { const params = new URLSearchParams(location.hash.replace(/^#/, '')); params.set('s', a.value); go(params.toString()); }
  if (act === 'boost-comp') { const k = a.dataset.arg; S.boost.comps = a.checked ? [...S.boost.comps, k] : S.boost.comps.filter(x => x !== k); render(); }
  if (act === 'split' && a.tagName === 'SELECT') { const params = new URLSearchParams(location.hash.replace(/^#/, '')); if (a.value === 'solo') params.set('split', 'solo'); else params.delete('split'); go(params.toString()); return; }
  if (act === 'joinsel') { S.joinSel[a.dataset.arg] = a.checked; render(); }
  if (act === 'pay') { const k = a.dataset.arg, cur = S.payInfo[k] || { kind: 'pending' }; S.paid[k] = a.checked; S.payInfo[k] = a.checked ? (cur.kind === 'outside' ? { kind: 'outside_checked', txt: 'coché à la main par vous · payeur hors evetools' } : { kind: 'manual', txt: 'déclaré à la main par vous · en attente du wallet' }) : (cur.kind === 'outside_checked' ? { kind: 'outside', txt: '' } : { kind: 'pending', txt: '' }); render(); }
  if (act === 'rate') { S.rates[a.dataset.arg] = Math.max(0, Math.min(100, Number(a.value) || 0)); render(); }
  if (act === 'cmp-rescan') { S.cmp.rescanMin = Math.max(3, Math.min(30, Number(a.value) || 10)); render(); }
  if (act === 'cmp-notif') { S.cmp.notif = a.checked; render(); }
  if (act === 'cmp-clip') { S.cmp.clip = a.checked; S.cmp.clipStatus = a.checked ? 'lu au prochain retour sur le compagnon (permission demandée par le navigateur)' : null; render(); }
}
function onInput(e) {
  const a = e.target.closest('[data-act="cmp-opacity"]');
  if (!a) return;
  S.cmp.opacity = Number(a.value);
  docs().forEach(d => d.querySelectorAll('.cmp').forEach(el => el.style.setProperty('--cbg', `rgba(15,23,42,${S.cmp.opacity / 100})`)));
}
function onPaste(e, fromCompanion) {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea') return;
  const visible = fromCompanion || ['operation', 'companion'].includes(S.view);
  if (S.free && (fromCompanion || ['free', 'companion'].includes(S.view))) { e.preventDefault(); addFreeScan(); return; }
  if ((fromCompanion || S.view === 'companion') && S.status !== 'running') { e.preventDefault(); startFreeSite(); return; }
  if (!visible || S.status !== 'running') return;
  e.preventDefault();
  addScan('paste');
}
function onKey(e) {
  if (e.key === 'Escape' && S.modal) { S.modal = null; render(); return; }
  const tag = (e.target.tagName || '').toLowerCase();
  if (['input', 'textarea', 'select'].includes(tag) || e.ctrlKey || e.metaKey || e.altKey || S.modal) return;
  const k = e.key.toLowerCase();
  const companionShown = S.view === 'companion' || pip || S.cmp.dock;
  if (k === 'd' && (companionShown || S.status === 'running')) { detach(); return; }
  if (!companionShown) return;
  if (k === 'v') { if (S.free) addFreeScan(); else if (S.status !== 'running') startFreeSite(); else addScan('button'); }
  else if (k === 'b' || k === 'c' || k === 'l') { S.cmp.size = { b: 'bar', c: 'compact', l: 'detail' }[k]; resizeCompanion(); render(); }
}
document.addEventListener('click', onClick);
document.addEventListener('change', onChange);
document.addEventListener('input', onInput);
document.addEventListener('paste', e => onPaste(e, false));
document.addEventListener('keydown', onKey);
window.addEventListener('focus', () => { if (S.view === 'companion') onCompanionFocus(window); });
window.addEventListener('hashchange', applyHash);
setInterval(updateClocks, 1000);
applyHash();
</script>
</body>
