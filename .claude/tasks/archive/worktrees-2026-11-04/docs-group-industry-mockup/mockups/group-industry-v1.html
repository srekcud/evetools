:root {
  --s950:#020617; --s900:#0f172a; --s800:#1e293b; --s700:#334155; --s600:#475569; --s500:#64748b; --s400:#94a3b8; --s300:#cbd5e1; --s200:#e2e8f0; --s100:#f1f5f9;
  --c400:#22d3ee; --c500:#06b6d4; --c600:#0891b2; --e400:#34d399; --e500:#10b981; --e600:#059669;
  --a300:#fcd34d; --a400:#fbbf24; --a500:#f59e0b; --a600:#d97706; --r400:#f87171; --r500:#ef4444; --v400:#a78bfa; --v500:#8b5cf6; --sky400:#38bdf8;
  --warning:#f59e0b; --chart-grid:#334155; --chart-text:#e2e8f0;
  --mono:'Share Tech Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--s950); color: var(--s100); font-family: ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji"; font-size: 14px; line-height: 1.43; }
button { font: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; }
input, select { font: inherit; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.bg-grid { position: fixed; inset: 0; pointer-events: none; background-image: linear-gradient(rgba(6,182,212,.03) 1px, transparent 1px), linear-gradient(90deg, rgba(6,182,212,.03) 1px, transparent 1px); background-size: 50px 50px; }
.bg-glow { position: fixed; top: -50%; left: -50%; width: 100%; height: 100%; pointer-events: none; background: radial-gradient(closest-side, rgba(22,78,99,.2), transparent); }

/* Barre de maquette */
.mockbar { position: relative; z-index: 60; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px 14px; background: repeating-linear-gradient(135deg, #160f24 0 10px, #120c1e 10px 20px); border-bottom: 2px dashed rgba(167,139,250,.55); font-size: 12px; color: #c4b5fd; }
.mockbar .lbl { font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: 11px; color: var(--v400); }
.mockbar .grp { display: flex; align-items: center; gap: 4px; padding-left: 10px; border-left: 1px dashed rgba(167,139,250,.35); }
.mockbar button, .mockbar select { background: rgba(167,139,250,.08); color: #ddd6fe; border: 1px dashed rgba(167,139,250,.45); border-radius: 6px; padding: 3px 8px; font-size: 12px; }
.mockbar button.on { background: rgba(167,139,250,.28); border-style: solid; color: #fff; }
.mockbar .step { font-family: var(--mono); color: #fff; min-width: 210px; }

/* Shell (MainLayout.vue) */
.app { position: relative; display: flex; min-height: calc(100vh - 44px); }
aside.side { width: 256px; flex-shrink: 0; background: var(--s900); border-right: 1px solid rgba(6,182,212,.2); display: flex; flex-direction: column; position: sticky; top: 0; height: calc(100vh - var(--mbh, 0px)); }
.logo { padding: 24px; border-bottom: 1px solid rgba(6,182,212,.2); display: flex; align-items: center; gap: 12px; }
.logo .ic { width: 40px; height: 40px; border-radius: 8px; background: linear-gradient(to bottom right, #06b6d4, #2563eb); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 15px -3px rgba(6,182,212,.3); }
.logo h1 { margin: 0; font-size: 18px; line-height: 28px; font-weight: 700; letter-spacing: -.025em; background: linear-gradient(to right, #22d3ee, #60a5fa); -webkit-background-clip: text; background-clip: text; color: transparent; }
.logo p { margin: 0; font-size: 12px; color: var(--s500); letter-spacing: .1em; text-transform: uppercase; }
nav.menu { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
.ni { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 8px; border: 1px solid transparent; color: var(--s400); background: none; text-align: left; font-weight: 500; font-size: 14px; }
.ni:hover { background: rgba(30,41,59,.5); color: var(--s200); border-color: rgba(6,182,212,.3); }
.ni svg { width: 20px; height: 20px; flex-shrink: 0; }
.ni.on { background: linear-gradient(to right, rgba(6,182,212,.2), rgba(59,130,246,.1)); color: var(--c400); border-color: rgba(6,182,212,.3); box-shadow: 0 10px 15px -3px rgba(6,182,212,.1); }
.ni .dot { margin-left: auto; width: 6px; height: 6px; border-radius: 50%; background: var(--c400); }
.ni .chev { margin-left: auto; width: 16px; height: 16px; }
.sub { padding-left: 16px; display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
.sub .ni { padding: 10px 16px; font-size: 14px; }
.sub .ni svg { width: 16px; height: 16px; }
.charcard { margin: 16px; margin-top: 0; padding-top: 16px; border-top: 1px solid rgba(6,182,212,.2); }
.charcard .in { background: var(--s900); border: 1px solid var(--s800); border-radius: 12px; padding: 16px; display: flex; align-items: center; gap: 12px; }
.avatar { width: 48px; height: 48px; border-radius: 8px; box-shadow: 0 0 0 2px rgba(6,182,212,.5); background: linear-gradient(135deg, #334155, #1e293b); display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--s300); }
main.content { flex: 1; min-width: 0; }
header.top { position: sticky; top: 0; z-index: 10; background: var(--s900); border-bottom: 1px solid rgba(6,182,212,.1); padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
header.top h2 { margin: 0; font-size: 24px; line-height: 32px; font-weight: 700; color: var(--s100); }
header.top p { margin: 4px 0 0; font-size: 14px; color: var(--s500); }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 8px; border: 1px solid; font-size: 12px; }
.pill.esi { background: rgba(16,185,129,.1); border-color: rgba(16,185,129,.3); color: var(--e400); }
.pill.esi i { width: 8px; height: 8px; border-radius: 50%; background: var(--e500); }
.pill.all { padding: 8px 16px; background: rgba(245,158,11,.1); border-color: rgba(245,158,11,.3); color: var(--a400); font-size: 14px; font-weight: 500; }
.pill.corp { padding: 8px 16px; background: rgba(6,182,212,.1); border-color: rgba(6,182,212,.3); color: var(--c400); font-size: 14px; font-weight: 500; }
.page { padding: 32px; }
.wrap { max-width: 80rem; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }

/* Briques (Ledger, MiningTab, GroupIndustry) */
.card { background: var(--s900); border: 1px solid var(--s800); border-radius: 12px; padding: 16px; }
.card.p5 { padding: 20px; }
.card.p6 { padding: 24px; }
.card.soft { background: rgba(15,23,42,.8); }
.card.flush { padding: 0; overflow: hidden; }
.card-h { padding: 16px 24px; border-bottom: 1px solid var(--s800); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.card-h h3, h3.t { margin: 0; font-size: 18px; line-height: 28px; font-weight: 600; color: #fff; }
.lab { font-size: 12px; color: var(--s400); text-transform: uppercase; letter-spacing: .05em; }
.lab.dim { color: var(--s500); }
.kpi { margin-top: 4px; font-size: 20px; line-height: 28px; font-weight: 700; }
.kpi3 { font-size: 30px; line-height: 36px; font-weight: 700; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.hint { font-size: 12px; color: var(--s500); }
.hint2 { font-size: 12px; color: #475569; }
.muted { color: var(--s400); }
.c-cyan { color: var(--c400); } .c-em { color: var(--e400); } .c-amber { color: var(--a400); } .c-red { color: var(--r400); } .c-violet { color: var(--v400); } .c-white { color: #fff; } .c-s300 { color: var(--s300); } .c-s200 { color: var(--s200); } .c-s500 { color: var(--s500); }
.unk { color: var(--warning); font-style: italic; }
.row { display: flex; align-items: center; gap: 12px; }
.row.sb { justify-content: space-between; }
.row.wrapf { flex-wrap: wrap; }
.col { display: flex; flex-direction: column; gap: 12px; }
.g2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }
.g3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; }
.g4 { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 16px; }
.span2 { grid-column: span 2 / span 2; }
.start { align-items: start; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px; border: 0; font-size: 14px; font-weight: 500; white-space: nowrap; transition: transform .15s, background .15s; }
.btn:hover:not(:disabled) { transform: translateY(-1px); }
.btn:disabled { opacity: .5; }
.btn svg { width: 16px; height: 16px; }
.btn.pri { background: var(--c600); color: #fff; } .btn.pri:hover:not(:disabled) { background: var(--c500); }
.btn.sec { background: var(--s700); color: var(--s200); } .btn.sec:hover:not(:disabled) { background: var(--s600); }
.btn.amb { background: var(--a600); color: #fff; } .btn.amb:hover:not(:disabled) { background: var(--a500); }
.btn.em { background: var(--e600); color: #fff; }
.btn.sm { padding: 6px 10px; font-size: 13px; }
.btn.xs { padding: 3px 8px; font-size: 12px; border-radius: 6px; }
.btn.ghost { background: transparent; color: var(--s400); border: 1px solid var(--s700); }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; padding: 4px 10px; border-radius: 8px; font-weight: 500; border: 1px solid; white-space: nowrap; }
.badge.sm { padding: 2px 8px; border-radius: 4px; }
.b-slate { background: var(--s700); color: var(--s400); border-color: var(--s600); }

.cmp { --cs: 1; --cbg: rgba(15,23,42,.96); background: var(--cbg); border: 1px solid rgba(6,182,212,.25); border-radius: 14px; color: var(--s100); font-size: calc(13px * var(--cs)); display: flex; flex-direction: column; gap: 6px; padding: 12px; position: relative; overflow: hidden; }

.tier-normal .ring-fg { stroke: #22d3ee; } .tier-orange .ring-fg { stroke: #fbbf24; } .tier-red .ring-fg, .tier-reached .ring-fg { stroke: #f87171; } .tier-empty .ring-fg, .tier-unknown .ring-fg { stroke: #64748b; }

.pbar i { display: block; height: 100%; background: currentColor; }
.tier-normal .pbar { color: #22d3ee; } .tier-orange .pbar { color: #fbbf24; } .tier-red .pbar, .tier-reached .pbar { color: #f87171; } .tier-empty .pbar, .tier-unknown .pbar { color: #64748b; }

.cmp-warn { font-size: 11px; color: var(--a400); background: rgba(245,158,11,.08); border: 1px dashed rgba(245,158,11,.35); border-radius: 6px; padding: 4px 6px; }
.cmp-list .it { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 3px 0; border-top: 1px solid var(--s800); font-size: calc(13px * var(--cs)); }

.pres { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

.cmp-set { display: flex; flex-direction: column; gap: 8px; font-size: 12px; color: var(--s300); border-top: 1px solid var(--s800); padding-top: 8px; }

body.cmp-window { margin: 0; background: var(--s950); }
.cmp-page { min-height: 100vh; }

/* V4 */

.banner.red { background: rgba(239,68,68,.07); border-color: rgba(239,68,68,.35); color: #fecaca; }

.chunk .mt { overflow-wrap: anywhere; }
.ppl-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:24px}

/* Industrie de groupe · V1 */
.ov { top: var(--mbh, 0px); }

.panel { max-height: calc(100vh - var(--mbh, 0px) - 32px); }
.prop { position: relative; outline: 1px dashed rgba(167,139,250,.6); outline-offset: 3px; border-radius: 12px; }

.ring { width: 56px; height: 56px; }

.ring .fg { stroke: var(--c400); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }
.pcard { background: var(--s900); border: 1px solid var(--s800); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 12px; text-align: left; color: inherit; }
.pcard:hover { border-color: rgba(6,182,212,.35); }

.pills { display: flex; gap: 8px; flex-wrap: wrap; }
.fpill { padding: 6px 12px; border-radius: 999px; font-size: 13px; border: 1px solid var(--s700); color: var(--s400); background: var(--s900); }

/* ---------- Données dérivées ---------- */
const memberIds = () => Object.keys(S.members).filter(k => S.members[k] === 'accepted');
const pendingIds = () => Object.keys(S.members).filter(k => S.members[k] === 'pending');
const contribs = () => DATA.contribs.filter(c => S.contrib[c.id]);
const statusOf = c => S.contrib[c.id];
const lineOf = key => DATA.mats.find(m => m.key === key) || DATA.jobs.find(j => j.key === key);
const lineName = l => l.name || l.product;
function priceOf(m) { return S.state === 'missing_price' && m.name === 'Robotics' ? null : m.price; }
function fulfilled(key) { return contribs().filter(c => c.line === key && statusOf(c) === 'approved').reduce((s, c) => s + c.qty, 0); }
function pct(key, req) { return req <= 0 ? 100 : Math.min(100, fulfilled(key) / req * 100); }
function bomProgress() { const ms = DATA.mats; return ms.reduce((s, m) => s + pct(m.key, m.required), 0) / ms.length; }
function bomValue() { if (DATA.mats.some(m => priceOf(m) === null)) return null; return DATA.mats.reduce((s, m) => s + m.required * m.price, 0); }
function detectionUnknown(c) { return S.state === 'reconnect' && !S.real && c.member === 'bravo' && ESI_DETECTED.includes(c.id); }
function valueOf(c) { return detectionUnknown(c) ? null : c.value; }
const dateKey = s => s.date.split('/').reverse().join('');
function salesList() { return DATA.sales.filter(s => S.sales.includes(s.id) && S.state !== 'no_sales').sort((a, b) => dateKey(a).localeCompare(dateKey(b))); }
function distribution() {
  const sales = salesList();
  const revenue = sales.reduce((s, x) => s + x.qty * x.unit, 0);
  const taxed = S.real ? revenue : sales.filter(x => x.channel === 'market').reduce((s, x) => s + x.qty * x.unit, 0);
  const contractRevenue = revenue - taxed;
  const contractFees = S.real ? 0 : sales.filter(x => x.channel === 'contract').reduce((s, x) => s + x.contractFees, 0);
  const broker = taxed * DATA.fees.broker / 100, tax = taxed * DATA.fees.tax / 100, net = revenue - broker - tax - contractFees;
  const ap = S.state === 'no_cost' ? [] : contribs().filter(c => statusOf(c) === 'approved');
  const unknown = ap.filter(c => valueOf(c) === null);
  const cost = unknown.length ? null : ap.reduce((s, c) => s + c.value, 0);
  const ratio = cost === null || cost <= 0 ? null : (net - cost) / cost;
  const members = {};
  ap.forEach(c => { const m = members[c.member] = members[c.member] || { costs: 0, byType: {}, unknown: 0 }; if (valueOf(c) === null) m.unknown += 1; else { m.costs += c.value; m.byType[c.type] = (m.byType[c.type] || 0) + c.value; } });
  Object.values(members).forEach(m => { m.share = cost ? m.costs / cost * 100 : null; m.profit = ratio === null || m.unknown ? null : m.costs * ratio; m.payout = m.profit === null ? null : m.costs + m.profit; });
  return { sales, revenue, taxed, contractRevenue, contractFees, broker, tax, net, cost, ratio, margin: ratio === null ? null : ratio * 100, members, unknown, approved: ap };
}
function soldQty(item) { return salesList().filter(s => s.item === item).reduce((a, s) => a + s.qty, 0); }
function producedQty(item) { const it = DATA.items.find(i => i.name === item); return it.runs; }
function lastPrice(item) { const s = salesList().filter(x => x.item === item); return s.length ? s[s.length - 1].unit : null; }

const nf = new Intl.NumberFormat('fr-FR');
const nf2 = new Intl.NumberFormat('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtN = v => nf.format(Math.round(v));
const UNK = '<span class="unk">inconnu</span>';
function fmtIsk(v) {
  if (v === null || v === undefined) return UNK;
  const a = Math.abs(v), sg = v < 0 ? '−' : '';
  if (a >= 1e9) return sg + nf2.format(a / 1e9) + ' B';
  if (a >= 1e6) return sg + nf2.format(a / 1e6) + ' M';
  if (a >= 1e3) return sg + nf.format(Math.round(a / 100) / 10) + ' k';
  return sg + nf.format(Math.round(a));
}
const fmtFull = v => v === null || v === undefined ? UNK : nf2.format(v) + ' ISK';
const fmtPct = (v, d = 1) => v === null || v === undefined ? UNK : (v < 0 ? '−' : '') + Math.abs(v).toFixed(d).replace('.', ',') + ' %';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const initials = name => { const w = name.replace(/^(Joueur|Personnage) /, '').split(/[\s-]+/); return (w[0][0] + (w[1] ? w[1][0] : '')).toUpperCase(); };

/* ---------- Onglet BOM ---------- */
function reservedBy(key) {
  if (S.claims[key]) return 'alpha';
  if (!S.reserved) return null;
  const map = { m7: 'bravo', m8: 'bravo', m9: 'charlie', m10: 'charlie', m11: 'charlie', m12: 'delta', m13: 'delta', m1: 'alpha', m2: 'alpha', m3: 'alpha', m4: 'alpha', m5: 'alpha', m6: 'alpha', j1: 'bravo', j2: 'bravo', j3: 'bravo', j4: 'bravo', j5: 'bravo', j6: 'charlie', j7: 'charlie', j8: 'charlie', j9: 'alpha', j10: 'alpha', j13: 'delta', j14: 'delta', j15: 'delta', j16: 'delta' };
  return map[key] || null;
}
function containerState(m) {
  if (S.state === 'container_unknown') return null;
  const q = CONTAINER_QTY[m.name] !== undefined ? CONTAINER_QTY[m.name] : m.required;
  return { q, st: q >= m.required ? 'verified' : q > 0 ? 'partial' : 'missing' };
}
function renderContainerBanner() {
  const admin = canAdmin();
  if (S.state === 'container_unknown') return `<div class="banner amber">${svg(ICON.warn)}<div style="flex:1"><b>Container : « ${esc(PROJECT.container)} » relié aux bureaux corpo.</b> Non vérifiable : Synchronisez les assets corpo. Les quantités du container sont inconnues, jamais 0.</div>${admin || S.real ? '<button class="btn sec sm">Tout vérifier</button>' : ''}</div>`;
  const checked = S.containerChecked;
  const gaps = checked ? DATA.mats.filter(m => { const c = containerState(m); return c.st !== 'verified'; }) : [];
  const gapTxt = gaps.map(m => { const c = containerState(m); return `${m.name} : ${fmtN(c.q)} / ${fmtN(m.required)} dans le container, ${fmtN(fulfilled(m.key))} approuvés`; }).join(' · ');
  return `<div class="banner cyan">${svg(ICON.inventory)}<div style="flex:1"><b>Container : « ${esc(PROJECT.container)} » relié aux bureaux corpo.</b> ${checked ? `Vérifié à 22:10 sur les assets corpo de ${esc(PEOPLE.alpha.corp)} (sync 22:04).` : 'Pas encore vérifié.'}
    ${checked && gaps.length && !S.real ? `<div class="prop" style="margin-top:8px;padding:8px 10px;border-radius:8px;background:rgba(245,158,11,.08);color:var(--a300)">${ptag(8)} <b>${gaps.length} lignes approuvées mais absentes ou partielles dans le container.</b> ${gapTxt}. À relancer auprès des contributeurs avant de lancer les jobs.</div>` : ''}</div>
    ${S.real || admin ? `<button class="btn sec sm" data-act="verify">${svg(ICON.refresh)}Tout vérifier</button>` : `<span class="hint">vérification réservée aux admins ${ptag(8)}</span>`}</div>`;
}
function contribBtn(key, done) {
  if (S.real || S.status === 'completed' || done || S.state === 'corp_reader') return '';
  return `<button class="btn ghost xs" data-act="contrib-line" data-arg="${key}">Contribuer</button>`;
}
function renderBom() {
  const showRes = (S.reserved || Object.keys(S.claims).length) && !S.real;
  const mats = DATA.mats.map(m => {
    const f = fulfilled(m.key), p = pct(m.key, m.required), price = priceOf(m);
    const c = S.containerChecked ? containerState(m) : null;
    const cTxt = c ? (c.st === 'verified' ? `<span class="c-em">Vérifié : ${fmtN(c.q)} / ${fmtN(m.required)}</span>` : c.st === 'partial' ? `<span class="c-amber">Partiel : ${fmtN(c.q)} / ${fmtN(m.required)}</span>` : '<span class="c-red">Absent du container</span>') : (S.containerChecked && S.state === 'container_unknown' ? '<span class="unk">container inconnu</span>' : '');
    const res = showRes ? (reservedBy(m.key) ? `<td>${who(reservedBy(m.key))}</td>` : '<td class="hint">libre</td>') : '';
    return `<tr><td class="wr"><div class="row" style="gap:8px"><div class="mini">${itemIni(m.name)}</div><div><div class="c-s200">${m.name}</div>${cTxt ? `<div class="hint">${cTxt}</div>` : ''}</div></div></td>
      <td class="r">${fmtN(m.required)}</td><td class="r">${fmtN(f)}</td><td class="r">${fmtN(Math.max(0, m.required - f))}</td>
      <td><div class="row" style="gap:8px">${pbar(p)}<span class="mono" style="font-size:12px">${Math.round(p)} %</span>${p >= 100 ? svg(ICON.lock).replace('<svg', '<svg width="12" height="12" style="color:var(--e400)"') : ''}</div></td>
      <td class="r">${price === null ? `${UNK}<div class="hint" style="font-family:inherit">aucun ordre Jita</div>` : fmtIsk(m.required * price)}</td>${res}${S.real ? '' : `<td>${contribBtn(m.key, p >= 100)}</td>`}</tr>`;
  }).join('');

    <div style="overflow-x:auto"><table class="t"><thead><tr><th>Personnage</th><th class="r">Coûts engagés</th><th class="r">Part %</th><th class="r">Part du profit</th><th class="r">Payout total</th></tr></thead><tbody>${distRows || '<tr><td colspan="5" class="hint" style="text-align:center">Aucun membre avec une contribution approuvée</td></tr>'}

function roundingNote(d) {
  const left = Object.keys(d.members).map(k => {
    const out = DATA.transfers.filter(t => t.from === k).reduce((s, t) => s + t.amount, 0), inn = DATA.transfers.filter(t => t.to === k).reduce((s, t) => s + t.amount, 0);
    return [k, (DATA.held[k] || 0) - out + inn - d.members[k].payout];
  }).filter(([, r]) => Math.abs(r) >= 0.005);
  return left.length ? `<p class="hint" style="margin:0">Écart d’arrondi (payouts au centime) : ${left.map(([k, r]) => `${nf2.format(Math.abs(r))} ISK ${r > 0 ? 'reste chez' : 'manque à'} ${esc(PEOPLE[k].char)}`).join(' · ')}.</p>` : '';
}

/* ---------- Compagnon (proposition 10) ---------- */
function claimLabel(l) {
  if (l.name) { const p = priceOf(l); return `${fmtN(l.required - fulfilled(l.key))} u · ${p === null ? UNK : fmtIsk((l.required - fulfilled(l.key)) * p)}`; }
  return `${ACT_LABEL[l.activity].toLowerCase()} · ${l.runs} runs${l.activity === 'invention' ? ' (tentatives)' : ''}`;
}
function freeLines() {
  const mats = DATA.mats.filter(m => fulfilled(m.key) < m.required && !reservedBy(m.key));
  const jobs = DATA.jobs.filter(j => fulfilled(j.key) < j.required && !esiStatus(j.key) && !reservedBy(j.key));

function toast(msg, type = 'success') {

  t.innerHTML = `${svg(type === 'success' ? ICON.ok : ICON.warn)}<span>${msg}</span>`;

  const keep = S ? { specOpen: S.specOpen, auditOpen: S.auditOpen } : { specOpen: false, auditOpen: false };
  S = baseState();
  tickStart = Date.now();
  Object.assign(S, keep);
  if (params.get('spec') === '1') S.specOpen = true;
  if (params.get('audit') === '1') S.auditOpen = true;
  S.longNames = params.get('long') === '1';
  S.real = params.get('real') === '1';
  applyNames(S.longNames);
  const p = parseInt(params.get('p') || '0', 10);
  const m = params.get('m');
  if (p) applyStep(Math.min(LAST_STEP, Math.max(1, p)));
  else if (m) { applyStep(MODE_TO_STEP[m]); S.step = 0; S.modal = null; S.focus = null; S.view = 'detail'; S.viewer = 'alpha'; }
  const v = params.get('v');
  if (v) {
    S.view = v === 'available' ? 'list' : v;
    if (v === 'available') { S.listTab = 'available'; if (S.viewer === 'alpha') S.viewer = 'charlie'; }
    if (v === 'list') { S.listTab = 'mine'; S.viewer = 'alpha'; }
    if (v === 'join') S.viewer = 'delta';
    if (v === 'detail' && !S.created) { applyStep(16); S.step = 0; S.view = 'detail'; S.focus = null; }
    if (v === 'companion' && !S.created) { applyStep(17); S.step = 0; S.view = 'companion'; }
    if (v !== 'detail') S.modal = null;
  }
  if (params.get('tab')) { S.tab = params.get('tab'); if (S.view !== 'detail' && S.created && !v) S.view = 'detail'; }
  if (params.get('size')) S.size = params.get('size');
  if (params.get('s')) S.state = params.get('s');
  if (S.state === 'corp_reader') S.viewer = 'foxtrot';
  if (params.get('modal')) S.modal = params.get('modal') === 'none' ? null : params.get('modal');
  render();
  const f = document.getElementById('focus');
  if (f && S.step) f.scrollIntoView({ block: 'center' });
  else window.scrollTo(0, 0);
}
let tickStart = Date.now();
function clockTxt(sec) { sec = Math.max(0, Math.round(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return [h, m, s].map(v => String(v).padStart(2, '0')).join(':'); }
function updateClocks() {
  const now = (FEED_NOW[S.phase] ?? FEED_NOW[16]) + (Date.now() - tickStart) / 1000;
  document.querySelectorAll('[data-end]').forEach(el => { const left = parseFloat(el.dataset.end) - now; el.textContent = left > 0 ? 'dans ' + clockTxt(left) : 'terminé'; });
}
setInterval(updateClocks, 1000);
function go(hash) { if (location.hash === '#' + hash) applyHash(); else location.hash = hash; }
function setParam(k, v) { const params = new URLSearchParams(location.hash.replace(/^#/, '')); if (v === null) params.delete(k); else params.set(k, v); go(params.toString()); }

/* ---------- Événements ---------- */
function onClick(e) {
  const h = e.target.closest('[data-hash]');
  if (h && !h.disabled) { go(h.dataset.hash); return; }
  const a = e.target.closest('[data-act]');
  if (!a || a.disabled) return;
  const act = a.dataset.act, arg = a.dataset.arg;
  if (['state', 'cf-type', 'mine'].includes(act)) return;
  switch (act) {
    case 'tour-start': go('p=1'); break;
    case 'tour-next': go('p=' + Math.min(LAST_STEP, (S.step || 0) + 1)); break;
    case 'tour-prev': go('p=' + Math.max(1, S.step - 1)); break;
    case 'spec-toggle': S.specOpen = !S.specOpen; render(); break;
    case 'audit-toggle': S.auditOpen = !S.auditOpen; render(); break;
    case 'real': setParam('real', S.real ? null : '1'); break;
    case 'long-names': setParam('long', S.longNames ? null : '1'); break;
    case 'tab': if (S.view !== 'detail') { go(`m=${S.status === 'none' ? 'in_progress' : S.status}&tab=${arg}`); } else { S.tab = arg; S.focus = null; render(); } break;
    case 'filter': S.filter = arg; render(); break;
    case 'close': S.modal = null; render(); break;
    case 'modal': S.modal = arg; if (arg === 'contribute' && !S.contribForm) S.contribForm = { type: 'material', line: 'm8', qty: 60 }; render(); break;
    case 'create-next': S.createStage = 2; render(); break;
    case 'create-back': S.createStage = 1; render(); break;
    case 'create': go('p=4'); break;
    case 'cf-set': { const t = arg; const line = t === 'material' ? 'm8' : t === 'bpc' ? 'j15' : 'j6'; S.contribForm = { type: t, line, qty: t === 'material' ? 60 : lineOf(line).runs }; render(); break; }
    case 'contrib-line': { if (S.view === 'companion') { S.view = 'detail'; S.tab = 'bom'; } const l = lineOf(arg); S.contribForm = { type: l.name ? 'material' : l.group === 'blueprint' ? 'bpc' : 'job_install', line: arg, qty: l.required - fulfilled(arg) }; S.modal = 'contribute'; render(); break; }
    case 'submit-contrib': S.modal = null; render(); toast('Contribution soumise · en attente de revue'); break;
    case 'copy': S.copied = true; render(); toast('Lien copié !'); break;
    case 'copy-ref': S.refCopied = true; render(); break;
    case 'copy-recap': S.recapCopied = true; render(); break;
    case 'verify': S.containerChecked = true; render(); toast('Container vérifié'); break;
    case 'review': S.contrib[arg] = 'approved'; render(); toast('Contribution approuvée'); break;
    case 'reject': S.contrib[arg] = 'rejected'; render(); toast('Contribution rejetée', 'warning'); break;
    case 'accept': S.members[arg] = 'accepted'; S.focus = null; render(); toast(`${PEOPLE[arg].name} accepté`); break;
    case 'promote': S.bravoAdmin = true; S.focus = null; render(); toast(`${PEOPLE.bravo.name} promu admin`); break;
    case 'join-corp': toast('Projet rejoint : même corporation, sans approbation'); go(S.state === 'corp_reader' ? 'm=in_progress&tab=contrib' : 'p=9'); break;
    case 'next-status': { const n = NEXT_STATUS[S.status]; if (n === 'completed') { S.modal = 'complete'; render(); } else go('m=' + n + '&tab=' + S.tab); break; }
    case 'pay': S.paid[arg] = true; render(); break;
    case 'sale-channel': S.saleChannel = arg; render(); break;
    case 'claim': S.claims[arg] = true; render(); toast(`${lineName(lineOf(arg))} : réservé par vous`); break;
    case 'unclaim': delete S.claims[arg]; render(); toast(`${lineName(lineOf(arg))} : ligne libérée`, 'warning'); break;
    case 'expand': S.expanded[arg] = !S.expanded[arg]; render(); break;
  }
}
function onChange(e) {
  const a = e.target.closest('[data-act]');
  if (!a) return;
  if (a.dataset.act === 'state') setParam('s', a.value === 'normal' ? null : a.value);
  if (a.dataset.act === 'cf-type') { S.cfType = a.value || null; render(); }
  if (a.dataset.act === 'mine') { S.mine = a.checked; render(); }
}
function onKey(e) {
  if (e.target.closest('input, textarea, select')) return;
  if (e.key === 'ArrowRight' && S.step < LAST_STEP) go('p=' + ((S.step || 0) + 1));
  if (e.key === 'ArrowLeft' && S.step > 1) go('p=' + (S.step - 1));
  if (e.key === 'Escape' && S.modal) { S.modal = null; render(); }
}
document.addEventListener('click', onClick);
document.addEventListener('change', onChange);
document.addEventListener('keydown', onKey);
window.addEventListener('hashchange', applyHash);
applyHash();
</script>
