framework:
    messenger:
        failure_transport: failed

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
                    max_delay: 0
            on_demand:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    exchange:
                        name: on_demand
                    queues:
                        on_demand: ~
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 2
                    max_delay: 0
            failed:
                dsn: 'doctrine://default?queue_name=failed&auto_setup=false'

        routing:
            App\Message\SyncCharacterAssets: on_demand
            App\Message\SyncCorporationAssets: on_demand
            App\Message\TriggerAssetsSync: on_demand
            App\Message\TriggerCorporationAssetsSync: on_demand
            App\Message\TriggerPlanetarySync: async
            App\Message\SyncPlanetaryColonies: async
            App\Message\SyncCharacterPlanetaryColonies: async
            App\Message\SyncIndustryJobs: async
            App\Message\SyncCharacterIndustryJobs: async
            App\Message\SyncUserIndustryJobs: async
            App\Message\TriggerPveSync: async
            App\Message\SyncWalletTransactions: async
            App\Message\SyncCharacterWalletTransactions: async
            App\Message\TriggerMiningSync: async
            App\Message\TriggerAnsiblexSync: async
            App\Message\TriggerJitaMarketSync: async
            App\Message\TriggerStructureMarketSync: async
            App\Message\SyncRegionalMarketVolumes: async
            App\Message\SyncUserPveData: async
            App\Message\SyncUserMiningData: async
            App\Message\SyncAnsiblexGates: async
            App\Message\SyncPublicContracts: async
            App\Message\TriggerCorporationMiningExtractionsSync: async
            App\Message\SyncCorporationMiningExtractions: async
            App\Message\TriggerMoonTaxSync: async
            App\Message\SyncMoonTax: async
            App\Message\SyncBlueprints: async
            App\Message\SyncUserBlueprints: async
            App\Message\SyncCharacterOrders: async
            App\Message\SyncUserCharacterOrders: async
            App\Message\SyncAdjustedPrices: async
            App\Message\SyncCostIndices: async
            App\Message\CheckAlertPrices: async
            App\Message\PurgeOldMarketHistory: async
            App\Message\PurgeOldNotifications: async
            App\Message\PurgeExpiredSharedLists: async
            App\Message\WarmupStructureOwnersMessage: async
            App\Message\TakeMiningLedgerSnapshot: async
            App\Message\TriggerMiningOperationRecurrences: async
            App\Message\CheckMoonChunkAlerts: async
            App\Message\CheckMiningSiteDepletionAlerts: async
            App\Message\CreateRecurringMiningOperations: async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
                on_demand: 'in-memory://'
