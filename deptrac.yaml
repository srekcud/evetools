# Architecture report for src/ — one layer per top-level directory.
# Report only: the ruleset describes the intended dependency direction but is not
# wired into CI. Run with `make deptrac`.
deptrac:
  paths:
    - ./src
  exclude_files:
    - '#src/Kernel\.php$#'
  cache_file: var/deptrac.cache

  layers:
    # Shared kernel: value types usable by every layer
    - name: Enum
      collectors:
        - { type: directory, value: src/Enum/.* }
    - name: Constant
      collectors:
        - { type: directory, value: src/Constant/.* }
    - name: Exception
      collectors:
        - { type: directory, value: src/Exception/.* }
    - name: Dto
      collectors:
        - { type: directory, value: src/Dto/.* }

    # Persistence
    - name: Entity
      collectors:
        - { type: directory, value: src/Entity/.* }
    - name: Repository
      collectors:
        - { type: directory, value: src/Repository/.* }

    # Domain / application services
    - name: Service
      collectors:
        - { type: directory, value: src/Service/.* }

    # API Platform
    - name: ApiResource
      collectors:
        - { type: directory, value: src/ApiResource/.* }
    - name: StateProvider
      collectors:
        - { type: directory, value: src/State/Provider/.* }
    - name: StateProcessor
      collectors:
        - { type: directory, value: src/State/Processor/.* }

    # Async
    - name: Message
      collectors:
        - { type: directory, value: src/Message/.* }
    - name: MessageHandler
      collectors:
        - { type: directory, value: src/MessageHandler/.* }
    - name: Scheduler
      collectors:
        - { type: directory, value: src/Scheduler/.* }

    # Entry points / framework glue
    - name: Controller
      collectors:
        - { type: directory, value: src/Controller/.* }
    - name: Command
      collectors:
        - { type: directory, value: src/Command/.* }
    - name: Security
      collectors:
        - { type: directory, value: src/Security/.* }
    - name: EventListener
      collectors:
        - { type: directory, value: src/EventListener/.* }
    - name: DataFixtures
      collectors:
        - { type: directory, value: src/DataFixtures/.* }

    # Industry bounded context (ADR-0009), built next to the flat folders above (strangler)
    - name: IndustryDomain
      collectors:
        - { type: directory, value: src/Industry/Domain/.* }
    - name: IndustryApplication
      collectors:
        - { type: directory, value: src/Industry/Application/.* }
    - name: IndustryInfrastructure
      collectors:
        - { type: directory, value: src/Industry/Infrastructure/.* }

    # Third-party code (Symfony, Doctrine, API Platform...), PHP built-ins excluded.
    # Declared so that a layer which must stay framework-free (IndustryDomain) is checked.
    - name: Vendor
      collectors:
        - type: bool
          must:
            - { type: classNameRegex, value: '#^(?!App\\)#' }
          must_not:
            - { type: php_internal, value: '.*' }

  # Permissive: dependencies point from entry points towards persistence.
  # The flat folders never import the Industry layers: none of them lists an Industry* layer.
  # Entity -> Repository is allowed because of #[ORM\Entity(repositoryClass: ...)].
  # ApiResource -> State* is allowed because of provider:/processor: attributes.
  ruleset:
    Enum: [Constant, Vendor]
    Constant: [Vendor]
    Exception: [Enum, Constant, Vendor]
    Dto: [Enum, Constant, Vendor]
    Entity: [Repository, Enum, Constant, Exception, Dto, Vendor]
    Repository: [Entity, Enum, Constant, Exception, Dto, Vendor]
    Service: [Entity, Repository, Message, Enum, Constant, Exception, Dto, Vendor]
    ApiResource: [StateProvider, StateProcessor, Entity, Enum, Constant, Exception, Dto, Vendor]
    StateProvider: [ApiResource, Service, Repository, Entity, Security, Enum, Constant, Exception, Dto, Vendor]
    StateProcessor: [ApiResource, Service, Repository, Entity, Message, Security, Enum, Constant, Exception, Dto, Vendor]
    Message: [Enum, Constant, Dto, Vendor]
    MessageHandler: [Message, Service, Repository, Entity, Enum, Constant, Exception, Dto, Vendor]
    Scheduler: [Message, Enum, Constant, Vendor]
    Controller: [Service, Repository, Entity, Security, Enum, Constant, Exception, Dto, Vendor]
    Command: [Service, Repository, Entity, Message, Enum, Constant, Exception, Dto, Vendor]
    Security: [Service, Repository, Entity, Enum, Constant, Exception, Dto, Vendor]
    EventListener: [Service, Repository, Entity, Security, Enum, Constant, Exception, Dto, Vendor]
    DataFixtures: [Entity, Repository, Enum, Constant, Dto, Vendor]
    # Pure PHP: no framework, no persistence, no other layer.
    IndustryDomain: ~
    IndustryApplication: [IndustryDomain]
    # Adapters of the Domain ports over the SDE / ESI persistence.
    IndustryInfrastructure: [IndustryDomain, IndustryApplication, Entity, Repository, Vendor]
