  Maquette V1 · industrie solo (projets industriels personnels). Fichier autonome, rendu en JS, aucune dépendance.
  Base : l’existant du module (frontend/src/views/Industry.vue, components/industry/*, IndustryJobMatcher, IndustryResourceMapper) et la maquette de groupe.
  Chaque proposition est marquée « Proposition n » (cadre violet pointillé) et listée dans « Ce que la maquette ajoute à la spec ».
  Le bouton « Existant seul » masque les propositions et montre le comportement actuel du code.
  Données et noms 100 % fictifs. Recettes, plafonds de runs, probabilité d'invention et datacores : SDE local.
  Quantités : formule du noyau (ME, bonus de structure 1 %, arrondi par job), découpage par plafond de runs du BPC.
  Prix Jita : fictifs (ordre de grandeur). Tous les totaux sont recalculés en Python (mockups/tests/industry_solo_v1_data.py).
  Routage par hash : #p=1..N (parcours), #v=dashboard|projects|slots|detail|companion, #tab=invention|steps|shopping|costs|sales,
  #s=<état>, #long=1, #real=1 (existant seul), #spec=1, #audit=1, #modal=…, #size=bar|compact
-->

:root {
  --s950:#020617; --s900:#0f172a; --s800:#1e293b; --s700:#334155; --s600:#475569; --s500:#64748b; --s400:#94a3b8; --s300:#cbd5e1; --s200:#e2e8f0; --s100:#f1f5f9;
  --c400:#22d3ee; --c500:#06b6d4; --c600:#0891b2; --e400:#34d399; --e500:#10b981; --e600:#059669;
  --a300:#fcd34d; --a400:#fbbf24; --a500:#f59e0b; --a600:#d97706; --r400:#f87171; --r500:#ef4444; --v400:#a78bfa; --v500:#8b5cf6; --sky400:#38bdf8;
  --warning:#f59e0b; --chart-grid:#334155; --chart-text:#e2e8f0;
  --mono:'Share Tech Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--s950); color: var(--s100); font-family: ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji"; font-size: 14px; line-height: 1.43; }
button { font: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; }
input, select { font: inherit; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.bg-grid { position: fixed; inset: 0; pointer-events: none; background-image: linear-gradient(rgba(6,182,212,.03) 1px, transparent 1px), linear-gradient(90deg, rgba(6,182,212,.03) 1px, transparent 1px); background-size: 50px 50px; }
.bg-glow { position: fixed; top: -50%; left: -50%; width: 100%; height: 100%; pointer-events: none; background: radial-gradient(closest-side, rgba(22,78,99,.2), transparent); }

/* Barre de maquette */
.mockbar { position: relative; z-index: 60; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px 14px; background: repeating-linear-gradient(135deg, #160f24 0 10px, #120c1e 10px 20px); border-bottom: 2px dashed rgba(167,139,250,.55); font-size: 12px; color: #c4b5fd; }
.mockbar .lbl { font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: 11px; color: var(--v400); }
.mockbar .grp { display: flex; align-items: center; gap: 4px; padding-left: 10px; border-left: 1px dashed rgba(167,139,250,.35); }
.mockbar button, .mockbar select { background: rgba(167,139,250,.08); color: #ddd6fe; border: 1px dashed rgba(167,139,250,.45); border-radius: 6px; padding: 3px 8px; font-size: 12px; }
.mockbar button.on { background: rgba(167,139,250,.28); border-style: solid; color: #fff; }
.mockbar .step { font-family: var(--mono); color: #fff; min-width: 210px; }

/* Shell (MainLayout.vue) */
.app { position: relative; display: flex; min-height: calc(100vh - 44px); }
aside.side { width: 256px; flex-shrink: 0; background: var(--s900); border-right: 1px solid rgba(6,182,212,.2); display: flex; flex-direction: column; position: sticky; top: 0; height: calc(100vh - var(--mbh, 0px)); }
.logo { padding: 24px; border-bottom: 1px solid rgba(6,182,212,.2); display: flex; align-items: center; gap: 12px; }
.logo .ic { width: 40px; height: 40px; border-radius: 8px; background: linear-gradient(to bottom right, #06b6d4, #2563eb); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 15px -3px rgba(6,182,212,.3); }
.logo h1 { margin: 0; font-size: 18px; line-height: 28px; font-weight: 700; letter-spacing: -.025em; background: linear-gradient(to right, #22d3ee, #60a5fa); -webkit-background-clip: text; background-clip: text; color: transparent; }
.logo p { margin: 0; font-size: 12px; color: var(--s500); letter-spacing: .1em; text-transform: uppercase; }
nav.menu { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
.ni { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 8px; border: 1px solid transparent; color: var(--s400); background: none; text-align: left; font-weight: 500; font-size: 14px; }
.ni:hover { background: rgba(30,41,59,.5); color: var(--s200); border-color: rgba(6,182,212,.3); }
.ni svg { width: 20px; height: 20px; flex-shrink: 0; }
.ni.on { background: linear-gradient(to right, rgba(6,182,212,.2), rgba(59,130,246,.1)); color: var(--c400); border-color: rgba(6,182,212,.3); box-shadow: 0 10px 15px -3px rgba(6,182,212,.1); }
.ni .dot { margin-left: auto; width: 6px; height: 6px; border-radius: 50%; background: var(--c400); }
.ni .chev { margin-left: auto; width: 16px; height: 16px; }
.sub { padding-left: 16px; display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
.sub .ni { padding: 10px 16px; font-size: 14px; }
.sub .ni svg { width: 16px; height: 16px; }
.charcard { margin: 16px; margin-top: 0; padding-top: 16px; border-top: 1px solid rgba(6,182,212,.2); }
.charcard .in { background: var(--s900); border: 1px solid var(--s800); border-radius: 12px; padding: 16px; display: flex; align-items: center; gap: 12px; }
.avatar { width: 48px; height: 48px; border-radius: 8px; box-shadow: 0 0 0 2px rgba(6,182,212,.5); background: linear-gradient(135deg, #334155, #1e293b); display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--s300); }
main.content { flex: 1; min-width: 0; }
header.top { position: sticky; top: 0; z-index: 10; background: var(--s900); border-bottom: 1px solid rgba(6,182,212,.1); padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
header.top h2 { margin: 0; font-size: 24px; line-height: 32px; font-weight: 700; color: var(--s100); }
header.top p { margin: 4px 0 0; font-size: 14px; color: var(--s500); }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 8px; border: 1px solid; font-size: 12px; }
.pill.esi { background: rgba(16,185,129,.1); border-color: rgba(16,185,129,.3); color: var(--e400); }
.pill.esi i { width: 8px; height: 8px; border-radius: 50%; background: var(--e500); }
.pill.all { padding: 8px 16px; background: rgba(245,158,11,.1); border-color: rgba(245,158,11,.3); color: var(--a400); font-size: 14px; font-weight: 500; }
.pill.corp { padding: 8px 16px; background: rgba(6,182,212,.1); border-color: rgba(6,182,212,.3); color: var(--c400); font-size: 14px; font-weight: 500; }
.page { padding: 32px; }
.wrap { max-width: 80rem; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }

/* Briques (Ledger, MiningTab, GroupIndustry) */
.card { background: var(--s900); border: 1px solid var(--s800); border-radius: 12px; padding: 16px; }
.card.p5 { padding: 20px; }
.card.p6 { padding: 24px; }
.card.soft { background: rgba(15,23,42,.8); }
.card.flush { padding: 0; overflow: hidden; }
.card-h { padding: 16px 24px; border-bottom: 1px solid var(--s800); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.card-h h3, h3.t { margin: 0; font-size: 18px; line-height: 28px; font-weight: 600; color: #fff; }
.lab { font-size: 12px; color: var(--s400); text-transform: uppercase; letter-spacing: .05em; }
.lab.dim { color: var(--s500); }
.kpi { margin-top: 4px; font-size: 20px; line-height: 28px; font-weight: 700; }
.kpi3 { font-size: 30px; line-height: 36px; font-weight: 700; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.hint { font-size: 12px; color: var(--s500); }
.hint2 { font-size: 12px; color: #475569; }
.muted { color: var(--s400); }
.c-cyan { color: var(--c400); } .c-em { color: var(--e400); } .c-amber { color: var(--a400); } .c-red { color: var(--r400); } .c-violet { color: var(--v400); } .c-white { color: #fff; } .c-s300 { color: var(--s300); } .c-s200 { color: var(--s200); } .c-s500 { color: var(--s500); }
.unk { color: var(--warning); font-style: italic; }
.row { display: flex; align-items: center; gap: 12px; }
.row.sb { justify-content: space-between; }
.row.wrapf { flex-wrap: wrap; }
.col { display: flex; flex-direction: column; gap: 12px; }
.g2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }
.g3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 16px; }
.g4 { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 16px; }
.span2 { grid-column: span 2 / span 2; }
.start { align-items: start; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px; border: 0; font-size: 14px; font-weight: 500; white-space: nowrap; transition: transform .15s, background .15s; }
.btn:hover:not(:disabled) { transform: translateY(-1px); }
.btn:disabled { opacity: .5; }
.btn svg { width: 16px; height: 16px; }
.btn.pri { background: var(--c600); color: #fff; } .btn.pri:hover:not(:disabled) { background: var(--c500); }
.btn.sec { background: var(--s700); color: var(--s200); } .btn.sec:hover:not(:disabled) { background: var(--s600); }
.btn.amb { background: var(--a600); color: #fff; } .btn.amb:hover:not(:disabled) { background: var(--a500); }
.btn.em { background: var(--e600); color: #fff; }
.btn.sm { padding: 6px 10px; font-size: 13px; }
.btn.xs { padding: 3px 8px; font-size: 12px; border-radius: 6px; }
.btn.ghost { background: transparent; color: var(--s400); border: 1px solid var(--s700); }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; padding: 4px 10px; border-radius: 8px; font-weight: 500; border: 1px solid; white-space: nowrap; }
.badge.sm { padding: 2px 8px; border-radius: 4px; }
.b-slate { background: var(--s700); color: var(--s400); border-color: var(--s600); }

.cmp { --cs: 1; --cbg: rgba(15,23,42,.96); background: var(--cbg); border: 1px solid rgba(6,182,212,.25); border-radius: 14px; color: var(--s100); font-size: calc(13px * var(--cs)); display: flex; flex-direction: column; gap: 6px; padding: 12px; position: relative; overflow: hidden; }

.tier-normal .ring-fg { stroke: #22d3ee; } .tier-orange .ring-fg { stroke: #fbbf24; } .tier-red .ring-fg, .tier-reached .ring-fg { stroke: #f87171; } .tier-empty .ring-fg, .tier-unknown .ring-fg { stroke: #64748b; }

.pbar i { display: block; height: 100%; background: currentColor; }
.tier-normal .pbar { color: #22d3ee; } .tier-orange .pbar { color: #fbbf24; } .tier-red .pbar, .tier-reached .pbar { color: #f87171; } .tier-empty .pbar, .tier-unknown .pbar { color: #64748b; }

.cmp-warn { font-size: 11px; color: var(--a400); background: rgba(245,158,11,.08); border: 1px dashed rgba(245,158,11,.35); border-radius: 6px; padding: 4px 6px; }
.cmp-list .it { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 3px 0; border-top: 1px solid var(--s800); font-size: calc(13px * var(--cs)); }

.pres { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

.cmp-set { display: flex; flex-direction: column; gap: 8px; font-size: 12px; color: var(--s300); border-top: 1px solid var(--s800); padding-top: 8px; }

body.cmp-window { margin: 0; background: var(--s950); }
.cmp-page { min-height: 100vh; }

/* V4 */

.banner.red { background: rgba(239,68,68,.07); border-color: rgba(239,68,68,.35); color: #fecaca; }

.chunk .mt { overflow-wrap: anywhere; }
.ppl-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:24px}

/* Industrie de groupe · V1 */
.ov { top: var(--mbh, 0px); }

.panel { max-height: calc(100vh - var(--mbh, 0px) - 32px); }
.prop { position: relative; outline: 1px dashed rgba(167,139,250,.6); outline-offset: 3px; border-radius: 12px; }

.ring { width: 56px; height: 56px; }

.ring .fg { stroke: var(--c400); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }
.pcard { background: var(--s900); border: 1px solid var(--s800); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 12px; text-align: left; color: inherit; }
.pcard:hover { border-color: rgba(6,182,212,.35); }

.pills { display: flex; gap: 8px; flex-wrap: wrap; }
.fpill { padding: 6px 12px; border-radius: 999px; font-size: 13px; border: 1px solid var(--s700); color: var(--s400); background: var(--s900); }

/* ---------- Chronologie du scénario (phase) ---------- */
const purchasesAt = () => DATA.purchases.filter(p => S.links[p.id]);
const stockPasted = () => S.phase >= 5;
const salesAt = () => S.state === 'personal_use' ? [] : DATA.sales.filter(s => S.links[s.id]);
function jobState(kind) {
  if (kind === 't1') return S.phase >= 8 ? 'delivered' : S.phase >= 7 ? 'active' : null;
  if (kind === 'final') return S.phase >= 13 ? 'delivered' : S.phase >= 11 ? 'active' : null;
  return null;
}
const matched = kind => !!jobState(kind) && (!S.real || S.phase >= 7);
function jobsCost() {
  let c = 0;
  if (matched('t1')) c += DATA.jobCosts.t1;
  if (matched('final')) c += DATA.divisions.length * DATA.jobCosts.final;
  return c;
}
const priceOf = m => S.state === 'missing_price' && m.name === 'Particle Accelerator Unit' ? null : m.price;
function estMaterial() { return DATA.mats.some(m => priceOf(m) === null) ? null : DATA.mats.reduce((s, m) => s + m.required * m.price, 0); }
const materialApplied = () => S.phase >= 6 && estMaterial() !== null ? Math.ceil(estMaterial() / 1e6) * 1e6 : null;
function realMaterial() {
  let total = 0;
  for (const m of DATA.mats) {
    const bought = purchasesAt().filter(p => p.item === m.name);
    const qty = bought.reduce((s, p) => s + p.qty, 0);
    const rest = m.required - qty;
    if (rest > 0 && priceOf(m) === null) return null;
    total += bought.reduce((s, p) => s + p.qty * p.unit, 0) + Math.max(0, rest) * (priceOf(m) ?? 0);
  }
  return total;
}
const inventionComputed = () => S.phase >= 6 ? DATA.invention.computed : null;
const inventionEntered = () => S.phase >= 6 ? DATA.invention.entered : null;
const personal = () => S.state === 'personal_use';

function existingProfit() {
  const mat = materialApplied() ?? estMaterial();
  const jobs = jobsCost() > 0 ? jobsCost() : DATA.est.job;
  const tax = DATA.est.tax, sell = DATA.est.sell;
  if (mat === null) return { total: null, profit: null, pct: null, mat, jobs, tax, sell };
  const total = (inventionEntered() ?? 0) + mat + jobs + tax;
  return { total, profit: personal() ? null : sell - total, pct: personal() ? null : (sell - total) / total * 100, mat, jobs, tax, sell };
}
function realProfit() {
  const sales = salesAt();
  const revenue = sales.reduce((s, x) => s + x.qty * x.unit, 0);
  const market = sales.filter(x => x.channel === 'market').reduce((s, x) => s + x.qty * x.unit, 0);
  const contractFees = sales.filter(x => x.channel === 'contract').reduce((s, x) => s + (x.fees ?? 0), 0);
  const taxes = market * (DATA.fees.broker + DATA.fees.tax) / 100 + contractFees;
  const mat = realMaterial(), inv = inventionComputed() ?? 0, jobs = jobsCost();
  const sold = sales.reduce((s, x) => s + x.qty, 0), unsold = PROJECT.runs - sold;
  const costs = mat === null ? null : inv + mat + jobs + (personal() ? 0 : taxes);
  if (personal() || !sales.length) return { revenue, market, taxes, mat, inv, jobs, costs, profit: null, pct: null, unsold, pending: !personal() };
  const profit = costs === null ? null : revenue - costs;
  const last = sales.filter(x => x.channel === 'market').slice(-1)[0];
  let projProfit = null, projPct = null;
  if (unsold && last && costs !== null) {
    const extra = unsold * last.unit, extraTax = extra * (DATA.fees.broker + DATA.fees.tax) / 100;
    projProfit = revenue + extra - costs - extraTax; projPct = projProfit / (costs + extraTax) * 100;
  }
  return { revenue, market, taxes, mat, inv, jobs, costs, profit, pct: profit === null ? null : profit / costs * 100, unsold, projProfit, projPct, pending: false };
}

const nf = new Intl.NumberFormat('fr-FR');
const nf2 = new Intl.NumberFormat('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtN = v => nf.format(Math.round(v));
const UNK = '<span class="unk">inconnu</span>';
function fmtIsk(v) {
  if (v === null || v === undefined) return UNK;
  const a = Math.abs(v), sg = v < 0 ? '−' : '';
  if (a >= 1e9) return sg + nf2.format(a / 1e9) + ' B';
  if (a >= 1e6) return sg + nf2.format(a / 1e6) + ' M';
  if (a >= 1e3) return sg + nf.format(Math.round(a / 100) / 10) + ' k';
  return sg + nf.format(Math.round(a));
}
const fmtFull = v => v === null || v === undefined ? UNK : nf2.format(v) + ' ISK';
const fmtPct = (v, d = 1) => v === null || v === undefined ? UNK : (v < 0 ? '−' : '') + Math.abs(v).toFixed(d).replace('.', ',') + ' %';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------- Approvisionnement ---------- */
function renderShopping() {
  const rows = DATA.mats.map(m => {
    const st = stockPasted() ? m.stock : 0;
    const bought = purchasesAt().filter(p => p.item === m.name).reduce((s, p) => s + p.qty, 0);
    const toBuy = Math.max(0, m.required - st);
    const p = priceOf(m);
    return `<tr><td>${m.name}</td><td class="r">${fmtN(m.required)}</td><td class="r">${fmtN(st)}</td><td class="r">${fmtN(toBuy)}</td><td class="r">${p === null ? '<span class="unk">Inconnu</span>' : fmtIsk(toBuy * p)}</td>${S.real ? '' : `<td class="r">${bought ? `<span class="c-em">${fmtN(bought)} rattachés</span>` : '<span class="hint">—</span>'}</td>`}</tr>`;
  }).join('');
  const toBuyTotal = DATA.mats.some(m => priceOf(m) === null) ? null : DATA.mats.reduce((s, m) => s + Math.max(0, m.required - (stockPasted() ? m.stock : 0)) * m.price, 0);

    <div class="g3">${kpi('Slots Fabrication', used, max)}${kpi('Slots Réaction', 0, S.state === 'skills_unknown' ? 0 : 3)}${kpi('Slots Science', sciU, sciM)}</div>
    <div class="col">${chars.map(c => `<div class="card flush"><div class="card-h"><div class="row">${who(c.k)}<span class="badge sm ${c.main ? 'b-cyan' : 'b-slate'}">${c.main ? 'Principal' : 'Alt'}</span></div><span class="hint">${c.manuf[0]}/${c.manuf[1] === null ? '<span class="unk">—</span>' : c.manuf[1]} Fabrication | ${c.sci[0]}/${c.sci[1] === null ? '<span class="unk">—</span>' : c.sci[1]} Science</span></div>
      ${c.jobs.length ? `<table class="t"><thead><tr><th>Produit</th><th>Activité</th><th class="r">Runs</th><th>Progression</th><th>Temps restant</th></tr></thead><tbody>${c.jobs.map(j => `<tr><td>${j[0]}${c.k === 'alpha' ? ' <span class="hint">×5 jobs</span>' : ''}</td><td>${j[1]}</td><td class="r">${j[2]}</td><td><div class="row" style="gap:6px">${pbar(j[3])}<span class="mono">${j[3]} %</span></div></td><td class="mono">${j[4]}</td></tr>`).join('')}</tbody></table>` : '<div class="col" style="align-items:center;padding:16px"><span class="hint">Aucun job actif</span></div>'}
      <p class="hint" style="margin:0;padding:8px 16px">${c.manuf[1] === null ? 'slots libres inconnus (compétences)' : `${c.manuf[1] - c.manuf[0]} slots fabrication libres · Construire`}</p></div>`).join('')}</div>
    ${renderGantt(chars)}`;
}
function renderGantt(chars) {
  const toH = t => { const m = t.match(/(\d+) h (\d+)/); return +m[1] + m[2] / 60; };
  const jobs = chars.flatMap(c => c.jobs.map(j => ({ who: PEOPLE[c.k].char, name: j[0], act: j[1], left: toH(j[4]) }))).sort((a, b) => a.left - b.left);
  if (!jobs.length) return '';
  const ticks = [0, 12, 24, 36, 48, 60, 72];
  return `<div class="card p5 col"><div class="row sb"><h3 class="t">Chronologie des Jobs</h3><span class="hint">Prochain slot libre dans <span class="mono c-s200">${jobs[0].left.toFixed(0)} h ${String(Math.round(jobs[0].left % 1 * 60)).padStart(2, '0')}</span></span></div>
    ${jobs.map(j => `<div class="row" style="gap:10px"><span class="hint" style="width:220px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(j.who)} · ${j.name}</span><div class="gantt" style="flex:1"><i class="${j.act === 'Copie' ? 'sci' : ''}" style="left:0;width:${Math.min(100, j.left / 72 * 100)}%"></i></div><span class="mono hint" style="width:70px;text-align:right">${Math.floor(j.left)} h ${String(Math.round(j.left % 1 * 60)).padStart(2, '0')}</span></div>`).join('')}
    <div class="row" style="gap:10px"><span style="width:220px"></span><div class="row sb" style="flex:1">${ticks.map(t => `<span class="hint mono">${t} h</span>`).join('')}</div><span style="width:70px"></span></div></div>`;
}
function ringPct(p) {
  const r = 24, c = 2 * Math.PI * r;
  return `<svg class="ring" viewBox="0 0 56 56"><circle class="bg" cx="28" cy="28" r="${r}"/><circle class="fg" cx="28" cy="28" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - p / 100)}"/><text x="28" y="32" text-anchor="middle" font-size="12" fill="#e2e8f0" font-family="monospace">${Math.round(p)}%</text></svg>`;
}

function modalShell(title, sub, body, foot, wide) {
  return `<div class="ov"><div class="bk" data-act="close"></div><div class="panel ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">
    <div class="ph"><div><h2>${title}</h2>${sub ? `<p>${sub}</p>` : ''}</div><button class="x" data-act="close" aria-label="Fermer">${svg(ICON.x).replace('<svg', '<svg width="16" height="16"')}</button></div>
    <div class="pb">${body}</div>${foot ? `<div class="pf">${foot}</div>` : ''}</div></div>`;
}
function renderCreateModal() {
  return modalShell('Nouveau projet', null, `<div class="field"><label class="fl">Nom du projet (optionnel)</label><input class="input" value="${esc(PROJECT.name)}" placeholder="Ex: Flotte Rorqual, Build Capital..."></div>
    <div class="field"><label class="fl">Produit *</label><div class="row" style="gap:8px"><input class="input" value="Hammerhead II"><span class="badge sm b-violet">T2</span></div></div>
    <div class="g3"><div class="field"><label class="fl">Runs</label><input class="input mono" value="50"></div><div class="field"><label class="fl">ME</label><input class="input mono" value="2"></div><div class="field"><label class="fl">TE</label><input class="input mono" value="4"></div></div>
    <p class="hint" style="margin:0">Multi-produit · Ajouter un produit</p>`, `<button class="btn sec" data-act="close">Annuler</button><button class="btn em" data-hash="p=4">Créer le projet</button>`);
}
function renderCompleteModal() {
  const r = realProfit();
  const check = (ok, txt) => `<div class="check"><span class="ic ${ok ? 'ok' : 'ko'}">${ok ? '✓' : '!'}</span><span>${txt}</span></div>`;
  return modalShell('Terminer le projet', null, `<p class="muted" style="margin:0">Le projet passe en lecture seule : étapes, coûts, nom et date de début. Il reste réactivable.</p>
    <div class="col" style="gap:0"><div>${ptag(8)}</div>
      ${check(true, '6 étapes de production livrées (ESI)')}
      ${check(false, '1 étape jamais lancée : Hammerhead I (BPC), copie · fabriqué depuis le BPO ?')}
      ${check(r.unsold === 0, r.unsold === 0 ? `Tout est vendu : ${PROJECT.runs} / ${PROJECT.runs} Hammerhead II` : `${r.unsold} Hammerhead II invendus`)}
      ${check(r.costs !== null, 'Aucun coût inconnu')}
      ${check(true, `Profit ${fmtIsk(r.profit)} (${fmtPct(r.pct)})`)}</div>`,
    `<button class="btn sec" data-act="close">Annuler</button><button class="btn em" data-hash="p=17">Terminer le projet</button>`);
}
function renderGroupModal() {
  return modalShell('Ouvrir à ma corpo', 'Crée un projet de groupe à partir de ce projet solo', `
    <div class="g2"><div class="field"><label class="fl">Nom du projet de groupe</label><input class="input" value="${esc(PROJECT.name)}"></div><div class="field"><label class="fl">Container corp</label><input class="input" value="${esc(PROJECT.container)}"></div></div>
    <table class="t"><thead><tr><th>Item</th><th class="r">ME</th><th class="r">TE</th><th class="r">Runs</th></tr></thead><tbody><tr><td>Hammerhead II</td><td class="r">2</td><td class="r">4</td><td class="r">50</td></tr></tbody></table>
    <p class="hint" style="margin:0">Liste noire reprise de vos réglages : Advanced Components, Tools (R.A.M.). La BOM de groupe est recalculée (feuilles, prix Jita figés à la création).</p>
    <div class="banner amber">${svg(ICON.warn)}<div><b>À trancher.</b> Ce qui est déjà fait sur le projet solo (jobs, achats rattachés) ne passe pas dans le groupe : le projet de groupe démarre de zéro et le projet solo reste, avec un lien vers lui. Autre option : ne proposer le bouton qu’avant le premier job.</div></div>
    <div>${ptag(9)}</div>`, `<button class="btn sec" data-act="close">Annuler</button><button class="btn pri" data-act="close">Créer le projet de groupe</button>`, true);
}
function renderSaleModal() {
  const contract = S.saleChannel !== 'market';
  return modalShell('Enregistrer une vente', esc(PROJECT.name), `
    <div class="field"><label class="fl">Canal ${ptag(1)}</label><div class="radio"><label class="${contract ? '' : 'on'}" data-act="sale-channel" data-arg="market">Ordre de marché</label><label class="${contract ? 'on' : ''}" data-act="sale-channel" data-arg="contract">Contrat (item exchange)</label></div></div>
    <div class="g2"><div class="field"><label class="fl">Quantité</label><input class="input mono" value="20"></div><div class="field"><label class="fl">${contract ? 'Prix du contrat (ISK)' : 'Prix unitaire (ISK)'}</label><input class="input mono" value="${contract ? '14 960 000' : '748 000'}"></div></div>
    ${contract ? `<div class="field"><label class="fl">Contrat ESI</label><select class="input"><option>Contrat item exchange terminé · 20 Hammerhead II · 14,96 M · acheteur Corp D · 06/11</option><option>Aucun, saisie libre</option></select></div>
      <div class="banner cyan">${svg(ICON.ok)}<div><b>Pas de taxe de vente ni de frais de courtage sur un contrat.</b> Frais réels du contrat lus dans le journal wallet ; inconnus tant qu’il n’est pas lu, jamais 0.</div></div>`
      : `<p class="hint" style="margin:0">Frais de courtage ${fmtPct(DATA.fees.broker)} et taxe de vente ${fmtPct(DATA.fees.tax)} de vos réglages Frais.</p>`}`,
    `<button class="btn sec" data-act="close">Annuler</button><button class="btn pri" data-act="close">Enregistrer</button>`, true);
}
function renderModal() {
  const el = document.getElementById('modal');
  const m = { create: renderCreateModal, complete: renderCompleteModal, group: renderGroupModal, sale: renderSaleModal }[S.modal];
  el.innerHTML = m && S.view !== 'companion' && !(S.real && ['complete', 'group', 'sale'].includes(S.modal)) ? m() : '';
}

/* ---------- Rendu ---------- */
function render() {
  document.body.classList.toggle('long', S.longNames);
  renderMockbar();
  document.documentElement.style.setProperty('--mbh', document.getElementById('mockbar').offsetHeight + 'px');
  const root = document.getElementById('root');
  if (S.view === 'companion') root.innerHTML = renderCompanionPage();
  else root.innerHTML = renderShell({ dashboard: renderDashboard, projects: renderProjects, slots: renderSlots, detail: renderDetail }[S.view]());
  renderModal();
  updateClocks();
}
function toast(msg) {
  const box = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className = 'toast success';
  t.innerHTML = `${svg(ICON.ok)}<span>${msg}</span>`;
  box.appendChild(t);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => t.remove(), 6000);
}
let tickStart = Date.now();
function clockTxt(sec) { sec = Math.max(0, Math.round(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60; return [h, m, s].map(v => String(v).padStart(2, '0')).join(':'); }
function updateClocks() {
  const now = (CLOCK[S.phase] ?? CLOCK[11]) + (Date.now() - tickStart) / 1000;
  document.querySelectorAll('[data-end]').forEach(el => { const left = parseFloat(el.dataset.end) - now; el.textContent = left > 0 ? 'dans ' + clockTxt(left) : 'terminé'; });
}
setInterval(updateClocks, 1000);

function applyHash() {
  const params = new URLSearchParams(location.hash.replace(/^#/, ''));
  const keep = S ? { specOpen: S.specOpen, auditOpen: S.auditOpen } : { specOpen: false, auditOpen: false };
  S = baseState();
  tickStart = Date.now();
  Object.assign(S, keep);
  if (params.get('spec') === '1') S.specOpen = true;
  if (params.get('audit') === '1') S.auditOpen = true;
  S.longNames = params.get('long') === '1';
  S.real = params.get('real') === '1';
  applyNames(S.longNames);
  const p = parseInt(params.get('p') || '0', 10);
  if (p) applyStep(Math.min(LAST_STEP, Math.max(1, p)));
  const v = params.get('v');
  if (v) { S.view = v; if (v !== 'detail') S.modal = null; if (!p) S.step = 0; }
  if (params.get('tab')) { S.tab = params.get('tab'); if (S.created) S.view = 'detail'; }
  if (params.get('size')) S.size = params.get('size');
  if (params.get('s')) S.state = params.get('s');
  if (params.get('modal')) S.modal = params.get('modal') === 'none' ? null : params.get('modal');
  render();
  window.scrollTo(0, 0);
}
function go(hash) { if (location.hash === '#' + hash) applyHash(); else location.hash = hash; }
function setParam(k, v) { const params = new URLSearchParams(location.hash.replace(/^#/, '')); if (v === null) params.delete(k); else params.set(k, v); go(params.toString()); }

function onClick(e) {
  const h = e.target.closest('[data-hash]');
  if (h && !h.disabled) { go(h.dataset.hash); return; }
  const a = e.target.closest('[data-act]');
  if (!a || a.disabled) return;
  const act = a.dataset.act, arg = a.dataset.arg;
  if (act === 'state') return;
  switch (act) {
    case 'tour-start': go('p=1'); break;
    case 'tour-next': go('p=' + Math.min(LAST_STEP, (S.step || 0) + 1)); break;
    case 'tour-prev': go('p=' + Math.max(1, S.step - 1)); break;
    case 'spec-toggle': S.specOpen = !S.specOpen; render(); break;
    case 'audit-toggle': S.auditOpen = !S.auditOpen; render(); break;
    case 'real': setParam('real', S.real ? null : '1'); break;
    case 'long-names': setParam('long', S.longNames ? null : '1'); break;
    case 'tab': if (!S.created) { go('p=15&tab=' + arg); } else { S.view = 'detail'; S.tab = arg; render(); } break;
    case 'close': S.modal = null; render(); break;
    case 'modal': S.modal = arg; render(); break;
    case 'esi-panel': S.esiPanel = !S.esiPanel; render(); break;
    case 'list-mode': S.listMode = arg; render(); break;
    case 'toggle-group': S.expanded[arg] = S.expanded[arg] === false; render(); break;
    case 'calc': S.calc = arg; render(); break;
    case 'cmp-moved': S.moved = true; render(); break;
    case 'cmp-list': S.listed = true; render(); break;
    case 'link': S.links[arg] = true; render(); toast(arg.startsWith('S') ? 'Contrat rattaché comme vente · sans taxe' : 'Achat rattaché au projet'); break;
    case 'link-all': DATA.purchases.filter(p => p.id !== 'P5' || S.phase >= 11).forEach(p => { S.links[p.id] = true; }); render(); toast('Achats rattachés au projet'); break;
    case 'sale-channel': S.saleChannel = arg; render(); break;
    case 'copy-recap': S.recapCopied = true; render(); toast('Récapitulatif copié'); break;
  }
}
function onChange(e) {
  const a = e.target.closest('[data-act]');
  if (a && a.dataset.act === 'state') setParam('s', a.value === 'normal' ? null : a.value);
}
document.addEventListener('click', onClick);
document.addEventListener('change', onChange);
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, select')) return;
  if (e.key === 'ArrowRight' && S.step < LAST_STEP) go('p=' + ((S.step || 0) + 1));
  if (e.key === 'ArrowLeft' && S.step > 1) go('p=' + (S.step - 1));
  if (e.key === 'Escape' && S.modal) { S.modal = null; render(); }
});
window.addEventListener('hashchange', applyHash);
applyHash();
</script>
</body>
</html>
