# Dev overrides — loaded automatically by `docker compose up`
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./proxy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - proxy_data:/data
      - proxy_config:/config
    environment:
      - DOMAIN=${DOMAIN:-evetools.local}
      - TLS_EMAIL=internal
    networks:
      evetools_net:
        ipv4_address: 10.169.0.2
    depends_on:
      - frontend
      - app

  frontend:
    image: node:22-alpine
    restart: unless-stopped
    logging: *default-logging
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 80"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      evetools_net:
        ipv4_address: 10.169.0.3
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://0.0.0.0:80/"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: evetools-app-dev
    volumes:
      - .:/app
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - APP_ENV=dev

  worker:
    # -vv logs every consumed message; kept for local debugging only
    command: ["bin/console", "messenger:consume", "async", "scheduler_default", "--time-limit=3600", "--memory-limit=256M", "-vv"]
    volumes:
      - .:/app
    environment:
      - APP_ENV=dev

  rabbitmq:
    image: rabbitmq:4-management-alpine
